<style>
:root{color-scheme:dark;--bg:#10151e;--panel:#19212e;--line:#2c384a;--muted:#99a9c0;--blue:#8eb7ff;--text:#e7edf7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}aside{background:#141c28;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column}.brand{font-weight:750;font-size:23px;letter-spacing:2px;padding:0 12px}.caption{color:var(--muted);font-size:12px}.brand-sub{padding:4px 12px 32px}nav button{width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:13px 16px;border-radius:8px;margin-bottom:7px}nav button.active{background:#253a59;color:#c2d8ff}.aside-foot{margin-top:auto;padding:40px 12px 0;color:var(--muted);font-size:12px}main{padding:0 34px 30px;max-width:1600px;width:100%;margin:auto}header{min-height:77px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}.badge{font-size:11px;padding:4px 9px;border-radius:5px;background:#27364c;color:#b8d3ff}.demo{background:#3b3222;color:#e7c688}.hero{display:flex;justify-content:space-between;align-items:center;margin:28px 0 20px;gap:12px}h1{font-size:27px;letter-spacing:.5px;margin:0 0 5px}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0 0 10px}p{margin:8px 0 16px}.muted{color:var(--muted)}.toolbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:16px}label{display:block;font-size:12px;color:var(--muted)}input,select{display:block;background:#101823;border:1px solid #3c4d65;color:var(--text);border-radius:6px;padding:8px 10px;margin-top:5px;max-width:100%}.btn{border:1px solid #3c4d65;background:#243247;color:var(--text);border-radius:6px;padding:8px 14px}.primary{background:#5086e5;border-color:#5086e5;color:white}.toolbar .push{margin-left:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:18px 0}.step{background:#141e2c;border:1px solid #35435a;padding:13px 12px;border-radius:8px;text-align:left;color:var(--text);position:relative}.step.selected{border-color:#8eb7ff;background:#213552}.step .n{display:block;color:var(--blue);font-size:11px;margin-bottom:9px}.step strong{font-size:13px}.step small{display:block;color:var(--muted);font-size:11px;margin-top:7px}.step.done small{color:#92d1b4}.step.running{box-shadow:inset 0 -3px #88b3ff}.detail-head{padding-bottom:18px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:22px}.tabs button{border:0;background:transparent;color:var(--muted);padding:12px 0;border-bottom:2px solid transparent}.tabs button.active{color:#bad4ff;border-bottom-color:#8eb7ff}.two{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr);gap:22px}.box{background:#131c29;border:1px solid var(--line);padding:18px;border-radius:8px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.metric{background:#131c29;padding:14px;border-radius:7px}.metric strong{display:block;font-size:21px;margin-top:5px}.chart{width:100%;height:180px;display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;font-weight:400}.rules{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rules article{border:1px solid var(--line);padding:18px;border-radius:8px}.rules p{color:#b5c2d5;font-size:13px;margin-bottom:0}.note{border-left:3px solid #729ee8;background:#1e3049;padding:12px 15px;margin-top:18px;font-size:13px;color:#bed0ea}.sources{font-size:12px;margin-top:16px;color:var(--muted)}details{padding:15px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer}details p{color:#b5c2d5}.check{display:flex;gap:8px;align-items:center}.check input{margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cards .panel{margin:0}.cards p{color:var(--muted)}.log{font:12px/1.8 Consolas,monospace;color:#a9bbd5;max-height:140px;overflow:auto}.toast{position:fixed;bottom:24px;right:24px;max-width:420px;background:#294260;border:1px solid #6889b5;border-radius:9px;padding:14px 20px;z-index:3;box-shadow:0 8px 32px #0006}[hidden]{display:none!important}a{color:#a9caff}dialog{background:var(--panel);color:var(--text);border:1px solid #536b8d;border-radius:12px;width:min(600px,90vw);padding:25px}dialog::backdrop{background:#0009}@media(max-width:1100px){.shell{grid-template-columns:175px minmax(0,1fr)}main{padding:0 22px 25px}.flow{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.toolbar .push{margin-left:0}}@media(max-width:650px){.shell{display:block}aside{padding:16px}.brand-sub,.aside-foot{display:none}nav{display:flex;margin-top:15px;overflow:auto}nav button{width:auto;white-space:nowrap;margin-right:5px}main{padding:0 15px 20px}.rules{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.hero,header{flex-wrap:wrap}.flow{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch}.tabs{gap:20px;font-size:12px}}

<body><div class="shell"><aside><div class="brand">CHAN<span style="color:#80abf6">.</span></div><div class="caption brand-sub">缠论分析工作台</div><nav aria-label="主导航" id="nav"></nav><div class="aside-foot">流程 · 规则 · 结果<br>在一个工作台中完成<br><br>V2 / 设计评审原型<br>本地演示，无真实图表操作</div></aside>
<main><header><div><strong>黄金 / XAUUSD</strong> <span class="caption">　OANDA · 主图</span></div><div class="row"><span class="badge">TradingView · 示例连接</span><span class="badge demo">交互原型 · 示例数据</span></div></header><div class="hero"><div><h1 id="pageTitle">分析工作台</h1><div class="muted" id="pageDesc">从结构识别到进出场，按顺序完成一轮分析。</div></div><span class="caption">所有示例时间均为北京时间</span></div>
<section id="work"><div class="toolbar"><label>目标图表<select><option>黄金主图 · OANDA:XAUUSD</option></select></label><label>起始日期<input id="from" type="date" value="2026-06-30"></label><label>更新模式<select id="mode"><option value="manual">手动更新</option><option value="auto">自动更新</option></select></label><label id="everyLabel" hidden>间隔（分钟）<input id="every" type="number" value="5" min="1" max="1440" style="width:100px"></label><div class="row push"><button class="btn primary" id="run">更新全部 · 演示</button><button class="btn" id="stop" disabled>停止</button></div></div>
<section class="panel"><div class="row between"><h2>完整分析流程</h2><span class="caption" id="schedule">手动模式 · 等待执行</span></div><div class="flow" id="flow"></div><div class="row between"><span class="caption">按步骤执行；点击模块可查看操作、规则和前置依赖。</span><span class="caption" id="last">最近完整更新：尚未演示</span></div></section>
<section class="panel"><div class="row between detail-head"><div><span class="caption" id="eyebrow"></span><h2 id="moduleTitle"></h2></div><button class="btn" id="single">更新当前模块</button></div><div class="tabs" role="tablist" aria-label="模块详情" id="tabs"></div><div id="detail" role="tabpanel"></div></section><details class="panel"><summary>运行记录 <span class="caption"> / 演示日志</span></summary><div class="log" id="log">等待开始。</div></details></section>
<section id="other" hidden></section></main></div><div id="toast" class="toast" role="status" hidden></div><dialog id="dialog"><div class="row between"><h2 id="dialogTitle"></h2><button class="btn" id="close">关闭</button></div><div id="dialogBody"></div></dialog>
<script>
const $=id=>document.getElementById(id);
const modules=[
{name:'画笔',desc:'识别走势结构，并将最新有效笔同步到图表。',deps:[],source:'chan-bi / chan-core',rules:[['包含与分型','相邻包含K线按方向合并：向上取高高，向下取低低。顶底分型使用原始极值时间定位。'],['普通成笔','顶底交替，合并K线间隔至少4，原始K线覆盖至少5；还需满足端点极值和分型范围脱离条件。'],['特殊成笔与回溯','显著跳空与MACD红绿切换有例外路径；MACD短笔仍要求原始K线至少4根和区间极值条件。弱端点会按规则回溯替换。'],['末笔与窗口','末笔只沿原方向延伸至更极端价格，不自动补出未成笔的反向走势。15分钟保留最近30天，3分钟最近15天。'],['过滤与时间校准','默认幅度过滤系数0.5×ATR；端点用低一级K线校准。跳空锁定笔不参与普通末笔延伸。'],['颜色与可见性','日线红、4小时蓝、1小时黄、15分钟紫、3分钟青蓝。源周期笔按设定范围向低级别显示。']],example:'下跌笔结束后，后续反弹若已形成有效上涨笔，应在更新后出现；若反弹尚未成笔，不会强行连到最新价。',out:'各周期笔数据与折线图形'},
{name:'标记买卖点',desc:'在笔结构上识别买卖点，保留区间套与背驰约束。',deps:[0],source:'mark-buy-sell / chan-core',rules:[['一买 / 一卖','同向笔创新低／新高并出现MACD背驰。面积减小、DIF极值减弱、柱最大高度减小，任一满足即为背驰。'],['二买 / 二卖','在上一级上涨笔内寻找首个抬高低点；下跌笔内寻找首个降低高点。类二点继续满足同方向结构限制。'],['三买 / 三卖','二买后的无背驰上涨突破前顶，回调不破该前顶，并满足上级上涨笔约束；三卖方向对称。采用本项目规则。'],['数量与定位','默认每周期买卖合计保留最近10个。低级别一买锚定上级底部端点，一卖锚定上级上涨笔结束点。']],example:'前顶100，二买后上涨至110且未背驰，回调至103；只有同时满足上级上涨笔约束，才成为三买候选。',out:'各周期买卖点文字标记'},
{name:'画中枢',desc:'用本级笔构建中枢，在同一个上级笔区间内分解。',deps:[0],source:'chan-zs / chan-core',rules:[['同级构建，上级分段','本级中枢使用本级笔计算，不能跨越一个上级笔的区间。计算中枢不修改笔。'],['形成与显示','三笔重叠启动计算，向后延伸；本项目至少5笔（含离开笔）才绘制中枢。'],['价格区间','按构成中枢的全部笔重叠计算上下边界，而非直接使用整个波动区间。'],['绘图边界','水平边缘按进入笔终点与离开笔起点确定，并左右各外扩5根本周期K线。']],example:'1小时中枢必须完整属于同一个4小时笔段；即使跨段价格仍重叠，也不能合并成一个中枢。',out:'中枢矩形及结构数据'},
{name:'支阻位',desc:'沿用WEB参数与预设，向进出场提供同轮关键价位。',deps:[0],source:'WEB sr_service / sr_flip（统一接入待实现）',rules:[['来源选择','支持密集区、黄金分割与BOLL来源。使用参数配置中选择的开关和周期设置。'],['密集区','基于价格聚类、反复测试与支阻角色互换；近期极值作为另一类候选，按参数生成与筛选。'],['黄金分割与BOLL','黄金分割参考对应结构笔；BOLL按设定长度与倍数计算。具体使用当前WEB参数预设。'],['合并与消费','候选价位经截断、合并与选取形成结果。新版规划让图上支阻位与进出场读取同轮结果。']],example:'切换支阻位预设后，下一轮重新计算支阻位，并更新依赖它的进出场结果；不能只改显示而继续使用旧价位。',out:'支阻线、明细及供进出场消费的合并价位'},
{name:'交易计划',desc:'按周期分类震荡或趋势，并根据最近结构映射策略。',deps:[0],source:'trading-plan',rules:[['震荡优先','按横盘条件或处于上一级最后一笔内的未离开中枢判定震荡，命中则观望。'],['最新端点优先','趋势时先匹配最后一笔端点的买卖点；没有匹配再向前查找最近有买卖点的笔端点。'],['策略映射','最新端点精确匹配时映射对应策略；向前查找时按买卖方向生成兜底策略；没有匹配则观望。'],['与图形的依赖区别','计划直接读取笔数据并计算买卖点和中枢，不要求先画出这些图形。完整流程仍按统一顺序执行。']],example:'“等待回调后做2买”是计划状态；仍需进出场模块检验背驰、支阻位附近等条件，才产生进场标记。',out:'逐周期方向、策略、理由与图上计划文字'},
{name:'标记进出场',desc:'核验策略全部条件，标记进场并模拟后续退出。',deps:[0,3,4],source:'mark-entry（现有脚本规则）',rules:[['三个公共条件','反向运动够笔；以下级别存在方向匹配背驰，取最新者；背驰价在支阻位附近，默认距离≤检测周期ATR×1.0。'],['二买 / 二卖策略','二买要求DIF>0并且上涨段过前高；二卖要求DIF<0并且下跌段破前底，另需满足全部公共条件。'],['等待一买 / 一卖','一买要求下跌够笔、破前低且离开中枢力度减弱；一卖方向对称。普通回调买点／反弹卖点仅要求公共条件。'],['止损参考位','多头取进场价下方支阻位，空头取上方支阻位，盘中突破触发退出。现有JS脚本无正确侧位时不设支阻止损，仅按止盈规则退出；与回测口径需区分。'],['保本、半平、全平','背驰周期有利笔完成后移至保本；检测周期有利笔完成且已保本后半平；检测周期不利笔破前同向端点时全平。'],['互斥与显示','同向未平仓时过滤新同向信号，多空独立。进场多红↑、空绿↓，出场黄箭头；画在背驰周期。未启用30秒时，3分钟状态无更低周期可供检测。']],example:'1小时计划做多，15分钟出现底背驰且靠近支阻位；满足策略全部条件后，进场箭头画在15分钟，不画在1小时。',out:'进场、出场、仍持仓及被同向互斥过滤的记录'}
];
let selected=0,tab=0,page=0,timer=null,autoTimer=null,states=modules.map(()=> '待更新'),queue=[],logs=[],toastTimer;
const navs=['分析工作台','回测与监控','参数配置','使用指南'];
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function log(s){logs.push(new Date().toLocaleTimeString('zh-CN')+'  '+s);$('log').textContent=logs.join('\n');$('log').style.whiteSpace='pre-wrap'}
function drawFlow(){$('flow').innerHTML=modules.map((m,i)=>`<button class="step ${i===selected?'selected':''} ${states[i]==='已完成'?'done':''} ${states[i]==='更新中'?'running':''}" data-module="${i}" aria-pressed="${i===selected}"><span class="n">0${i+1}${i<5?'　→':''}</span><strong>${m.name}</strong><small>${states[i]}</small></button>`).join('')}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function detail(){const m=modules[selected];$('moduleTitle').textContent=m.name;$('eyebrow').textContent=`步骤 0${selected+1} / ${m.desc}`;$('tabs').innerHTML=['操作与结果','规则说明','依赖与示例'].map((x,i)=>`<button role="tab" aria-selected="${i===tab}" class="${i===tab?'active':''}" data-tab="${i}">${x}</button>`).join('');
if(tab===1){$('detail').innerHTML=`<div class="row between" style="margin-bottom:18px"><span class="badge">项目现有规则摘要</span><span class="caption">${m.source}</span></div><div class="rules">${m.rules.map(r=>`<article><h3>${r[0]}</h3><p>${r[1]}</p></article>`).join('')}</div><div class="sources">说明依据现有技能文档整理；新增调度和WEB统一数据链为设计方案，原型未接入算法。</div>`;return}
if(tab===2){$('detail').innerHTML=`<div class="two"><div class="box"><h3>运行前置</h3><p>${m.deps.length?m.deps.map(i=>`<button class="btn" data-module="${i}">${modules[i].name}</button>`).join(' '):'TradingView连接正常，选择目标品种与起始日期。'}</p><p class="muted">所有输入须属于同一品种，日期与周期范围一致；过期前置由完整流程重新生成。</p><h3>本步骤输出</h3><p>${m.out}</p></div><div class="box"><h3>操作示例</h3><p>${m.example}</p></div></div><div class="note">流程顺序与数据依赖不同：中枢和买卖点都依赖笔；交易计划自行计算所需结构；进出场依赖笔、支阻位和计划。完整更新仍依次执行六步。</div>`;return}
let output=selected===0?`<div class="box"><div class="row between"><h3>15分钟结构预览</h3><span class="caption">示意走势 · 非真实行情</span></div><svg class="chart" viewBox="0 0 650 180" role="img" aria-label="15分钟笔结构示意，紫色线连接交替高低点"><g stroke="#2c384a"><path d="M0 40H650M0 85H650M0 130H650"/></g><path d="M10 135L80 70L145 115L220 30L290 90L360 65L440 150L540 42L630 68" fill="none" stroke="#af8aff" stroke-width="3"/><text x="10" y="175" fill="#99a9c0" font-size="11">历史结构</text><text x="542" y="175" fill="#99a9c0" font-size="11">最近走势</text></svg></div>`:selected===4?table(['周期','方向','策略','状态'],['日线','4小时','1小时','15分钟','3分钟'].map(r=>[r,'观望','等待结构确认','示例'])):selected===5?table(['检测周期','背驰周期','方向','判定'],[['1小时','15分钟','多','等待全部条件满足'],['15分钟','3分钟','空','支阻距离未满足 · 示例']]):table(['周期','结果内容','数据状态'],['日线','4小时','1小时','15分钟','3分钟'].map(r=>[r,selected===1?'买卖点文字':selected===2?'中枢区间':'合并支阻价位','示例待接入']));
$('detail').innerHTML=`<div class="two"><div>${output}<div class="metrics"><div class="metric"><span class="caption">执行状态</span><strong>${states[selected]}</strong></div><div class="metric"><span class="caption">分析范围</span><strong>5 个周期</strong></div><div class="metric"><span class="caption">结果口径</span><strong>示例</strong></div></div></div><div class="box"><h3>模块设置</h3><label>显示周期<select><option>全部默认周期</option><option>15分钟（预览）</option><option>1小时（预览）</option></select></label><p class="caption">${selected===0?'15分钟：最近30天<br>3分钟：最近15天':selected===1?'每周期默认保留最近10个买卖点':selected===3?'支阻参数统一在“参数配置”管理':selected===5?'近支阻阈值默认1.0×ATR；30秒级别默认关闭':'沿用现有模块参数'}</p><button class="btn" data-tab="1">查看完整规则摘要 →</button><details><summary>高级设置</summary><p class="caption">正式版本在此提供本模块支持的可调参数，固定算法规则在“规则说明”中查看。</p></details></div></div>`;
}
function render(){drawFlow();detail()}
function navigate(i){page=i;$('nav').innerHTML=navs.map((n,j)=>`<button data-page="${j}" class="${i===j?'active':''}">${n}</button>`).join('');$('pageTitle').textContent=navs[i];$('pageDesc').textContent=['从结构识别到进出场，按顺序完成一轮分析。','历史验证与实时观察，统一管理任务占用。','参数与预设统一管理，变更在下一轮分析生效。','先了解操作路径，再进入各模块查看具体规则。'][i];$('work').hidden=i!==0;$('other').hidden=i===0;if(i===0){render();return}
if(i===1)$('other').innerHTML=`<div class="cards">${['全量回测','K线回放','实时监控'].map((n,j)=>`<article class="panel"><span class="caption">0${j+1} / 验证与观察</span><h2 style="margin:12px 0">${n}</h2><p>${['使用历史数据检验策略，查看进出场记录与收益表现。','按历史时间推进图表，观察信号与结构如何形成。','检测新收盘K线，记录实时信号与后续状态。'][j]}</p><button class="btn" data-config="${n}">配置${n}</button></article>`).join('')}</div><div class="note">运行占用提示：图表任务串行协调。回放或监控运行时，分析自动更新显示等待，不并行切换周期。</div><section class="panel" style="margin-top:18px"><h2>历史运行</h2>${table(['任务','模式','状态'],[['示例运行 001','全量回测','未连接真实历史记录']])}</section>`;
if(i===2)$('other').innerHTML=`<section class="panel"><div class="row between"><h2>支阻位参数</h2><span class="badge">与进出场共用</span></div><div class="toolbar" style="margin-top:20px"><label>预设<select id="preset"><option>默认参数</option><option>黄金短线 · 示例</option></select></label><button class="btn" data-action="保存预设">保存预设</button><button class="btn" data-action="导入Excel">导入Excel</button><button class="btn" data-action="导出Excel">导出Excel</button></div><h3>价位来源</h3><div class="row">${['密集区','BOLL','黄金分割'].map((n,j)=>`<label class="check"><input type="checkbox" ${j<2?'checked':''}>${n}</label>`).join('')}</div><details open><summary>周期与参数</summary>${table(['周期','参与计算','最少触及次数（示例）'],['日线','4小时','1小时','15分钟','3分钟'].map((n,j)=>[n,`<input type="checkbox" checked aria-label="${n}参与计算">`,`<input type="number" min="1" value="${[4,4,4,3,8][j]}" aria-label="${n}最少触及次数" style="width:85px">`]))}</details><details><summary>合并、截断与绘图设置</summary><p>承接现有支阻位页面的通用计算和显示参数。</p></details><div class="row" style="margin-top:20px"><button class="btn primary" data-action="计算并预览">计算并预览</button><button class="btn" data-config="自动调参">自动调参</button></div></section><div class="note">原型中参数仅作交互展示，不会保存或改变当前WEB预设。</div>`;
if(i===3)$('other').innerHTML=`<section class="panel"><h2>第一次使用</h2><p class="muted">选择目标图表与起始日期 → 检查参数预设 → 更新全部 → 查看结果与规则 → 按需开启自动。</p><div class="row">${modules.map((m,j)=>`<button class="btn" data-rule="${j}">${m.name}规则</button>`).join('')}</div>${[['如何查看模块规则？','在分析工作台点击流程中的模块，再选择“规则说明”。“依赖与示例”解释所需输入及常见场景。'],['手动与自动有什么区别？','手动点击更新；自动默认每5分钟执行完整流程，可修改间隔。原型只演示状态和倒计时，不访问行情。'],['运行中再次触发怎么办？','正式设计合并重复触发，不积压任务；当前原型在运行中禁用更新按钮。'],['为什么右侧可能没有笔？','先检查更新时间；已过期应更新。即使数据最新，未满足成笔条件的反向走势也不会强行连线。'],['说明与实际功能的边界','模块规则为现有项目文档摘要；自动调度、依赖补齐和WEB统一数据链为待实现方案。现有JS进出场与Python回测的止损等口径不能混为一谈。']].map(r=>`<details><summary>${r[0]}</summary><p>${r[1]}</p></details>`).join('')}</section>`}
function finish(){clearTimeout(timer);timer=null;$('run').disabled=false;$('single').disabled=false;$('stop').disabled=true;render();if($('mode').value==='auto')schedule();else $('schedule').textContent='手动模式 · 本轮结束'}
function tick(){if(!queue.length){$('last').textContent='最近演示结束：'+new Date().toLocaleTimeString('zh-CN');log('本轮演示完成。');finish();return}const i=queue.shift();states[i]='更新中';log('开始 '+modules[i].name);render();timer=setTimeout(()=>{states[i]='已完成';log('完成 '+modules[i].name);tick()},850)}
function start(ids){if(timer)return;if(!$('from').value){toast('请填写起始日期。');return}clearTimeout(autoTimer);queue=[...ids];ids.forEach(i=>states[i]='待更新');$('run').disabled=true;$('single').disabled=true;$('stop').disabled=false;$('schedule').textContent='正在演示 · 图表任务串行执行';tick()}
function dependencies(i,set=new Set()){modules[i].deps.forEach(d=>dependencies(d,set));set.add(i);return [...set].sort((a,b)=>a-b)}
function schedule(){clearTimeout(autoTimer);const mins=Number($('every').value);if(!Number.isFinite(mins)||mins<1||mins>1440){toast('更新间隔请填写1至1440分钟。');$('schedule').textContent='自动设置无效';return}const time=new Date(Date.now()+mins*60000).toLocaleTimeString('zh-CN');$('schedule').textContent=`自动演示 · 每${mins}分钟 · 下次 ${time}`;autoTimer=setTimeout(()=>start([0,1,2,3,4,5]),mins*60000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page!==undefined)navigate(+b.dataset.page);if(b.dataset.module!==undefined){selected=+b.dataset.module;render()}if(b.dataset.tab!==undefined){tab=+b.dataset.tab;detail()}if(b.dataset.rule!==undefined){selected=+b.dataset.rule;tab=1;navigate(0)}if(b.dataset.action)toast(b.dataset.action+'：此原型仅展示入口，不执行或保存真实数据。');if(b.dataset.config){$('dialogTitle').textContent=b.dataset.config+' · 配置预览';$('dialogBody').innerHTML='<p class="muted">此区域将承接现有功能设置。</p><label>数据起点<input type="date" value="2026-06-30"></label><p class="note">运行前检查图表占用状态。原型不启动真实任务。</p>';$('dialog').showModal()}});
$('close').onclick=()=>$('dialog').close();$('run').onclick=()=>start([0,1,2,3,4,5]);$('single').onclick=()=>{const ids=dependencies(selected);toast('演示依赖链：'+ids.map(i=>modules[i].name).join(' → '));start(ids)};
$('stop').onclick=()=>{clearTimeout(timer);clearTimeout(autoTimer);timer=null;queue=[];states=states.map(s=>s==='更新中'?'已停止':s);$('mode').value='manual';$('everyLabel').hidden=true;finish();log('用户停止演示并关闭自动模式。')};
$('mode').onchange=()=>{$('everyLabel').hidden=$('mode').value!=='auto';clearTimeout(autoTimer);if($('mode').value==='auto'){if(!timer)start([0,1,2,3,4,5])}else $('schedule').textContent=timer?'本轮演示结束后停止自动':'手动模式 · 等待执行'};$('every').onchange=()=>{if($('mode').value==='auto'&&!timer)schedule()};navigate(0);
</script></body></html>
