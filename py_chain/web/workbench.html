<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缠论分析工作台</title><link rel="stylesheet" href="/shell.css"></head>
<body><div class="shell"><aside><div class="brand">CHAN<span style="color:#80abf6">.</span></div><div class="caption brand-sub">缠论分析工作台</div><nav aria-label="主导航" id="nav"></nav><div class="aside-foot">流程 · 规则 · 结果<br>在一个工作台中完成<br><br>TradingView Desktop<br>本地分析控制台</div></aside>
<main><header><div><strong id="symbolLabel">尚未选择图表</strong></div><div class="row"><span class="badge" id="connection">TradingView待连接</span><span class="caption" id="webConnection">连接服务中</span><span class="caption">北京时间</span></div></header><div class="hero"><div><h1 id="pageTitle">分析工作台</h1><div class="muted" id="pageDesc">从结构识别到进出场，按顺序完成一轮分析。</div></div></div>
<section id="work"><div class="toolbar"><label>目标图表<select id="target"><option value="">读取图表中…</option></select></label><button class="btn" id="refreshTargets">刷新图表</button><label>起始日期<input id="from" type="date" required></label><label>更新模式<select id="mode"><option value="manual">手动更新</option><option value="auto">自动更新</option></select></label><label id="everyLabel" hidden>轮次间隔（分钟）<input id="every" type="number" value="5" min="1" max="1440" style="width:90px"></label><div class="row push"><button class="btn primary" id="run">更新全部</button><button class="btn" id="stop" disabled>停止</button></div></div>
<details class="panel"><summary>分析配置与支阻位预设</summary><div class="toolbar"><label>支阻位预设<select id="preset"><option value="default">WEB默认参数</option></select></label><label>每周期买卖点数量<input id="keep" type="number" min="1" max="100" value="10"></label><label>近支阻阈值（×ATR）<input id="near" type="number" min="0.01" step="0.1" value="1"></label><label class="check"><input id="with30s" type="checkbox">启用30秒背驰数据</label><button class="btn" id="save">保存配置</button></div><p class="caption">默认分析日 / 4小时 / 1小时 / 15分钟 / 3分钟。选用的WEB支阻预设原样保留参数；品种和起始日期使用本页设置。配置修改在下一轮生效。</p></details>
<section class="panel"><div class="row between"><h2>完整分析流程</h2><span class="caption" id="schedule">手动模式 · 等待执行</span></div><div class="flow" id="flow"></div><div class="row between"><span class="caption">单项执行自动更新必要前置。灰色步骤表示本轮未更新，不能视为同轮结果。</span><span class="caption" id="last"></span></div></section>
<div class="note" id="error" role="alert" hidden></div>
<section class="panel"><div class="row between detail-head"><div><span class="caption" id="eyebrow"></span><h2 id="moduleTitle"></h2></div><button class="btn" id="single">更新当前模块</button></div><div class="tabs" role="tablist" aria-label="模块详情" id="tabs"></div><div id="detail" role="tabpanel"></div></section><details class="panel" open><summary>运行记录</summary><div class="log" id="log" style="white-space:pre-wrap">等待开始。</div></details></section>
<section id="other" hidden></section><iframe id="legacy" title="功能页面" hidden style="width:100%;height:calc(100vh - 210px);min-height:700px;border:0;border-radius:10px"></iframe></main></div><div id="toast" class="toast" role="status" hidden></div><script src="/analysis.js"></script></body></html>
