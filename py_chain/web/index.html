async function openBtDetail(id) {
  const epoch = ++btDetailEpoch;
  btAnalyzeBusy = false;
  btDetailRunId = null;
  btDetailSignals = [];
  btDetailSelectedId = null;
  btDetailSummary = null;
  btDetailPnlSort = 'none';
  el('bt-detail-title').textContent = '方案明细';
  el('bt-detail-title').title = '';
  el('bt-detail-meta').textContent = '';
  el('bt-detail-body').innerHTML = '<div class="bt-empty" role="status">正在加载方案…</div>';
  showBtDetailShell();
  selectBtDetailTab('overview');
  let run;
  try {
    const resp = await fetch(`/api/bt/runs/detail?id=${encodeURIComponent(id)}`);
    const d = await resp.json();
    if (!resp.ok || !d.ok) throw Error(d.error || `请求失败 ${resp.status}`);
    run = d.run;
  } catch (e) {
    if (epoch !== btDetailEpoch) return;
    el('bt-detail-body').innerHTML = `<div class="bt-empty" role="status"><p class="bt-error">明细加载失败：${esc(e.message)}</p><button id="bt-detail-retry" type="button">重新加载</button></div>`;
    el('bt-detail-retry').onclick = () => openBtDetail(id);
    return;
  }
  if (epoch !== btDetailEpoch) return;
  fillBtDetail(run);
  // 未做过亏损归因的方案自动分析一次；失败在卡片内提示，已分析的直接展示快照。
  if (!(run.summary?.loss_analysis?.lookahead != null)) await analyzeBtDetail();
}

async function analyzeBtDetail() {
  if (!btDetailRunId || btAnalyzeBusy) return;
  const raw = el('bt-detail-lookahead').value;
  const lookahead = Number(raw);
  if (!Number.isSafeInteger(lookahead) || lookahead < 1) {
    setBtAnalysisStatus('回看根数须为正整数', true);
    return;
  }
  const epoch = btDetailEpoch, runId = btDetailRunId;
  btAnalyzeBusy = true;
  const btn = el('bt-detail-analyze');
  if (btn) { btn.disabled = true; btn.textContent = '分析中…'; }
  setBtAnalysisStatus('正在分析亏损原因…');
  try {
    const response = await fetch('/api/bt/runs/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: runId, lookahead }),
    });
    const r = await response.json();
    if (epoch !== btDetailEpoch || runId !== btDetailRunId) return;
    if (!response.ok || !r.ok || !r.run) throw Error(r.error || `请求失败 ${response.status}`);
    // 同步列表缓存里的 summary.loss_analysis
    const cached = btRuns.find(x => x.id === runId);
    if (cached) {
      if (!cached.summary) cached.summary = {};
      cached.summary.loss_analysis = r.run.summary?.loss_analysis;
    }
    fillBtDetail(r.run, true);
    setBtAnalysisStatus('分析完成 · 信号后 ' + lookahead + ' 根');
  } catch (e) {
    if (epoch === btDetailEpoch && runId === btDetailRunId) setBtAnalysisStatus('分析失败：' + e.message + '。可点击“分析方案”重试。', true);
  } finally {
    if (epoch === btDetailEpoch && runId === btDetailRunId) {
      btAnalyzeBusy = false;
      const current = el('bt-detail-analyze');
      if (current) { current.disabled = false; current.textContent = '分析方案'; }
    }
  }
}

function setBtAnalysisStatus(message, error = false) {

}

// 条形比例尺 = 全部展示盈亏（含半平行）的 |pnl| 最大值；取出场级而非交易级，
// 因半平部分与剩余腿之和可能超过任何单笔 |pnl|；无有效样本返回 null（表格回退纯文本）
function pnlScaleMax(rows) {
  let m = 0;
  for (const r of rows) for (const x of exitDisplayRows(r)) {
    const v = x.pnl == null ? NaN : Number(x.pnl);
    if (Number.isFinite(v) && Math.abs(v) > m) m = Math.abs(v);
  }
  return m > 0 ? m : null;
}
function btDetailRowsHtml() {
  if (!btDetailSignals.length) return '<tr><td colspan="17"><div class="bt-empty">本方案暂无信号记录</div></td></tr>';
  // 仅排列展示副本；序号仍按方案原始顺序；无盈亏的记录始终置后
  const rows = btDetailSignals.slice();
  const sort = btDetailPnlSort;
  if (sort !== 'none') {
    rows.sort((a, b) => {
      const aValue = a.pnl == null ? NaN : Number(a.pnl);
      const bValue = b.pnl == null ? NaN : Number(b.pnl);
      const aValid = Number.isFinite(aValue), bValid = Number.isFinite(bValue);
      if (!aValid || !bValid) return aValid ? -1 : bValid ? 1 : 0;
      return sort === 'ascending' ? aValue - bValue : bValue - aValue;
    });
  }
  return signalRowsHtml(rows, {
    interactive: true,
    selectedId: btDetailSelectedId,
    labelById: btDetailLabelById(),
    showLossReason: true,
    pnlBars: pnlScaleMax(rows),
  });
}

async function locateDetailRow(id) {
  if (locatePending) return;
  const row = btDetailSignals.find(r => r.id === id);
  if (!row) return;
  btDetailSelectedId = id;
  if (markBusy || isAnyModeRunning()) {
    setBtDetailLocateMsg('图表正被任务占用，请结束运行或暂停中的任务，并等待图表操作完成后再定位', true);
    renderBtDetailRows();
    return;
  }
  const mode = row.mode === 'replay' || row.mode === 'live' ? row.mode : 'backtest';
  const pending = { mode, id, source: 'detail', detailEpoch: btDetailEpoch };
  locatePending = pending;
  setBtDetailLocateMsg(`#${btDetailLabelOf(id)} 定位并标记中…（实时历史不够时会用K线回放跳转，最多等待360秒）`);
  renderBtDetailRows();
  updateMarkButtons();
  try {
    const response = await fetch('/api/signals/locate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode, id, row, after_bars: locateAfterBars(),
        colors: {
          buy: el('mark-color-buy').value, sell: el('mark-color-sell').value,
          exit: el('mark-color-exit').value, sr: el('mark-color-sr').value,
        },
      }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw Error(data.error || '定位请求失败');
    pending.jobId = data.job.jobId;
    pollLocate();
  } catch (e) {
    if (pending.detailEpoch === btDetailEpoch) setBtDetailLocateMsg(`#${btDetailLabelOf(id)} 定位失败：${e.message}`, true);
    locatePending = null;
    updateMarkButtons();
    renderBtDetailRows();
  }
}

// ---------- 载参数：collectCfg 的逆映射（只回填表单，不自动启动） ----------
function loadBtCfg(run) {
  const cfg = run.cfg || {};
  const card = el('card-backtest');
  card.querySelectorAll('[data-cfg]').forEach(inp => {
    const k = inp.dataset.cfg;
    // periods/with_30s 由 periods 推导；symbols 由 symbol/symbols 专门回填（多选面板）
    if (k === 'periods' || k === 'symbols' || k === 'with_30s' || !(k in cfg)) return;
    const v = typeof cfg[k] === 'boolean' ? String(cfg[k]) : cfg[k];
    // select 遇到不在选项里的值会静默重置为首项（如品种已删库、预设已删）：先补临时选项再赋值
    if (inp.tagName === 'SELECT' && typeof v === 'string' && v && ![...inp.options].some(o => o.value === v)) {
      inp.appendChild(new Option(v, v));
    }
    inp.value = v;
  });
  const periods = Array.isArray(cfg.periods) ? cfg.periods : [];
  // 周期/品种两个多选面板分别回填（历史方案：单品种 symbol 或批量 symbols 列表）
  const periodsMs = card.querySelector('.ms[data-ms="periods"]');
  periodsMs?.querySelectorAll('[data-ms-opt]').forEach(c => { c.checked = periods.includes(c.value); });
  syncMs(periodsMs);
  const syms = Array.isArray(cfg.symbols) && cfg.symbols.length ? cfg.symbols
    : (cfg.symbol ? [cfg.symbol] : []);
  const symbolsMs = card.querySelector('.ms[data-ms="symbols"]');
  symbolsMs?.querySelectorAll('[data-ms-opt]').forEach(c => { c.checked = syms.includes(c.value); });
  syncMs(symbolsMs);
  toggleBtSourceOptions();
  card.querySelector('[data-cfg="with_30s"]').value = String(periods.includes('30S'));
  // 结束日期显式清空/回填：旧方案 cfg 无 to 键，通用循环会跳过——不清空则上次手填值残留、悄悄截断复现回测
  card.querySelector('[data-cfg="to"]').value = cfg.to || '';
  addLog('backtest', `已载入方案参数：${run.name}（未自动启动，确认后点「启动」）`);
}

function bindBtRuns() {
  el('btn-bt-save').onclick = saveBtRun;
  el('btn-bt-save-all').onclick = saveAllBtRuns;
  el('btn-bt-refresh').onclick = refreshBtRuns;
  el('btn-bt-compare').onclick = () => {
    const v = el('bt-compare-view');
    v.hidden = !v.hidden;
    if (!v.hidden) renderBtCompare();
  };
  el('sort-bt-runs-pnl').onclick = toggleBtRunsPnlSort;
  el('bt-runs-body').onclick = onBtRunsClick;
  el('bt-runs-body').onchange = onBtRunsCheck;
  el('bt-detail-close').onclick = closeBtDetail;
  el('bt-detail-max').onclick = toggleBtDetailMax;
  el('bt-detail-tabs').onclick = e => {
    const tab = e.target.closest('[data-detail-tab]');
    if (tab) selectBtDetailTab(tab.dataset.detailTab);
  };
  el('bt-detail-tabs').onkeydown = e => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    const tab = e.key === 'Home' ? 'overview' : e.key === 'End' ? 'records' : btDetailTab === 'overview' ? 'records' : 'overview';
    selectBtDetailTab(tab, true);
  };
  el('bt-detail-body').onclick = e => {
    if (e.target.closest('#bt-detail-analyze')) { analyzeBtDetail(); return; }
    if (e.target.closest('#sort-bt-detail-pnl')) { toggleBtDetailPnlSort(); return; }
    onBtDetailSigActivate(e);
  };
  el('bt-detail-body').onkeydown = onBtDetailSigActivate;
  el('bt-detail-body').oncontextmenu = onBtDetailSigCopy;
  el('bt-detail-modal').onclick = e => { if (e.target === el('bt-detail-modal')) closeBtDetail(); };
  // Esc 退出浏览器全屏时同步按钮与布局
  document.addEventListener('fullscreenchange', () => {
    const modal = el('bt-detail-modal');
    if (!document.fullscreenElement && modal.classList.contains('maximized') && !modal.hidden) {
      modal.classList.remove('maximized');
      syncBtDetailMaxButton();
      requestAnimationFrame(() => requestAnimationFrame(redrawBtDetailEquity));
    } else if (document.fullscreenElement === modal) {
      modal.classList.add('maximized');
      syncBtDetailMaxButton();
      requestAnimationFrame(() => requestAnimationFrame(redrawBtDetailEquity));
    }
  });
  document.addEventListener('keydown', e => {
    if (el('bt-detail-modal').hidden) return;
    if (e.key === 'Escape') {
      // 全屏时 Esc 先交给浏览器退出全屏；非全屏再关弹窗
      if (!btDetailIsFullscreen()) closeBtDetail();
      return;
    }
    if (e.key === 'F10') { e.preventDefault(); toggleBtDetailMax(); }
    if (e.key === 'Tab') {
      const items = [...el('bt-detail-modal').querySelectorAll('button:not(:disabled), input:not(:disabled), summary, [tabindex]')]
        .filter(n => n.tabIndex >= 0 && n.getClientRects().length);
      const first = items[0], last = items[items.length - 1];
      if (!first) return;
      if (e.shiftKey && (document.activeElement === first || !items.includes(document.activeElement))) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && (document.activeElement === last || !items.includes(document.activeElement))) {
        e.preventDefault(); first.focus();
      }
    }
  });
  if (typeof ResizeObserver !== 'undefined') {
    let width = 0;
    const observer = new ResizeObserver(entries => {
      const next = Math.round(entries[0].contentRect.width);
      if (next > 0 && next !== width) { width = next; requestAnimationFrame(redrawBtDetailEquity); }
    });
    observer.observe(el('bt-detail-body'));
  }
}

// ---------- 初始化 ----------
// 支阻参数按回测品种从参数中心读取（不再提供「支阻预设」下拉）

// 品种下拉（三张卡共用 data-cfg="symbol"）：选项 = 静态默认 ∪ 基础数据已入库品种，
// 与基础数据页 refreshFetchSymbol 同口径（去重、保留当前选择）
async function loadStoreSymbols() {
  try {
    const s = await fetch('/api/data/stats').then(x => x.json());
    const stored = ((s.stats || {}).symbols || []).map(x => x.symbol);
    document.querySelectorAll('select[data-cfg="symbol"]').forEach(sel => {
      const symbols = [...new Set([...sel.options].map(o => o.value).concat(stored))];
      const cur = sel.value;
      sel.innerHTML = symbols.map(x => `<option>${x}</option>`).join('');
      if (symbols.includes(cur)) sel.value = cur;
    });
  } catch (e) { /* /api/data/stats 拉取失败：保留静态默认选项 */ }
}

async function init() {
  el('cards').innerHTML = MODES.map(buildCard).join('');
  MODES.forEach(m => bindCard(m.id));
  // 周期多选下拉：点击按钮开合，点击面板外收起；勾选变化即同步隐藏 input
  document.addEventListener('click', e => {
    const toggle = e.target.closest('[data-ms-toggle]');
    if (toggle) {
      const ms = toggle.closest('.ms');
      const open = ms.querySelector('.ms-panel').hidden;
      closeAllMsPanels(ms);
      ms.querySelector('.ms-panel').hidden = !open;
      toggle.setAttribute('aria-expanded', String(open));
      return;
    }
    if (!e.target.closest('.ms')) closeAllMsPanels(null);
  });
  document.addEventListener('change', e => {
    if (e.target.matches?.('[data-ms-opt]')) {
      const ms = e.target.closest('.ms');
      syncMs(ms);
      if (ms?.dataset.ms === 'symbols') toggleBtSourceOptions();  // >1 品种 → 数据源限 store
    }
  });
  selectMode(selectedMode);
  loadStoreSymbols();
  el('mode-nav').onclick=e=>{const b=e.target.closest('[data-mode]');if(b)selectMode(b.dataset.mode)};
  if(parent!==window)parent.postMessage({type:'modes-ready'},location.origin);
  el('btn-clear').onclick = () => clearModeRows(selectedMode);
  el('filter-status').onchange = () => renderTable();
  // 品种页签（多品种批量回测）：点击切换 → 表格/汇总/资金曲线/保存品种随之切换
  el('sym-tabs').addEventListener('click', e => {
    const b = e.target.closest('.sym-tab');
    if (!b) return;
    symTabSel = b.dataset.sym;
    renderTable();
  });
  // 批量进度表行点击 → 切到该品种页签并滚动到记录区（页签可见时生效）
  el('bt-batch')?.addEventListener('click', e => {
    const row = e.target.closest('.bt-batch-row[data-sym]');
    if (!row) return;
    const host = el('sym-tabs');
    if (!host || host.hidden) return;
    symTabSel = row.dataset.sym;
    showRecordTab('signals');
    renderTable();
    document.getElementById('record-signals')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  toggleBtSourceOptions();
  // 策略/方向多选过滤：勾选变化 → 更新按钮文案与当前模式的筛选记忆 → 重渲染
  document.querySelectorAll('[data-sig-opt]').forEach(c => c.onchange = () => {
    syncSigFilter(c.closest('.ms').id.replace('filter-', ''));
    modeFilters[selectedMode] = sigFilterCurrent();
    renderTable();
  });
  el('sort-pnl').onclick = togglePnlSort;
  // 记录区 TAB：进场信号记录 / 历史回测方案
  document.querySelectorAll('[data-record-tab]').forEach(b => {
    b.onclick = () => showRecordTab(b.dataset.recordTab);
  });
  bindSignalRows();
  bindBtRuns();
  el('btn-mark-draw').onclick = async () => {
    if (markBusy || isAnyModeRunning()) return;
    markBusy = true;
    updateMarkButtons();
    setMarkStatus('标记中...');
    startMarkWatchdog();
    const colors = { buy: el('mark-color-buy').value, sell: el('mark-color-sell').value,
                     exit: el('mark-color-exit').value };
    const r = await api('/api/marks/draw', { colors,mode:selectedMode });
    if (!r) { markBusy = false; stopMarkWatchdog(); updateMarkButtons(); setMarkStatus('标记请求失败', true); }
  };
  el('btn-sr-draw').onclick = async () => {
    if (markBusy || isAnyModeRunning()) return;
    markBusy = true;
    updateMarkButtons();
    setMarkStatus('支阻标记中...');
    startMarkWatchdog();
    const r = await api('/api/marks/sr_draw', { mode:selectedMode, colors: { sr: el('mark-color-sr').value } });
    if (!r) { markBusy = false; stopMarkWatchdog(); updateMarkButtons(); setMarkStatus('支阻标记请求失败', true); }
  };
  el('btn-mark-clear').onclick = async () => {
    if (markBusy || isAnyModeRunning()) return;
    markBusy = true;
    updateMarkButtons();
    setMarkStatus('清除中...');
    startMarkWatchdog();
    const r = await api('/api/marks/clear');
    if (!r) { markBusy = false; stopMarkWatchdog(); updateMarkButtons(); setMarkStatus('清除请求失败', true); }
  };
  updateMarkButtons();
  const status = await (await fetch('/api/status')).json();
  sigRows = (await (await fetch('/api/signals')).json()).rows || [];
  applyStatus(status);
  renderTable();
  connectSSE();
  reportModes();
  setInterval(reportModes,1000);
}
init();
</script>
<script>
if (new URLSearchParams(location.search).has("embed")) { document.body.classList.add("embedded"); }
</script>
</body>
