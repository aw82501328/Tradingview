<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三模式控制台 · 缠论回测</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 20px;
    font-size: 14px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .card h2 { font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #2a2f3a; color: var(--muted);
  }
  .badge.running { background: #0d3b31; color: var(--ok); }
  .badge.paused  { background: #3d3208; color: var(--warn); }
  .badge.done    { background: #0d3b31; color: var(--ok); }
  .badge.error   { background: #4a1015; color: var(--buy); }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--muted); }
  input, select {
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  /* 周期多选下拉：按钮显示已选周期，面板内 checkbox 多选 */
  .ms { position: relative; }
  .ms-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; cursor: pointer; text-align: left;
  }
  .ms-toggle .ms-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-toggle .ms-caret { font-size: 10px; color: var(--muted); }
  .ms-panel {
    position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 100%;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 2px;
  }
  .ms-opt {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border-radius: 4px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .ms-opt:hover { background: var(--card-2); }
  .ms-opt input[type="checkbox"] { width: auto; accent-color: var(--accent); }
  /* 信号列表的策略/方向多选过滤（复用 .ms 结构）：按钮随内容收缩，不占满一行 */
  .sig-filter { flex: none; }
  .sig-filter .ms-toggle { width: auto; min-width: 96px; max-width: 260px; }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; }
  .btn-row { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  button {
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: #2b313d; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.start { background: #123; border-color: #1d4ed8; color: #7cb0ff; }
  button.danger { background: #2a1014; border-color: #8f1d2a; color: #ff8fa3; }
  button.mark { background: #101c12; border-color: #1d8f3a; color: #7fe0b0; }
  input[type="color"] {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px; width: 32px; height: 26px; cursor: pointer;
  }
  #mark-status { max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
  .progress-label { font-size: 11px; color: var(--muted); }
  /* 多品种批量并行进度表（回测卡，2026-09-23）：每品种一行 状态徽标+进度条+计数/错误 */
  .bt-batch { margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
  .bt-batch-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; font-size: 12px; }
  .bt-batch-sym { min-width: 128px; font-family: Consolas, monospace; }
  .bt-batch-state { min-width: 52px; text-align: center; border-radius: 4px; padding: 1px 6px; font-size: 11px; }
  .bt-batch-state.running { background: #0e1a2e; color: #7cb0ff; }
  .bt-batch-state.paused { background: #2b2410; color: #ffd66b; }
  .bt-batch-state.done { background: #0f2415; color: #7fe0b0; }
  .bt-batch-state.stopped, .bt-batch-state.skipped { background: var(--card-2); color: var(--muted); }
  .bt-batch-state.error { background: #2a1014; color: #ff8fa3; }
  .bt-batch-bar { flex: 1; height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
  .bt-batch-bar i { display: block; height: 100%; background: var(--accent); }
  .bt-batch-pct { min-width: 130px; text-align: right; color: var(--muted); font-family: Consolas, monospace; }
  .bt-batch-err { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ff8fa3; }
  /* 品种页签（多品种批量回测后按品种查看/保存）：默认选中第一个品种，末位「全部」 */
  .sym-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sym-tab { padding: 2px 12px; font-size: 12px; border-radius: 999px; color: var(--muted); }
  .sym-tab.active { color: var(--text); border-color: var(--accent); background: #16202f; }
  .log-box {
    background: #0b0d11; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; font-family: Consolas, monospace; font-size: 11px;
    height: 110px; overflow-y: auto; color: var(--muted); white-space: pre-wrap;
    word-break: break-all;
  }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .table-wrap .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
  #pnl-summary {
    display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 14px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--card-2); font-size: 12px; color: var(--muted);
  }
  #pnl-summary b { color: var(--text); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--card-2); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
  th .sort-button { padding: 0 4px; border: 0; background: transparent; color: inherit; font: inherit; }
  td.long { color: var(--buy); }
  td.short { color: var(--sell); }
  .mode-tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #2a2f3a; }
  .mode-tag.backtest { color: #7cb0ff; }
  .mode-tag.replay   { color: #c9a0ff; }
  .mode-tag.live     { color: #7fe0b0; }
  .status-tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; }
  .mini-badge { font-size: 10px; padding: 0 4px; margin-left: 3px; border-radius: 6px;
    background: #2a2340; color: #b39ddb; border: 1px solid #4a3b6b; cursor: help; }
  .status-tag.sig { background: #123; color: #7cb0ff; }
  .status-tag.filled { background: #0d3b31; color: var(--ok); }
  .status-tag.open { background: #3d3208; color: var(--warn); }
  .status-tag.closed { background: #0d3b31; color: var(--ok); }
  .status-tag.filtered { background: #2a2f3a; color: var(--muted); }
  #pnl-summary .pnl-pos, td.pnl-pos { color: var(--buy); }
  #pnl-summary .pnl-neg, td.pnl-neg { color: var(--sell); }
  /* ---------- 资金曲线（自绘 SVG：当前回测大图 / 明细大图 / 对比小图） ---------- */
  .equity-chart {
    border-top: 1px solid var(--border); padding: 10px 14px 12px;
    background: var(--card); position: relative;
  }
  .equity-chart[hidden] { display: none; }
  .equity-chart .eq-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; margin-bottom: 6px; font-size: 12px; color: var(--muted);
  }
  .equity-chart .eq-head strong { color: var(--text); font-size: 13px; }
  .equity-chart .eq-legend {
    display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted);
    align-items: center;
  }
  .equity-chart .eq-legend i {
    display: inline-block; width: 10px; height: 3px; border-radius: 1px;
    margin-right: 4px; vertical-align: middle;
  }
  .equity-chart .eq-legend .eq-swatch {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .equity-chart .eq-legend input[type="color"] {
    width: 22px; height: 18px; padding: 0; border-radius: 3px;
    vertical-align: middle; flex: none;
  }
  .equity-chart svg { display: block; width: 100%; height: auto; touch-action: none; }
  .equity-chart .eq-tip {
    position: absolute; pointer-events: none; z-index: 5;
    background: #1a2030; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 11px; color: var(--text); white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,.4); display: none;
  }
  .equity-chart .eq-tip.on { display: block; }
  .scroll { max-height: 420px; overflow-y: auto; }
  #sig-body tr { cursor: pointer; }
  #sig-body tr:hover td { background: var(--card-2); }
  #sig-body tr.selected td { background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  #sig-body tr.selected:not(.exit-continuation) td:first-child { box-shadow: inset 3px 0 var(--accent); }
  #sig-body td[rowspan] { vertical-align: middle; }
  #sig-body tr.exit-continuation td { border-top-style: dashed; }
  #sig-body tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* 历史方案明细表：与主表同款可点击定位 */
  #bt-detail-sig-body tr[data-signal-id] { cursor: pointer; }
  #bt-detail-sig-body tr[data-signal-id]:hover td { background: var(--card-2); }
  #bt-detail-sig-body tr.selected td { background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  #bt-detail-sig-body tr.selected:not(.exit-continuation) td:first-child { box-shadow: inset 3px 0 var(--accent); }
  #bt-detail-sig-body td[rowspan] { vertical-align: middle; }
  #bt-detail-sig-body tr.exit-continuation td { border-top-style: dashed; }
  #bt-detail-sig-body tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* 右击复制交易信息的反馈 toast（主表与明细弹窗共用） */
  #copy-tip {
    position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%) translateY(8px);
    z-index: 60; padding: 6px 14px; border-radius: 6px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    box-shadow: 0 6px 18px rgba(0,0,0,.4); font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity .15s ease, transform .15s ease;
  }
  #copy-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .bt-detail-locate { padding: 8px 16px; color: var(--muted); font-size: 12px;
    border-bottom: 1px solid var(--border); background: var(--card-2); }
  #locate-status { padding: 8px 14px; color: var(--muted); font-size: 12px; }
  /* ---------- 记录区 TAB（进场信号记录 / 历史回测方案） ---------- */
  .record-tabs {
    display: flex; gap: 4px; padding: 6px 10px 0;
    border-bottom: 1px solid var(--border); background: var(--card-2);
  }
  .record-tab {
    background: transparent; color: var(--muted);
    border: 1px solid transparent; border-bottom: 0;
    border-radius: 8px 8px 0 0; padding: 7px 16px; font-size: 13px;
  }
  .record-tab:hover:not(:disabled) { background: var(--card); color: var(--text); }
  .record-tab.active {
    background: var(--card); border-color: var(--border);
    color: var(--text); font-weight: 600;
  }
  /* ---------- 历史回测方案面板 / 明细弹窗 / 对比 ---------- */
  .bt-actions button { padding: 2px 8px; font-size: 12px; }
  #bt-compare-view { border-top: 1px solid var(--border); padding: 10px 14px 14px; overflow-x: auto; }
  #bt-compare-view table { font-size: 12px; margin-bottom: 8px; }
  #bt-compare-view th:first-child, #bt-compare-view td:first-child {
    position: sticky; left: 0; background: var(--card-2); z-index: 1;
  }
  .bt-diff { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--card));
    border-radius: 4px; padding: 1px 6px; }
  #bt-detail-modal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  #bt-detail-modal[hidden] { display: none; }
  .bt-modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    max-width: 96vw; width: min(1200px, 96vw); max-height: 90vh; display: flex;
    flex-direction: column; overflow: hidden; }
  /* 明细全屏最大化：铺满视口；配合 Fullscreen API 盖住浏览器外框 */
  #bt-detail-modal.maximized {
    padding: 0; background: var(--card);
  }
  #bt-detail-modal.maximized .bt-modal-card {
    width: 100%; max-width: none; height: 100%; max-height: none;
    border: 0; border-radius: 0;
  }
  #bt-detail-modal.maximized #bt-detail-body .scroll { max-height: none; flex: 1; }
  #bt-detail-modal.maximized #bt-detail-body {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
  }
  #bt-detail-modal:fullscreen,
  #bt-detail-modal:-webkit-full-screen {
    padding: 0; background: var(--card); width: 100%; height: 100%;
  }
  #bt-detail-modal:fullscreen .bt-modal-card,
  #bt-detail-modal:-webkit-full-screen .bt-modal-card {
    width: 100%; max-width: none; height: 100%; max-height: none;
    border: 0; border-radius: 0;
  }
  .bt-modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .bt-modal-head .bt-modal-actions { display: flex; gap: 8px; flex-shrink: 0; }
  #bt-detail-body { overflow: auto; }
  .bt-params { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 6px 14px; padding: 10px 16px; font-size: 12px; }
  /* 参数区可折叠：结果图形置顶，参数收起为摘要行 */
  .bt-params-wrap { border-bottom: 1px solid var(--border); background: var(--card-2); }
  .bt-params-wrap > summary { padding: 8px 16px; font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none; list-style: none; }
  .bt-params-wrap > summary::-webkit-details-marker { display: none; }
  .bt-params-wrap > summary::before { content: '▸'; margin-right: 6px; display: inline-block;
    transition: transform .15s ease; }
  .bt-params-wrap[open] > summary::before { transform: rotate(90deg); }
  .bt-params-wrap[open] > summary { border-bottom: 1px dashed var(--border); }
  .bt-params .k { color: var(--muted); margin-right: 4px; }
  .bt-summary { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--card-2); font-size: 12px; color: var(--muted); }
  .bt-summary b { color: var(--text); font-weight: 600; }
  .bt-summary .pnl-pos { color: var(--buy); }
  .bt-summary .pnl-neg { color: var(--sell); }
  .bt-loss-summary { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px;
    border-bottom: 1px solid var(--border); background: var(--card-2);
    font-size: 12px; color: var(--muted); }
  .bt-loss-summary b { color: var(--text); font-weight: 600; }
  .bt-loss-summary .pnl-pos { color: var(--buy); }
  .bt-loss-summary .pnl-neg { color: var(--sell); }
  /* 明细弹窗盈亏图形化：表内双向条 / 汇总瓦片 / 亏损归因 */
  .pnl-cell { display: inline-flex; align-items: center; gap: 8px; }
  .pnl-bar-track { position: relative; width: 64px; height: 6px; flex: none;
    border-radius: 3px; background: var(--input); }
  .pnl-bar-track::before { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px;
    width: 1px; background: var(--border); }
  .pnl-bar { position: absolute; top: 0; bottom: 0; min-width: 1px; }
  .pnl-bar.pos { left: 50%; border-radius: 0 3px 3px 0; background: var(--buy); }
  .pnl-bar.neg { right: 50%; border-radius: 3px 0 0 3px; background: var(--sell); }
  /* 汇总瓦片（明细弹窗专用；#pnl-summary 实时汇总条不受影响）：3 列两行——
     行1 盈亏数字+双向条，行2 盈亏比对条+胜率/出场分布环形图 */
  .bt-summary-graphic { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px 16px; padding: 12px 16px; }
  .sum-tile { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .sum-tile-donut { flex-direction: row; align-items: center; gap: 10px; }
  .sum-tile-donut svg { flex: none; }
  .sum-donut-side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .sum-label { font-size: 11px; color: var(--muted); }
  .sum-value { font-size: 15px; font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums; }
  .sum-legend { font-size: 11px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .sum-graph { display: flex; flex-direction: column; gap: 4px; }
  .sum-graph svg { display: block; }
  .sum-graph .pnl-bar-track { width: 100%; }
  .sum-pair { display: flex; flex-direction: column; gap: 3px; }
  .sum-pair-row { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px;
    align-items: center; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .sum-pair-row .bar { position: relative; height: 6px; border-radius: 3px;
    background: var(--input); overflow: hidden; }
  .sum-pair-row .bar > i { position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 0 3px 3px 0; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  /* 亏损归因图形化 */
  .bt-loss-graphic { display: flex; flex-direction: column; gap: 8px; }
  .loss-main { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }
  .loss-main svg { display: block; flex: none; }
  .loss-side { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .loss-cats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .loss-cat { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .loss-cat b { color: var(--text); }
  .loss-cat .pnl-bar-track { width: 72px; }
  .bt-analyze-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted); }
  .bt-analyze-bar input[type="number"] {
    width: 52px; padding: 4px 6px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
  }
  #bt-detail-body .scroll { max-height: 44vh; }
  #bt-detail-body .equity-chart { border-top: 0; }
  #bt-compare-view .equity-chart {
    border: 1px solid var(--border); border-radius: 8px;
    margin: 4px 0 10px; padding: 8px 10px 10px;
  }
  /* 历史明细看板：布局与表格规则仅作用于此弹窗。 */
  #bt-detail-modal { padding: 16px; backdrop-filter: blur(4px); }
  #bt-detail-modal .bt-modal-card { width: min(1440px, 100%); max-width: 100%; height: 92vh;
    max-height: 92vh; border-radius: 14px; box-shadow: 0 24px 80px #0008; }
  #bt-detail-modal.maximized .bt-modal-card { width: 100%; height: 100%; max-height: 100%; border-radius: 0; }
  #bt-detail-modal .bt-modal-head { padding: 18px 24px; align-items: flex-start; flex: none; }
  #bt-detail-modal .bt-heading { min-width: 0; }
  #bt-detail-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    overflow: hidden; font-size: 20px; line-height: 1.4; overflow-wrap: anywhere; }
  #bt-detail-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px;
    color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  #bt-detail-modal .bt-modal-actions { flex-wrap: wrap; justify-content: flex-end; }
  #bt-detail-tabs { display: flex; gap: 24px; padding: 0 24px; flex: none; border-bottom: 1px solid var(--border); }
  #bt-detail-tabs button { border: 0; border-radius: 0; border-bottom: 2px solid transparent;
    background: transparent; color: var(--muted); padding: 10px 2px; }

<script>
const MODES = [
  { id: 'backtest', name: '全量回测', color: '#7cb0ff', desc: '当下背驰 · 纯后台逐根推进，可用缓存离线运行' },
  { id: 'replay', name: 'K线回放', color: '#c9a0ff', desc: '驱动软件 Bar Replay 自动播放，信号触发切周期标记' },
  { id: 'live', name: '实时监控', color: '#7fe0b0', desc: '固定 3m，新收盘 bar 全周期刷新' },
];
// 周期多选下拉的可选项；30S 不在此列，仍由「30秒级别」开关单独追加
const PERIOD_OPTIONS = ['D', '240', '60', '15', '3'];
// 品种清单（三模式共用）：回测卡 = .ms 多选（勾多个 → 批量并行，仅本地数据存储）；
// 回放/实时沿用单选下拉（选项同源，去硬编码）
const SYMBOL_OPTIONS = ['OANDA:XAUUSD', 'OANDA:XAGUSD', 'FX:NAS100', 'TVC:USOIL', 'BITSTAMP:BTCUSD'];

const state = { active: null, modes: {} };
let sigRows = [];
const validMode = mode => MODES.some(m=>m.id===mode);
let selectedMode = new URLSearchParams(location.search).get('mode');
if(!validMode(selectedMode))selectedMode='backtest';
// 每个模式各自记忆 状态/策略/方向 三个筛选；sigFilterEmpty = 默认（全部）
const sigFilterEmpty = () => ({ status: '', strategy: [], direction: [] });
const modeFilters = { backtest: sigFilterEmpty(), replay: sigFilterEmpty(), live: sigFilterEmpty() };
const modePnlSort = {backtest:'none',replay:'none',live:'none'};
const selectedSignal = {backtest:null,replay:null,live:null};
const locateMessages = {backtest:'',replay:'',live:''};
let locatePending = null;
let locatePoll = null;
function reportModes(){
  if(parent!==window)parent.postMessage({type:'modes-status',modes:Object.fromEntries(MODES.map(m=>[m.id,state.modes[m.id]?.state||'idle']))},location.origin);
}
function selectMode(mode){
  if(!validMode(mode))return;
  modeFilters[selectedMode]=sigFilterCurrent();
  selectedMode=mode;
  sigFilterApply(modeFilters[mode]);
  MODES.forEach(m=>el('card-'+m.id).hidden=m.id!==mode);
  // 历史方案 TAB 只属于全量回测；切到回放/实时时隐藏该 TAB 并回到信号表
  el('tab-btn-bt').hidden = mode !== 'backtest';
  if(mode !== 'backtest' && activeRecordTab === 'bt') showRecordTab('signals');
  el('mode-nav').innerHTML=MODES.map(m=>`<button data-mode="${m.id}" aria-pressed="${m.id===mode}">${m.name}</button>`).join('');
  document.querySelector('h1').firstChild.textContent=modeName(mode)+' ';
  renderTable();
}
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='select-mode')return;
  selectMode(e.data.mode);
});
let logs = { backtest: [], replay: [], live: [] };
let markBusy = false;   // 标记操作（画/删）进行中
let markWatchdog = null; // 标记操作兜底复位定时器（SSE mark_done 丢失/线程异常时避免永久灰置）

function el(id) { return document.getElementById(id); }

// ---------- 标记工具条 ----------
function setMarkStatus(msg, isError) {
  const s = el('mark-status');
  s.textContent = msg || '';
  s.style.color = isError ? 'var(--buy)' : 'var(--muted)';
}
// 90s 看门狗：启动画/清后若迟迟收不到 mark_done（SSE 事件丢失、后台线程异常但未发事件），
// 强制复位 busy 并提示重试，保证按钮永不永久灰置。
function startMarkWatchdog() {
  clearTimeout(markWatchdog);
  markWatchdog = setTimeout(() => {
    if (markBusy) {
      markBusy = false;
      updateMarkButtons();
      setMarkStatus('操作超时或状态丢失，请重试或刷新', true);
    }
  }, 90000);
}
function stopMarkWatchdog() { clearTimeout(markWatchdog); markWatchdog = null; }
function updateMarkButtons() {
  const busy = markBusy || !!locatePending;
  el('btn-mark-draw').disabled = busy || isAnyModeRunning();
  el('btn-sr-draw').disabled = busy || isAnyModeRunning();
  el('btn-mark-clear').disabled = busy || isAnyModeRunning();
}
function isAnyModeRunning() {
  return Object.values(state.modes).some(w => ['running', 'paused'].includes(w.state));
}

// ---------- 卡片渲染 ----------
function buildCard(m) {
  const extras = {
    backtest: [
      { k: 'lead_days', label: '预热提前（天）·0=从起始日交易', type: 'text', def: '60' },
      { k: 'warmup', label: '预热根数（提前=0 时生效）', type: 'text', def: '60' },
      { k: 'locate-after-bars', label: '定位后保留K线', type: 'number', def: '60',
        cfg: false, min: 0, step: 1,
        title: '点击信号行在图上定位时，出场（无出场则进场）之后再显示的K线根数' },
    ],
    replay: [
      { k: 'start', label: '回放起点', type: 'date', def: '2026-08-01' },
      { k: 'speed', label: '速度 ms/bar', type: 'text', def: '1000' },
      { k: 'hold', label: '信号停留 s', type: 'text', def: '2' },
    ],
    live: [
      { k: 'interval', label: '轮询间隔 s', type: 'text', def: '15' },
    ],
  };
  const rows = [];
  const periodsHtml = `<div class="field"><label>周期</label><div class="ms" data-ms="periods">
    <button type="button" class="ms-toggle" data-ms-toggle aria-expanded="false" title="勾选一个或多个周期">
      <span class="ms-value">${PERIOD_OPTIONS.join(',')}</span><span class="ms-caret">▾</span>
    </button>
    <div class="ms-panel" hidden>${PERIOD_OPTIONS.map(p =>
      `<label class="ms-opt"><input type="checkbox" data-ms-opt value="${p}" checked>${p}</label>`).join('')}
    </div>
    <input type="hidden" data-cfg="periods" value="${PERIOD_OPTIONS.join(',')}">
  </div></div>`;
  // 回测卡品种多选（2026-09-23 批量并行）：勾 1 个 = 原单品种行为（后端折叠回 symbol）；
  // 勾多个 = 批量并行（每品种一个子进程，仅本地数据存储）。回放/实时沿用单选。
  const symbolsHtml = m.id === 'backtest'

      ${m.id === 'backtest' ? `
      <button id="btn-bt-save" disabled title="把最近一次完成的全量回测（参数+本轮信号+固化汇总）保存为历史方案；多品种批量=保存当前页签品种">保存方案</button>
      <button id="btn-bt-save-all" hidden title="多品种批量一键保存：每个完成品种自动各存一条方案（名称自动带品种）">全部保存</button>` : ''}

// ---------- 表格 ----------
function fmtTime(t) {
  if (!t) return '-';
  // UTC+8（北京时间）显示：China Standard Time 无夏令时，偏移直接加 8 小时
  const d = new Date((t + 8 * 3600) * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;
}
function modeName(id) { return MODES.find(m => m.id === id)?.name || id; }
function signalDirectionName(r) {
  // 顺势过滤开启（信号带 trendReason）：方向列显示参考周期锚方向 + 成因，如「多（4小时2买）」
  if (r.trendReason) return `${r.direction === 'short' ? '空' : '多'}（${r.trendReason}）`;
  const directions = ['多头多', '空头空', '多头空', '空头多'];
  if (directions.includes(r.planDirection)) return r.planDirection;
  // 旧记录未保存 planDirection，按 trading_plan.strategyOf / entryStrategyOf 的固定对应关系显示。
  return {wait2Buy:'多头多',waitBuy:'多头多',wait2Sell:'空头空',waitSell:'空头空',
    wait1Sell:'多头空',wait1Buy:'空头多'}[r.strategyKey] || '-';
}
// 方向过滤的匹配键：顺势开启 = 基名（多/空，不按成因碎片化）；否则 = 展示口径（计划方向名）
function signalDirectionKey(r) {
  return r.trendReason ? (r.direction === 'short' ? '空' : '多') : signalDirectionName(r);
}
// 信号候选角标（SPEC_divergence_fallback）：回退/近等/预期够笔口径标记
function candidateBadges(r) {
  const b = [];
  if (r.fallback) b.push(['回退', '下沉停止级无候选，沿链上一级回退命中（M1）']);
  if (r.nearEqual) b.push(['近等', '未严格创新极值、近等容差+三判据AND命中（M2）']);
  if (r.expectBi) b.push(['预期', '检测周期末笔反向、按预期够笔口径放行（M4）']);
  return b.map(([t, tip]) => `<span class="mini-badge" title="${tip}">${t}</span>`).join('');
}
// 出场类型：stopSr=支阻位止损（支阻位±止损滑点，再按最大止损夹紧）
//          | stopBe=保本止损（beStop=进场K线极值±保本滑点）| close=全平（顺势=有利方向破前高/低；
//          逆势=形成段≥5合并K）；exits 含 half=平一半（顺势形成段≥5合并K）/breakeven=保本
function exitTypeName(t) {
  if (t === 'half') return '半平';
  if (t === 'stopSr') return '支阻位止损';
  if (t === 'stopBe') return '保本止损';
  if (t === 'close') return '全平';
  return t || '-';
}
function exitEventsDesc(r) {
  const names = { breakeven: '保本', half: '半', close: '平', stopSr: '损', stopBe: '保损' };
  return (r.exits || []).map(e => names[e.type] || e.type).join('·') || '';
}
// 分批出场只拆分展示，仍按整笔交易计数、汇总和排序。
function exitDisplayRows(r) {
  const numeric = value => value != null && Number.isFinite(Number(value)) ? Number(value) : null;
  const totalPnl = numeric(r.pnl), lots = numeric(r.lots);
  const mult = numeric(r.mult) ?? 1;   // 合约乘数快照（2026-09-23：1手=0.01标准手；旧行无此键 → 1）
  const final = {time:r.exitTime,price:r.exitPrice,type:r.exitType,
    label:r.exitType ? exitTypeName(r.exitType) : (r.state === 'open' ? '持仓中' : '-'),lots,pnl:totalPnl};
  // 现有结算按首次 half 平掉原持仓一半；breakeven 仅移动止损，不是出场。
  const half = (r.exits || []).find(e=>e.type === 'half');
  if (!half) return [final];
  const halfLots = lots == null ? null : lots / 2;
  const entry = numeric(r.entryPrice), price = numeric(half.price);
  const direction = r.direction === 'long' ? 1 : r.direction === 'short' ? -1 : null;
  const halfPnl = entry == null || price == null || halfLots == null || direction == null
    ? null : (price - entry) * direction * halfLots * mult;
  final.lots = halfLots;
  final.pnl = totalPnl == null || halfPnl == null ? null : totalPnl - halfPnl;
  if (!r.exitType) final.label = '剩余持仓';
  return [{time:half.time,price:half.price,type:'half',label:'半平',lots:halfLots,pnl:halfPnl},final];
}
// 资金曲线点列：与后端 compute_equity 同口径——从 0 起步，按出场事件（含半平拆分）
// 时间累加；持仓浮盈无 exitTime 排末尾，终点 = 汇总「合计」。
function equityPoints(rows) {
  const timed = [], floating = [];
  for (const r of rows) {
    if (r.status !== '已平仓' && r.status !== '持仓中') continue;
    if (r.pnl == null) continue;
    for (const exit of exitDisplayRows(r)) {
      if (exit.pnl == null) continue;
      if (exit.time == null) floating.push({ t: null, pnl: exit.pnl });
      else timed.push({ t: Number(exit.time), pnl: exit.pnl });
    }
  }
  timed.sort((a, b) => a.t - b.t);
  const events = timed.concat(floating);
  if (!events.length) return [];
  const lastT = timed.length ? timed[timed.length - 1].t : 0;
  const firstT = timed.length ? timed[0].t : lastT;
  const out = [{ t: firstT, v: 0 }];
  let cum = 0, floatIdx = 0;
  for (const ev of events) {
    const t = ev.t == null ? lastT + 1 + floatIdx++ : ev.t;
    cum += ev.pnl;
    out.push({ t, v: Math.round(cum * 100) / 100 });
  }
  return out;
}
// 对比/多方案默认配色；用户可选色按方案 id 记住（localStorage）
const EQ_COLORS = ['#7cb0ff', '#7fe0b0', '#c9a0ff', '#ffb86c', '#ff8fa3'];
const EQ_COLOR_STORE_KEY = 'bt-compare-eq-colors';
function loadCompareColors() {
  try { return JSON.parse(localStorage.getItem(EQ_COLOR_STORE_KEY) || '{}') || {}; }
  catch { return {}; }
}
function saveCompareColor(id, color) {
  const map = loadCompareColors();
  map[id] = color;
  localStorage.setItem(EQ_COLOR_STORE_KEY, JSON.stringify(map));
}
function compareColorOf(id, index) {
  const saved = loadCompareColors()[id];
  return saved || EQ_COLORS[index % EQ_COLORS.length];
}
function escAttr(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// 自绘 SVG 资金曲线：seriesList = [{id?, name, points:[{t,v}], color?}]；opts.height 大图约 280 / 小图约 140
// opts.pickColors=true 时图例旁出颜色选择器，改色触发 opts.onColorChange(id, color, series)
function drawEquityChart(host, seriesList, opts = {}) {
  const series = (seriesList || []).filter(s => s.points && s.points.length);
  if (!host) return;
  if (!series.length) { host.hidden = true; host.innerHTML = ''; return; }
  host.hidden = false;
  host._eqSeries = series;
  host._eqOpts = opts;
  const H = opts.height || 280;
  const pad = { l: 52, r: 14, t: 18, b: 26 };
  // 用容器宽度做 viewBox；无宽时退回 720
  const W = Math.max(320, Math.floor(host.clientWidth || host.parentElement?.clientWidth || 720));
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
  let tMin = Infinity, tMax = -Infinity, vMin = 0, vMax = 0;
  for (const s of series) for (const p of s.points) {
    if (p.t < tMin) tMin = p.t;
    if (p.t > tMax) tMax = p.t;
    if (p.v < vMin) vMin = p.v;
    if (p.v > vMax) vMax = p.v;
  }
  if (tMax <= tMin) tMax = tMin + 1;
  const vPad = Math.max((vMax - vMin) * 0.08, 1);
  vMin -= vPad; vMax += vPad;
  const xOf = t => pad.l + ((t - tMin) / (tMax - tMin)) * plotW;
  const yOf = v => pad.t + (1 - (v - vMin) / (vMax - vMin)) * plotH;
  const fmtV = v => (v > 0 ? '+' : '') + Number(v).toFixed(2);
  const pathOf = pts => pts.map((p, i) =>
    `${i ? 'L' : 'M'}${xOf(p.t).toFixed(1)},${yOf(p.v).toFixed(1)}`).join(' ');
  const zeroY = yOf(0);
  const yTicks = [vMin, 0, vMax].filter((v, i, a) =>
    i === 0 || Math.abs(v - a[i - 1]) > (vMax - vMin) * 0.05);
  // 极值：单线时标最大/最小点
  let extrema = '';
  if (series.length === 1) {
    const pts = series[0].points;
    let hi = pts[0], lo = pts[0];
    for (const p of pts) { if (p.v > hi.v) hi = p; if (p.v < lo.v) lo = p; }
    const mark = (p, label, dy) =>
      `<circle cx="${xOf(p.t).toFixed(1)}" cy="${yOf(p.v).toFixed(1)}" r="3" fill="${series[0].color || EQ_COLORS[0]}"/>` +
      `<text x="${xOf(p.t).toFixed(1)}" y="${(yOf(p.v) + dy).toFixed(1)}" text-anchor="middle" fill="var(--muted)" font-size="10">${label} ${fmtV(p.v)}</text>`;
    if (hi !== lo || hi.v !== 0) {
      extrema = mark(hi, '高', -8) + (lo.v !== hi.v ? mark(lo, '低', 14) : '');
    }
  }
  const lines = series.map((s, i) => {
    const color = s.color || EQ_COLORS[i % EQ_COLORS.length];
    const sid = s.id != null ? ` data-eq-sid="${escAttr(s.id)}"` : ` data-eq-idx="${i}"`;
    return `<path${sid} d="${pathOf(s.points)}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  }).join('');
  const legend = series.map((s, i) => {
    const color = s.color || EQ_COLORS[i % EQ_COLORS.length];
    const last = s.points[s.points.length - 1];
    const swatch = opts.pickColors && s.id
      ? `<label class="eq-swatch" title="选择曲线颜色"><input type="color" data-eq-color="${escAttr(s.id)}" value="${escAttr(color)}"></label>`
      : `<i style="background:${color}"></i>`;
    return `<span>${swatch}${escAttr(s.name || '曲线')}` +
      (last ? ` <b class="${last.v > 0 ? 'pnl-pos' : last.v < 0 ? 'pnl-neg' : ''}">${fmtV(last.v)}</b>` : '') +
      `</span>`;
  }).join('');
  const title = opts.title || '资金曲线';
  const note = opts.note || '出场盈亏累加（含半平）；终点含浮盈';
  host.innerHTML = `
    <div class="eq-head"><strong>${escAttr(title)}</strong><span>${escAttr(note)}</span></div>
    <div class="eq-legend">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${escAttr(title)}">
      <line x1="${pad.l}" y1="${zeroY.toFixed(1)}" x2="${W - pad.r}" y2="${zeroY.toFixed(1)}"
            stroke="var(--border)" stroke-dasharray="4 3"/>
      ${yTicks.map(v =>
        `<text x="${pad.l - 6}" y="${(yOf(v) + 3).toFixed(1)}" text-anchor="end" fill="var(--muted)" font-size="10">${fmtV(v)}</text>`
      ).join('')}
      <text x="${pad.l}" y="${H - 6}" fill="var(--muted)" font-size="10">${escAttr(fmtTime(tMin))}</text>
      <text x="${W - pad.r}" y="${H - 6}" text-anchor="end" fill="var(--muted)" font-size="10">${escAttr(fmtTime(tMax))}</text>
      ${lines}${extrema}
      <line class="eq-cross" x1="0" y1="${pad.t}" x2="0" y2="${H - pad.b}" stroke="var(--muted)" stroke-opacity=".35" visibility="hidden"/>
      <rect class="eq-hit" x="${pad.l}" y="${pad.t}" width="${plotW}" height="${plotH}" fill="transparent"/>
    </svg>
    <div class="eq-tip"></div>`;
  // 悬停读数：找各系列最近时间点
  const svg = host.querySelector('svg');
  const tip = host.querySelector('.eq-tip');
  const cross = host.querySelector('.eq-cross');
  const hit = host.querySelector('.eq-hit');
  const nearest = (pts, t) => {
    let best = pts[0], bestD = Math.abs(pts[0].t - t);
    for (const p of pts) {
      const d = Math.abs(p.t - t);
      if (d < bestD) { best = p; bestD = d; }
    }
    return best;
  };
  const onMove = e => {
    const rect = svg.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * W;
    if (x < pad.l || x > W - pad.r) { tip.classList.remove('on'); cross.setAttribute('visibility', 'hidden'); return; }
    const t = tMin + ((x - pad.l) / plotW) * (tMax - tMin);
    cross.setAttribute('x1', x.toFixed(1));
    cross.setAttribute('x2', x.toFixed(1));
    cross.setAttribute('visibility', 'visible');
    // 用 host._eqSeries：取色过程中会就地改 color，悬停读数跟新色
    const live = host._eqSeries || series;
    const rows = live.map((s, i) => {
      const p = nearest(s.points, t);
      const color = s.color || EQ_COLORS[i % EQ_COLORS.length];
      return `<div><span style="color:${color}">●</span> ${escAttr(s.name || '曲线')}：` +
        `<b class="${p.v > 0 ? 'pnl-pos' : p.v < 0 ? 'pnl-neg' : ''}">${fmtV(p.v)}</b>` +
        ` <span style="color:var(--muted)">${escAttr(fmtTime(p.t))}</span></div>`;
    }).join('');
    tip.innerHTML = rows;
    tip.classList.add('on');
    const tipW = tip.offsetWidth || 120;
    let left = e.clientX - host.getBoundingClientRect().left + 12;
    if (left + tipW > host.clientWidth - 8) left = left - tipW - 24;
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = Math.max(4, e.clientY - host.getBoundingClientRect().top - 10) + 'px';
  };
  const onLeave = () => { tip.classList.remove('on'); cross.setAttribute('visibility', 'hidden'); };
  hit.addEventListener('mousemove', onMove);
  hit.addEventListener('mouseleave', onLeave);
  // 对比图改色：禁止 input 时整图重绘（会拆掉系统取色窗）；就地改 path stroke，change 时再落盘
  if (opts.pickColors) {
    host.querySelectorAll('input[data-eq-color]').forEach(inp => {
      const applyColor = (id, color, persist) => {
        host._eqSeries = (host._eqSeries || series).map(s => s.id === id ? { ...s, color } : s);
        const path = host.querySelector(`path[data-eq-sid="${CSS.escape(id)}"]`);
        if (path) path.setAttribute('stroke', color);
        if (persist && typeof opts.onColorChange === 'function') {
          opts.onColorChange(id, color, host._eqSeries);
        }
      };
      // 阻止冒泡，避免外层点击逻辑干扰取色窗
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('mousedown', e => e.stopPropagation());
      inp.addEventListener('input', () => applyColor(inp.dataset.eqColor, inp.value, false));
      inp.addEventListener('change', () => applyColor(inp.dataset.eqColor, inp.value, true));
    });
  }
}

// 下拉按钮文案：显示已选值（逗号连接），空 = 全部
function syncSigFilter(name) {
  const vals = sigFilterValues(name);
  el(`filter-${name}`).querySelector('.ms-value').textContent =
    (name === 'strategy' ? '策略' : '方向') + '：' + (vals.length ? vals.join(',') : '全部');
}
function filteredRows() {
  const f = el('filter-status').value;
  const st = sigFilterValues('strategy');
  const dir = sigFilterValues('direction');
  // 品种页签仅对回测行生效（多品种批量跑完后切换查看；回放/实时不受影响）
  const fs = selectedMode === 'backtest' ? currentSymFilter() : '';
  return sigRows.filter(r=>r.mode===selectedMode
    &&(!f||r.status===f)
    &&(!st.length||st.includes(r.strategyKey))
    &&(!dir.length||dir.includes(signalDirectionKey(r)))
    &&(!fs||r.symbol===fs));
}
// 盈亏汇总：统计（summaryStats，对过滤后的行实时聚合）与展示（summaryHtml）分离，
// 展示函数同时吃后端保存时固化的 summary（bt_runs.compute_summary 同口径），
// 保证当前表格 / 历史明细 / 对比三处数字一致。
// pnl 为 null 的行（信号/同向过滤）不参与任何盈亏合计；pnl=0 不计盈亏（保本单）。
function summaryStats(rows) {
  const closed = rows.filter(r => r.status === '已平仓' && r.pnl != null);
  const openP = rows.filter(r => r.status === '持仓中' && r.pnl != null);
  const win = closed.filter(r => r.pnl > 0);
  const lose = closed.filter(r => r.pnl < 0);
  // 已平仓平均盈利 / 平均亏损绝对值；保本单和持仓浮盈不参与。
  const avgWin = win.length ? win.reduce((s, r) => s + r.pnl, 0) / win.length : 0;
  const avgLoss = lose.length ? -lose.reduce((s, r) => s + r.pnl, 0) / lose.length : 0;
  const ex = { stopBe: 0, stopSr: 0, close: 0, half: 0 };
  for (const r of rows) {
    if (r.exitType && r.exitType in ex) ex[r.exitType]++;
    ex.half += (r.exits || []).filter(e => e.type === 'half').length;
  }
  return {
    closed: closed.length, win: win.length, lose: lose.length,
    win_rate: (win.length + lose.length) ? Math.round(100 * win.length / (win.length + lose.length)) : null,
    avg_win: avgWin, avg_loss: avgLoss,
    payoff_ratio: avgLoss ? avgWin / avgLoss : null,  // null=无亏损样本（展示为 ∞/—）
    realized: closed.reduce((s, r) => s + r.pnl, 0),
    floating: openP.reduce((s, r) => s + r.pnl, 0),
    exits: ex,
  };
}
// 零点居中双向迷你条：maxAbs 为展示行（含分批出场行）|pnl| 最大值；0 只画空轨道
function pnlBarHtml(pnl, maxAbs) {
  if (pnl == null || !maxAbs) return '';
  const v = Number(pnl);
  if (!Number.isFinite(v)) return '';
  if (v === 0) return '<span class="pnl-bar-track" aria-hidden="true"></span>';
  const w = Math.min(50, Math.abs(v) / maxAbs * 50).toFixed(2);
  return `<span class="pnl-bar-track" aria-hidden="true"><i class="pnl-bar ${v > 0 ? 'pos' : 'neg'}" style="width:${w}%"></i></span>`;
}
// 环形图：segments [{n, color, label}]，中心主/副文本；段间留缝，单段画整环，空数据显示空轨道
function donutHtml(segments, c1, c2) {
  const R = 24, C = 32, SW = 9, TAU = Math.PI * 2;
  const total = segments.reduce((s, g) => s + g.n, 0);
  const track = `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--input)" stroke-width="${SW}"/>`;
  let arcs = '';
  const items = total > 0 ? segments.filter(g => g.n > 0) : [];
  if (items.length === 1) {
    arcs = `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${items[0].color}" stroke-width="${SW}"><title>${items[0].label} ${items[0].n}</title></circle>`;
  } else if (items.length > 1) {
    let a = -Math.PI / 2;
    const GAP = TAU / 240;  // 段间缝隙约 1.5°，露出轨道底色
    const pt = ang => `${(C + R * Math.cos(ang)).toFixed(2)} ${(C + R * Math.sin(ang)).toFixed(2)}`;
    arcs = items.map(g => {
      const seg = g.n / total * TAU;
      const gap = Math.min(GAP, seg / 4);
      const path = `<path d="M ${pt(a + gap)} A ${R} ${R} 0 ${seg > Math.PI ? 1 : 0} 1 ${pt(a + seg - gap)}" fill="none" stroke="${g.color}" stroke-width="${SW}"><title>${g.label} ${g.n}</title></path>`;
      a += seg;
      return path;
    }).join('');
  }
  return `<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="${c1} ${c2}">${track}${arcs}
    <text x="${C}" y="31" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--text)">${c1}</text>
    <text x="${C}" y="41.5" text-anchor="middle" font-size="7.5" fill="var(--muted)">${c2}</text></svg>`;
}
// 汇总条：默认纯文本（实时表格 #pnl-summary 用）；opts.graphics 为明细弹窗图形瓦片版，数字口径一致
function summaryHtml(s, opts = {}) {
  const total = (s.realized || 0) + (s.floating || 0);
  const fmtV = v => (v > 0 ? '+' : '') + v.toFixed(2);
  const cls = v => (v > 0 ? 'pnl-pos' : v < 0 ? 'pnl-neg' : '');
  const payoff = s.payoff_ratio != null ? s.payoff_ratio.toFixed(2) : (s.win ? '∞' : '—');
  if (opts.graphics) {
    const num = v => Number(v || 0);
    const ex = s.exits || {};
    const win = num(s.win), lose = num(s.lose), closed = num(s.closed);
    const be = Math.max(0, closed - win - lose);  // 保本单：盈亏均不计
    const realized = num(s.realized), floating = num(s.floating);
    const maxRF = Math.max(Math.abs(realized), Math.abs(floating), Math.abs(total), 0);
    const avgWin = num(s.avg_win), avgLoss = num(s.avg_loss);
    const maxAvg = Math.max(avgWin, avgLoss);
    const exitN = num(ex.stopBe) + num(ex.stopSr) + num(ex.close);
    const tile = (label, value, graph, legend) =>
      `<div class="sum-tile"><span class="sum-label">${label}</span><span class="sum-value">${value}</span><span class="sum-graph">${graph}</span>${legend ? `<span class="sum-legend">${legend}</span>` : ''}</div>`;
    const pairBar = (label, val, txt, color) => `
      <div class="sum-pair-row"><span>${label}</span><span class="bar"><i style="width:${maxAvg > 0 ? Math.min(100, val / maxAvg * 100).toFixed(2) : 0}%;background:${color}"></i></span><span>${txt}</span></div>`;
    const donutTile = (label, donut, legend) =>
      `<div class="sum-tile sum-tile-donut">${donut}<span class="sum-donut-side"><span class="sum-label">${label}</span>${legend ? `<span class="sum-legend">${legend}</span>` : ''}</span></div>`;
    return [
      // 行1：盈亏结果（数字 + 共享比例尺双向条）
      tile('已平仓盈亏', `<b class="${cls(realized)}">${fmtV(realized)}</b>`, pnlBarHtml(realized, maxRF)),
      tile('浮盈', `<b class="${cls(floating)}">${fmtV(floating)}</b>`, pnlBarHtml(floating, maxRF)),
      tile('合计', `<b class="${cls(total)}" title="已平仓盈亏 + 浮盈">${fmtV(total)}</b>`, pnlBarHtml(total, maxRF)),
      // 行2：结构比率（盈亏比对条 + 胜率/出场分布环形图）
      tile('盈亏比',
        `<span title="已平仓平均盈利 ÷ 平均亏损绝对值；不含保本单和持仓浮盈。仅盈利显示∞，仅亏损显示0.00，无盈亏样本显示—。">${payoff}</span>`,
        `<span class="sum-pair">${pairBar('均盈', avgWin, '+' + avgWin.toFixed(2), 'var(--buy)')}${pairBar('均亏', avgLoss, '-' + avgLoss.toFixed(2), 'var(--sell)')}</span>`,
        `均盈 ${avgWin.toFixed(2)} · 均亏 ${avgLoss.toFixed(2)}`),
      donutTile('胜率',
        donutHtml([
          { n: win, color: 'var(--buy)', label: '盈' },
          { n: be, color: 'var(--muted)', label: '保本' },
          { n: lose, color: 'var(--sell)', label: '亏' },
        ], s.win_rate != null ? s.win_rate + '%' : '—', '胜率'),
        `盈 ${win} · 保本 ${be} · 亏 ${lose} · 共 ${closed}`),
      donutTile('出场分布',
        donutHtml([
          { n: num(ex.stopBe), color: '#5a8de6', label: '保损' },
          { n: num(ex.stopSr), color: '#c8742a', label: '止损' },
          { n: num(ex.close), color: '#8f6ce8', label: '全平' },
        ], String(exitN), '次出场'),
        `保损 ${num(ex.stopBe)} · 止损 ${num(ex.stopSr)} · 全平 ${num(ex.close)}${ex.half ? ' · 半平 ' + num(ex.half) : ''}`),
    ].join('');
  }
  const parts = [
    `已平仓 <b>${s.closed}</b>（盈 ${s.win} / 亏 ${s.lose}${s.win_rate != null ? ' · 胜率 ' + s.win_rate + '%' : ''}）`,
    `<span title="已平仓平均盈利 ÷ 平均亏损绝对值；不含保本单和持仓浮盈。仅盈利显示∞，仅亏损显示0.00，无盈亏样本显示—。">盈亏比 <b>${payoff}</b></span>`,
    `已平仓盈亏 <b class="${cls(s.realized)}">${fmtV(s.realized)}</b>`,
    `浮盈 <b class="${cls(s.floating)}">${fmtV(s.floating)}</b>`,
    `合计 <b class="${cls(total)}">${fmtV(total)}</b>`,
    `出场：保损 ${s.exits.stopBe} · 止损 ${s.exits.stopSr} · 全平 ${s.exits.close}${s.exits.half ? ' · 半平 ' + s.exits.half : ''}`,
  ];
  return parts.map(p => `<span>${p}</span>`).join('');
}
function renderSummary(rows) {
  el('pnl-summary').innerHTML = summaryHtml(summaryStats(rows));
}
// # 列显示序号：当前会话内该模式记录的到达顺序（1 起，清空表格/重新启动回测后重新从 1 计）；
// 内部 id 不变，定位与方案保存仍按 id 精确匹配。不在当前会话的行（如弹窗快照）退回内部 id。
function displayNo(row) {
  let n = 0;
  for (const r of sigRows) {
    if (r.mode !== row.mode) continue;
    n++;
    if (r.id === row.id) return n;
  }
  return row.id;
}
// 定位提示文案用的序号：能解析到会话内行则显示序号，否则显示内部 id
function locateLabel(mode, id) {
  const row = sigRows.find(r => r.id === id && r.mode === mode);
  return `#${row ? displayNo(row) : id}`;
}
// 行 → <tr> HTML：实时表格与历史方案明细弹窗共用。
// opts.selectedId：明细弹窗用独立选中态；opts.labelById：明细用方案内序号。
// opts.showLossReason：明细表在盈亏后显示亏损原因列（rowspan 与交易级字段一致）。
function signalRowsHtml(rows, opts = {}) {
  const interactive = opts.interactive !== false;
  const selectedId = 'selectedId' in opts ? opts.selectedId : selectedSignal[selectedMode];
  const showLoss = !!opts.showLossReason;
  // 品种角标：回测行出现 >1 个品种且当前是「全部」混合视图时在策略列标注行所属品种
  // （已按页签切到具体品种时每行品种相同，角标冗余不显示）
  const showSym = interactive && !currentSymFilter() && new Set(
    sigRows.filter(r => r.mode === 'backtest').map(r => r.symbol)).size > 1;
  return rows.map(r => {
    const exits = exitDisplayRows(r);
    const no = opts.labelById ? (opts.labelById[r.id] ?? r.id)
      : (interactive ? displayNo(r) : r.id);
    const symBadge = showSym && r.mode === 'backtest' && r.symbol
      ? `<span class="mini-badge" title="${escAttr(r.symbol)}">${esc(String(r.symbol).split(':').pop())}</span>` : '';
    const shared = `
      <td title="内部记录 id：${r.id}">${no}</td>
      <td>${fmtTime(r.time)}</td>
      <td class="${r.direction === 'long' ? 'long' : 'short'}">${signalDirectionName(r)}</td>
      <td>${r.periodX || '-'}</td>
      <td>${r.strategyKey || '-'}${candidateBadges(r)}${symBadge}</td>
      <td>${r.markRes || '-'}</td>
      <td>${r.price != null ? Number(r.price).toFixed(2) : '-'}</td>
      <td>${r.nearSr != null ? Number(r.nearSr).toFixed(2) : '-'}</td>
      <td><span class="status-tag ${statusClass(r.status)}">${r.status}</span></td>
      <td>${fmtTime(r.entryTime)}</td>
      <td>${r.entryPrice != null ? Number(r.entryPrice).toFixed(2) : '-'}</td>
    `.replace(/<td(?=[ >])/g, `<td rowspan="${exits.length}"`);
    const lossTitle = r.lossReason
      ? (r.lossEndClose != null
        ? `第 ${r.lossLookahead || '?'} 根收盘 ${Number(r.lossEndClose).toFixed(2)} @ ${fmtTime(r.lossEndTime)}`
        : `回看 ${r.lossLookahead || '?'} 根，数据不足`)
      : '仅已平仓亏损单参与归因';
    const lossCell = showLoss
      ? `<td rowspan="${exits.length}" title="${esc(lossTitle)}">${r.lossReason || '-'}</td>`
      : '';
    return exits.map((exit, i) => {
      const pnl = exit.pnl;
      const pnlCls = pnl == null || pnl === 0 ? '' : (pnl > 0 ? 'pnl-pos' : 'pnl-neg');
      const pnlTxt = pnl == null ? '-' : (pnl > 0 ? '+' : '') + pnl.toFixed(2);
      // 明细弹窗（opts.pnlBars=展示行|pnl|最大值）数字旁加零点双向条；主表不传则纯文本
      const pnlBody = opts.pnlBars && pnl != null
        ? `<span class="pnl-cell">${pnlTxt}${pnlBarHtml(pnl, opts.pnlBars)}</span>`
        : pnlTxt;
      const totalTxt = r.pnl == null ? '-' : Number(r.pnl).toFixed(2);
      const selected = interactive && selectedId === r.id;
      const classes = [selected ? 'selected' : '', i ? 'exit-continuation' : ''].filter(Boolean).join(' ');
      const attrs = interactive
        ? ` data-signal-id="${r.id}" tabindex="0" aria-selected="${selected}" title="点击定位信号K线并标记该行进出场"`
        : '';
      return `<tr${attrs}${classes ? ` class="${classes}"` : ''}>
        ${i === 0 ? shared : ''}
        <td>${fmtTime(exit.time)}</td>
        <td>${exit.price != null ? Number(exit.price).toFixed(2) : '-'}</td>
        <td title="${exitEventsDesc(r)}">${exit.label}</td>
        <td>${exit.lots != null ? exit.lots : '-'}</td>
        <td class="${pnlCls}" title="${exits.length > 1 ? (exit.type ? '本次出场盈亏' : '剩余持仓浮盈') + '；整笔交易合计：' + totalTxt : '整笔交易盈亏'}">${pnlBody}</td>
        ${i === 0 ? lossCell : ''}
      </tr>`;
    }).join('');
  }).join('');
}

// 行 → 右击复制的交易信息文本：列名：值 用「；」分割，口径与 signalRowsHtml 逐列一致（所见即所得）。
// 分批出场的交易整笔全展：每条出场行（半平/剩余持仓）的出场五列依次展开，列名重复出现。
function signalCopyText(r, no) {
  const px = v => v != null ? Number(v).toFixed(2) : '-';
  const pnlTxt = v => v == null ? '-' : (v > 0 ? '+' : '') + v.toFixed(2);
  const parts = [
    `#：${no}`,
    `信号时间：${fmtTime(r.time)}`,
    `方向：${signalDirectionName(r)}`,
    `检测周期：${r.periodX || '-'}`,
    `策略：${r.strategyKey || '-'}`,
    `背驰级别：${r.markRes || '-'}`,
    `价格：${px(r.price)}`,
    `近支阻：${px(r.nearSr)}`,
    `状态：${r.status}`,
    `成交时间：${fmtTime(r.entryTime)}`,
    `成交价：${px(r.entryPrice)}`,
  ];
  for (const exit of exitDisplayRows(r)) {
    parts.push(`出场时间：${fmtTime(exit.time)}`, `出场价：${px(exit.price)}`,
      `出场类型：${exit.label}`, `手数：${exit.lots != null ? exit.lots : '-'}`, `盈亏：${pnlTxt(exit.pnl)}`);
  }
  // 明细归因后带亏损原因（主表行无此字段则跳过）
  if (r.lossReason) parts.push(`亏损原因：${r.lossReason}`);
  return parts.join('；');
}

// 右击复制执行：优先 clipboard API（localhost 安全上下文），失败回退 execCommand（局域网 http 访问）
function copySignalInfo(event, text) {
  event.preventDefault();
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;';
    const modal = el('bt-detail-modal');
    const focused = document.activeElement;
    (modal && !modal.hidden ? modal : document.body).appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (focused?.isConnected) focused.focus({ preventScroll: true });
    showCopyTip(ok ? '已复制交易信息' : '复制失败，请手动复制');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showCopyTip('已复制交易信息'), fallback);
  } else fallback();
}
let copyTipTimer = null;
function showCopyTip(msg) {
  let tip = document.getElementById('copy-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'copy-tip';
  }
  // 全屏元素之外的节点不会显示；明细里的复制反馈跟随弹窗。
  const modal = el('bt-detail-modal');
  (modal && !modal.hidden ? modal : document.body).appendChild(tip);
  tip.textContent = msg;
  tip.classList.add('show');
  clearTimeout(copyTipTimer);
  copyTipTimer = setTimeout(() => tip.classList.remove('show'), 1500);
}

function renderTable() {
  refreshSymTabs();        // 品种页签先于过滤刷新：首个多品种行到达即回落默认选中品种
  const rows = filteredRows();
  if (!sigRows.some(r=>r.mode===selectedMode&&r.id===selectedSignal[selectedMode])) {
    selectedSignal[selectedMode] = null;
    locateMessages[selectedMode] = '';
  }
  el('locate-status').textContent = locateMessages[selectedMode] || '点击记录，定位到 TradingView 的信号K线并标记该行进出场与支阻位';
  // 仅排列展示副本；无盈亏的记录始终置后，相同盈亏保持原始顺序。
  const sort = modePnlSort[selectedMode];
  el('pnl-header').ariaSort = sort;
  el('sort-pnl').textContent = '盈亏 ' + ({none:'↕',descending:'↓',ascending:'↑'}[sort]);
  el('sort-pnl').title = {none:'点击按整笔交易盈亏从高到低排序',descending:'点击按整笔交易盈亏从低到高排序',ascending:'点击恢复默认顺序'}[sort];
  renderSummary(rows);
  scheduleLiveEquity();
  if (sort !== 'none') {
    rows.sort((a, b) => {
      const aValue = a.pnl == null ? NaN : Number(a.pnl);
      const bValue = b.pnl == null ? NaN : Number(b.pnl);
      const aValid = Number.isFinite(aValue), bValid = Number.isFinite(bValue);
      if (!aValid || !bValid) return aValid ? -1 : bValid ? 1 : 0;
      return sort === 'ascending' ? aValue - bValue : bValue - aValue;
    });
  }
  el('sig-body').innerHTML = signalRowsHtml(rows);
  const modeCount=sigRows.filter(r=>r.mode===selectedMode).length;
  el('count').textContent = rows.length === modeCount
    ? `共 ${modeCount} 条`
    : `筛选 ${rows.length} / 共 ${modeCount} 条`;
  updateBtSaveButton();
}

function togglePnlSort() {
  modePnlSort[selectedMode] = {none:'descending',descending:'ascending',ascending:'none'}[modePnlSort[selectedMode]];
  renderTable();
}

function finishLocate(job) {
  if (!locatePending || job?.jobId !== locatePending.jobId || job.state === 'running') return;
  const mode = locatePending.mode;
  const source = locatePending.source;
  const id = locatePending.id;
  const staleDetail = source === 'detail' && locatePending.detailEpoch !== btDetailEpoch;
  if (staleDetail) {
    locatePending = null;
    clearTimeout(locatePoll);
    updateMarkButtons();
    return;
  }
  if (job.state === 'done') {
    // 单行标记结果：定位成功后同一任务内已画该行进出场箭头+支阻横线
    const mk = job.result.mark;
    const markTxt = mk?.error ? `（标记未画：${mk.error}）`
      : mk?.skipped ? `（${mk.skipped}，不画标记）`
      : mk ? `并标记 ${mk.drawn} 个` : '';
    const replayTxt = job.result.replay ? '（K线回放）' : '';
    const msg = `${source === 'detail' ? `#${btDetailLabelOf(id)}` : locateLabel(mode, id)} 已定位${replayTxt}${markTxt} · ${job.result.symbol} · ${job.result.markRes} · ${fmtTime(job.result.time)}`;
    if (source === 'detail') setBtDetailLocateMsg(msg);
    else locateMessages[mode] = msg;
  } else {
    const msg = `${source === 'detail' ? `#${btDetailLabelOf(id)}` : locateLabel(mode, id)} 定位失败：${job.error || '未知错误'}`;
    if (source === 'detail') setBtDetailLocateMsg(msg, true);
    else locateMessages[mode] = msg;
  }
  locatePending = null;
  clearTimeout(locatePoll);
  updateMarkButtons();
  if (source === 'detail') renderBtDetailRows();
  else renderTable();
}

async function pollLocate() {
  if (!locatePending?.jobId) return;
  const pending = locatePending;
  try {
    const response = await fetch('/api/signals/locate');
    if (!response.ok) throw Error('状态查询失败');
    const data = await response.json();
    if (locatePending !== pending) return;
    if (!data.job || data.job.jobId !== pending.jobId) {
      finishLocate({...pending,state:'error',error:'定位状态已失效，服务可能已重启，请重试'});
    } else finishLocate(data.job);
  } catch (e) {
    if (locatePending === pending) {
      const msg = `${pending.source === 'detail' ? `#${btDetailLabelOf(pending.id)}` : locateLabel(pending.mode, pending.id)} 定位状态连接中断，正在重新查询…`;
      if (pending.source === 'detail') {
        if (pending.detailEpoch === btDetailEpoch) setBtDetailLocateMsg(msg);
      }
      else {
        locateMessages[pending.mode] = msg;
        renderTable();
      }
    }
  }
  if (locatePending === pending) locatePoll = setTimeout(pollLocate, 2000);
}

function locateAfterBars() {
  const n = parseInt(el('locate-after-bars')?.value, 10);
  return Number.isFinite(n) && n >= 0 ? n : 60;
}

async function locateRow(id) {
  if (locatePending) return;
  const mode = selectedMode;
  if (!sigRows.some(r=>r.id===id&&r.mode===mode)) return;
  selectedSignal[mode] = id;
  if (markBusy || isAnyModeRunning()) {
    locateMessages[mode] = '图表正被任务占用，请结束运行或暂停中的任务，并等待图表操作完成后再定位';
    renderTable();
    return;
  }
  const pending = {mode,id};
  locatePending = pending;
  locateMessages[mode] = `${locateLabel(mode, id)} 定位并标记中…（实时历史不够时会用K线回放跳转，最多等待360秒）`;
  renderTable();
  updateMarkButtons();
  try {
    // 单行标记颜色随工具条取色器（与「标记进出场」按钮同源）
    const response = await fetch('/api/signals/locate', {
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,id,after_bars:locateAfterBars(),colors:{
        buy:el('mark-color-buy').value, sell:el('mark-color-sell').value,
        exit:el('mark-color-exit').value, sr:el('mark-color-sr').value
      }})
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw Error(data.error || '定位请求失败');
    pending.jobId = data.job.jobId;
    // Query immediately too: a fast completion event may precede the POST response.
    pollLocate();
  } catch (e) {
    locateMessages[mode] = `${locateLabel(mode, id)} 定位失败：${e.message}`;
    locatePending = null;
    updateMarkButtons();
    renderTable();
  }
}

function bindSignalRows() {
  const activate = event => {
    if (event.type === 'keydown' && !['Enter',' '].includes(event.key)) return;
    const row = event.target.closest('tr[data-signal-id]');
    if (!row) return;
    if (event.type === 'keydown') event.preventDefault();
    locateRow(Number(row.dataset.signalId));
  };
  el('sig-body').onclick = activate;
  el('sig-body').onkeydown = activate;
  // 右击复制交易信息：仅行上拦截默认菜单，表头/空白处保持浏览器默认
  el('sig-body').oncontextmenu = event => {
    const tr = event.target.closest('tr[data-signal-id]');
    if (!tr) return;
    const row = sigRows.find(r => r.id === Number(tr.dataset.signalId) && r.mode === selectedMode);
    if (!row) return;
    copySignalInfo(event, signalCopyText(row, displayNo(row)));
  };
}

// ---------- 状态更新 ----------
function setBadge(m, s) {
  const b = el(`badge-${m}`);
  b.textContent = s;
  b.className = 'badge' + (s === 'running' || s === 'done' ? ' running'
    : s === 'paused' ? ' paused' : s === 'error' ? ' error' : '');
  const running = ['running', 'paused'].includes(s);
  el(`btn-start-${m}`).disabled = running || (state.active && state.active !== m);
  el(`btn-pause-${m}`).disabled = s !== 'running';
  el(`btn-resume-${m}`).disabled = s !== 'paused';
  el(`btn-stop-${m}`).disabled = !running;
  if (state.active && state.active !== m) {
    el(`btn-start-${m}`).disabled = true;
  }
  if (m === 'backtest') updateBtSaveButton();
}

function applyStatus(status) {
  state.active = status.active;
  for (const [m, w] of Object.entries(status.modes)) {
    if (!state.modes[m]) state.modes[m] = {};
    state.modes[m] = w;
    setBadge(m, w.state);
    if (w.error) addLog(m, `错误：${w.error}`);
    const bar = el(`bar-${m}`);
    const p = w.progress || {};
    if (p.pct != null) { bar.style.width = p.pct + '%'; el(`plabel-${m}`).textContent = `${p.current}/${p.total} (${p.pct}%)`; }
    else { bar.style.width = w.state === 'running' ? '100%' : '0%'; el(`plabel-${m}`).textContent = ''; }
    if (m === 'backtest') renderBtBatch();   // 批量并行进度表（init/刷新恢复；单品种 batch=null → 隐藏）
  }
  updateMarkButtons();
}

// ---------- 多品种批量并行（回测）：每品种进度表 + 品种筛选 ----------
function renderBtBatch() {
  const host = el('bt-batch');
  if (!host) return;
  const batch = state.modes.backtest?.batch;
  if (!batch || !Object.keys(batch).length) { host.hidden = true; host.innerHTML = ''; return; }
  host.hidden = false;
  host.innerHTML = Object.entries(batch).map(([sym, st]) => {
    const pct = st.pct != null ? st.pct : (st.state === 'done' ? 100 : 0);
    const cnt = st.state === 'skipped' ? '—' : `${st.current ?? 0}/${st.total ?? 0} (${pct}%)`;
    const err = st.error ? `<span class="bt-batch-err" title="${escAttr(st.error)}">${esc(st.error)}</span>` : '';
    return `<div class="bt-batch-row" data-sym="${escAttr(sym)}" style="cursor:pointer" title="点击在下方记录区按该品种查看信号">
      <span class="bt-batch-sym">${esc(sym)}</span>
      <span class="bt-batch-state ${esc(st.state || 'running')}">${esc(st.state || 'running')}</span>
      <span class="bt-batch-bar"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></span>
      <span class="bt-batch-pct">${cnt}</span>${err}
    </div>`;
  }).join('');
}

// 品种页签（记录区顶部，多品种批量回测）：>1 个品种时显示，**默认选中第一个品种**
// （不默认混合「全部」）；表格/汇总/资金曲线随页签切换，「保存方案」存当前品种。
// symTabSel：null=未选（刷新/新一轮批量后回落到第一个品种）；''=「全部」；其余=品种。
// 顺序优先取批量勾选顺序（batch 键序），否则按行首次出现顺序。
let symTabSel = null;
let _symTabsSig = '';
function currentSymFilter() { return symTabSel || ''; }
function refreshSymTabs() {
  const host = el('sym-tabs');
  if (!host) return;
  const batchSyms = Object.keys(state.modes.backtest?.batch || []);
  const rowSyms = [...new Set(sigRows.filter(r => r.mode === 'backtest' && r.symbol).map(r => r.symbol))];
  const syms = batchSyms.length > 1 ? batchSyms : rowSyms;
  if (syms.length <= 1) {           // 单品种/无行：隐藏页签、清选择（=不过滤）
    host.hidden = true; symTabSel = null; _symTabsSig = ''; return;
  }
  if (symTabSel === null || (symTabSel !== '' && !syms.includes(symTabSel))) symTabSel = syms[0];
  host.hidden = false;
  const sig = syms.join('') + '|' + symTabSel;
  if (sig === _symTabsSig) return;  // 运行中逐行新增时避免无谓 DOM 重建
  _symTabsSig = sig;
  host.innerHTML = syms.map(s =>
    `<button type="button" class="sym-tab${s === symTabSel ? ' active' : ''}" data-sym="${escAttr(s)}" title="${escAttr(s)}">${esc(s.split(':').pop())}</button>`).join('')
    + `<button type="button" class="sym-tab${symTabSel === '' ? ' active' : ''}" data-sym="" title="全部品种混合视图">全部</button>`;
}

function addLog(m, msg) {
  logs[m].push(msg);
  if (logs[m].length > 200) logs[m].shift();
  const box = el(`log-${m}`);
  box.textContent = logs[m].join('\n');
  box.scrollTop = box.scrollHeight;
}

// ---------- 控制调用 ----------
async function api(path, body, reqOpts = {}) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json();
  if (!r.ok || !data.ok) {
    if (!reqOpts.noAlert) alert(data.error || `请求失败 ${r.status}`);
    return null;
  }
  return data;
}

function collectCfg(m) {
  const cfg = {};
  document.querySelectorAll(`#card-${m} [data-cfg]`).forEach(inp => {
    const v = inp.value;
    cfg[inp.dataset.cfg] = v === 'true' ? true : v === 'false' ? false : v;
  });
  if (m === 'backtest') {
    cfg.signal_mode = 'realtime';
    // data_source 三选映射回后端旧语义：cache → use_cache=true（store/live 走新字段）
    cfg.use_cache = (cfg.data_source === 'cache');
  }
  cfg.periods = String(cfg.periods || '').split(',').map(s => s.trim()).filter(Boolean);
  // 30秒级别开关：开启时向 periods 追加 30S（只落盘最近3天数据，供 3 分钟进场背驰检测）
  if (cfg.with_30s === true && !cfg.periods.includes('30S')) cfg.periods.push('30S');
  if (cfg.with_30s === false) cfg.periods = cfg.periods.filter(p => p !== '30S');
  return cfg;
}

// ---------- 周期/品种多选下拉 ----------
// 勾选变化 → 按面板内选项顺序（= 常量清单顺序）同步隐藏 input（data-cfg）与按钮文案。
// 面板带 data-ms="periods"|"symbols" 区分用途（2026-09-23 品种多选加入后泛化）
function syncMs(ms) {
  if (!ms) return;
  const boxes = [...ms.querySelectorAll('[data-ms-opt]')];
  const values = boxes.filter(c => c.checked).map(c => c.value);
  const input = ms.querySelector('input[data-cfg]');
  ms.querySelector('.ms-value').textContent = values.length
    ? values.join(',')
    : (input?.dataset.cfg === 'symbols' ? '请选择品种' : '请选择周期');
  if (input) input.value = values.join(',');
}
function closeAllMsPanels(except) {
  document.querySelectorAll('.ms-panel').forEach(p => {
    const ms = p.closest('.ms');
    if (ms === except || p.hidden) return;
    p.hidden = true;
    ms.querySelector('[data-ms-toggle]').setAttribute('aria-expanded', 'false');
  });
}

// 回测卡：勾选 >1 个品种时禁用不可并行的数据源（live/cache）并回落 store。
// 提示性联动；服务端 normalize_cfg 硬校验兜底
function toggleBtSourceOptions() {
  const card = el('card-backtest');
  const sel = card?.querySelector('[data-cfg="data_source"]');
  if (!sel) return;
  const n = String(card.querySelector('[data-cfg="symbols"]')?.value || '')
    .split(',').map(s => s.trim()).filter(Boolean).length;
  [...sel.options].forEach(o => { if (o.value !== 'store') o.disabled = n > 1; });
  if (n > 1 && sel.value !== 'store') sel.value = 'store';
}

// ---------- 绑定 ----------
// 清空指定功能的信号记录：服务端删除 + 本地过滤；历史方案不受影响
async function clearModeRows(mode) {
  const r = await api('/api/signals/clear', { mode });
  if (r) sigRows = sigRows.filter(row => row.mode !== mode);
  renderTable();
}
function bindCard(m) {
  el(`btn-start-${m}`).onclick = async () => {
    const cfg = collectCfg(m);
    if (!cfg.periods.length) { alert('请至少选择一个周期'); return; }
    if (m === 'backtest') {
      // 品种多选：空 → 拒绝；>1 个 → 仅本地数据存储（cache 单品种文件/live 共享图表不可并行）
      cfg.symbols = String(cfg.symbols || '').split(',').map(s => s.trim()).filter(Boolean);
      if (!cfg.symbols.length) { alert('请至少选择一个品种'); return; }
      if (cfg.symbols.length > 1 && cfg.data_source !== 'store') {
        alert('多品种批量回测仅支持数据源=本地数据存储（store）');
        return;
      }
      // 全量回测启动前自动清空本轮信号表格，避免新旧行混在一起
      await clearModeRows('backtest');
    }
    const r = await api(`/api/${m}/start`, { cfg });
    if (r) { addLog(m, '启动请求已发送'); }
  };
  el(`btn-pause-${m}`).onclick = () => api(`/api/${m}/pause`);
  el(`btn-resume-${m}`).onclick = () => api(`/api/${m}/resume`);
  el(`btn-stop-${m}`).onclick = () => api(`/api/${m}/stop`);
}

// ---------- SSE ----------
function connectSSE() {
  const es = new EventSource('/api/stream');
  es.addEventListener('locate_done', e => finishLocate(JSON.parse(e.data)));
  es.onopen = () => console.log('SSE 已连接');
  es.onerror = () => { /* 自动重连 */ };
  es.addEventListener('init', e => applyStatus(JSON.parse(e.data)));
  es.addEventListener('status', e => {
    const d = JSON.parse(e.data);
    // 守卫：只认三模式自身的 status（其他模块如 data 拉取可能占用 active，但不发本事件）
    if (!MODES.some(x => x.id === d.mode)) return;
    applyStatus({ active: state.active, modes: { [d.mode]: { ...state.modes[d.mode], state: d.state } } });
  });
  es.addEventListener('log', e => {
    const d = JSON.parse(e.data);
    if (d.mode === 'mark') {
      setMarkStatus(d.msg);
      return;
    }
    // 守卫：支阻调试页（mode=sr）的日志/进度不发到三模式控制台页
    if (d.mode !== 'backtest' && d.mode !== 'replay' && d.mode !== 'live') return;
    addLog(d.mode, d.msg);
  });
  es.addEventListener('mark_done', e => {
    const d = JSON.parse(e.data);
    markBusy = false;
    stopMarkWatchdog();
    updateMarkButtons();
    const doneTxt = d.op === 'draw' ? '标记完成'
                  : d.op === 'sr_draw' ? '支阻位标记完成'
                  : '已清除标记' + (d.removed != null ? `（${d.removed} 个）` : '');
    const errTag = d.op === 'draw' ? '标记失败：' : d.op === 'sr_draw' ? '支阻标记失败：' : '清除失败：';
    setMarkStatus(d.error ? errTag + d.error : doneTxt, !!d.error);
  });
  es.addEventListener('signal', e => {
    const d = JSON.parse(e.data);
    const row = d.row;
    const idx = sigRows.findIndex(r => r.id === row.id);
    if (idx >= 0) sigRows[idx] = row; else sigRows.push(row);
    renderTable();
  });
  es.addEventListener('progress', e => {
    const d = JSON.parse(e.data);
    if (!MODES.some(x => x.id === d.mode)) return;  // 守卫：非本页模式的进度忽略
    if (!state.modes[d.mode]) state.modes[d.mode] = {};
    state.modes[d.mode].progress = { current: d.current, total: d.total, pct: d.pct };
    const bar = el(`bar-${d.mode}`);
    if (d.pct != null) { bar.style.width = d.pct + '%'; el(`plabel-${d.mode}`).textContent = `${d.current}/${d.total} (${d.pct}%)`; }
  });
  // 多品种批量并行：单品种进度/状态行（仅回测页监听；总进度条仍走 progress 事件）
  es.addEventListener('bt_symbol', e => {
    const d = JSON.parse(e.data);
    if (d.mode !== 'backtest' || !d.symbol) return;
    if (!state.modes.backtest) state.modes.backtest = {};
    const batch = state.modes.backtest.batch = state.modes.backtest.batch || {};
    batch[d.symbol] = { state: d.state, current: d.current, total: d.total,
                        pct: d.pct, error: d.error, stats: d.stats, duration: d.duration };
    renderBtBatch();
  });
  es.addEventListener('signals_cleared', e => { const d=JSON.parse(e.data);sigRows=d.mode?sigRows.filter(r=>r.mode!==d.mode):[];renderTable(); });
}

// ---------- 历史回测方案（仅全量回测：保存/列表/明细/对比/载参数） ----------
let btRuns = [];                 // 列表缓存（/api/bt/runs，不含信号行）
const btCompareSel = new Set();  // 对比勾选的方案 id
let btRunsPnlSort = 'none';      // 方案列表合计盈亏：none / descending / ascending

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pnlClass = v => (v > 0 ? 'pnl-pos' : v < 0 ? 'pnl-neg' : '');
const fmtPnlText = v => v == null ? '-' : (v > 0 ? '+' : '') + Number(v).toFixed(2);
// 方案运行墙钟时长：45秒 / 3分12秒 / 1小时05分；缺字段（旧方案）→ —
function fmtDuration(sec) {
  if (sec == null || !Number.isFinite(Number(sec)) || Number(sec) < 0) return '—';
  const s = Math.round(Number(sec));
  if (s < 60) return `${s}秒`;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  if (h > 0) return `${h}小时${String(m).padStart(2, '0')}分`;
  return r ? `${m}分${String(r).padStart(2, '0')}秒` : `${m}分`;
}
function btRunStateLabel(run) {
  const base = run.worker_state === 'stopped' ? '中途停止' : '完整';
  const dur = fmtDuration(run.summary?.duration_sec);
  return dur === '—' ? base : `${base} · ${dur}`;
}

// 保存按钮：仅最近一次回测结束（done/stopped）且信号表有回测行时可点；
// 实际可保存性（本轮是否有新增行）由后端在保存时校验
function updateBtSaveButton() {
  const btn = el('btn-bt-save');
  if (!btn) return;
  const st = state.modes.backtest?.state;
  const ready = ['done', 'stopped'].includes(st) && sigRows.some(r => r.mode === 'backtest');
  btn.disabled = !ready;
  // 「全部保存」：仅多品种批量跑完出现（一键每品种各存一条）
  const all = el('btn-bt-save-all');
  if (all) {
    const show = Object.keys(state.modes.backtest?.batch || {}).length > 1 && ready;
    all.hidden = !show;
    all.disabled = !show;
  }
}

// 表单默认名与服务端 default_name 同式：品种 + 起始日期（→结束日期，有则） + 保存时刻。
// 品种来源：批量 → 当前页签品种（默认已选中第一个品种）；单品种 → 表单唯一勾选值
function btDefaultName() {
  const card = el('card-backtest');
  const batch = state.modes.backtest?.batch || {};
  const sym = currentSymFilter() || Object.keys(batch)[0]
    || String(card.querySelector('[data-cfg="symbols"]')?.value || '')
      .split(',').map(s => s.trim()).filter(Boolean)[0] || '';
  const from = card.querySelector('[data-cfg="from"]')?.value || '';
  const to = card.querySelector('[data-cfg="to"]')?.value || '';
  const p = n => String(n).padStart(2, '0');
  const d = new Date();
  const range = to ? `${from}→${to}` : from;
  return `${sym} ${range}·${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

async function saveBtRun() {
  if (el('btn-bt-save').disabled) return;
  // 多品种批量：保存当前页签品种（「全部」时提示先选品种）；单品种：不传 symbol 走原路径
  const batchKeys = Object.keys(state.modes.backtest?.batch || {});
  const fs = currentSymFilter();
  if (batchKeys.length > 1 && !fs) {
    alert('多品种批量回测：请先在记录区顶部点选要保存的品种页签（当前为「全部」）');
    return;
  }
  const name = prompt('方案名称（参数 + 本轮信号记录 + 汇总将一起保存）：', btDefaultName());
  if (name === null) return;
  const r = await api('/api/bt/runs/save', { name: name.trim(), symbol: fs || undefined });
  if (r) {
    showRecordTab('bt');            // 保存成功后切到历史方案 TAB 直见结果（内部已刷新列表）
  }
}

// 一键全存（多品种批量）：每个完成品种自动各存一条方案（名称自动带品种）
async function saveAllBtRuns() {
  if (el('btn-bt-save-all')?.disabled) return;
  const batch = state.modes.backtest?.batch || {};
  const n = Object.keys(batch).filter(s => ['done', 'stopped'].includes(batch[s]?.state)).length;
  if (!n) { alert('没有可保存的品种结果'); return; }
  if (!confirm(`将按品种保存 ${n} 条方案（名称自动带品种），继续？`)) return;
  const r = await api('/api/bt/runs/save_all', {});
  if (!r) return;
  const parts = [`已保存 ${r.saved.length} 条`];
  if (r.skipped?.length) parts.push(`跳过 ${r.skipped.length} 个：` + r.skipped.map(s => `${s.symbol}（${s.reason}）`).join('；'));
  if (r.failed?.length) parts.push(`失败 ${r.failed.length} 个：` + r.failed.map(s => `${s.symbol}（${s.error}）`).join('；'));
  alert(parts.join('\n'));
  if (r.saved?.length) showRecordTab('bt');
}

// ---------- 记录区 TAB 切换（进场信号记录 / 历史回测方案） ----------
let activeRecordTab = 'signals';
function showRecordTab(tab) {
  activeRecordTab = tab;
  const bt = tab === 'bt';
  el('record-signals').hidden = bt;
  el('record-bt').hidden = !bt;
  document.querySelectorAll('[data-record-tab]').forEach(b => {
    const on = b.dataset.recordTab === tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', String(on));
  });
  if (bt) refreshBtRuns();
}

async function refreshBtRuns() {
  try {
    const d = await (await fetch('/api/bt/runs')).json();
    if (!d.ok) throw Error(d.error || '未知错误');
    btRuns = d.runs || [];
    [...btCompareSel].forEach(id => { if (!btRuns.some(r => r.id === id)) btCompareSel.delete(id); });
    renderBtRuns();
  } catch (e) {
    el('bt-runs-status').textContent = '列表加载失败：' + e.message;
  }
}

function renderBtRuns() {
  el('bt-runs-status').textContent = btRuns.length

  el('bt-runs-pnl-header').ariaSort = sort;
  el('sort-bt-runs-pnl').textContent = '合计 ' + ({none:'↕',descending:'↓',ascending:'↑'}[sort]);

        const aValid = Number.isFinite(aValue), bValid = Number.isFinite(bValue);
        if (!aValid || !bValid) return aValid ? -1 : bValid ? 1 : 0;
        return sort === 'ascending' ? aValue - bValue : bValue - aValue;

      const s = r.summary || {};
      return `<tr data-id="${r.id}">
        <td><input type="checkbox" data-bt-check="${r.id}"${btCompareSel.has(r.id) ? ' checked' : ''} aria-label="对比勾选 ${esc(r.name)}"></td>

        <td>${esc(r.cfg_summary?.symbol || '-')}</td>

          <button data-bt-act="load" title="把该方案的参数回填到表单（不自动启动）">载参数</button>
          <button data-bt-act="rename">重命名</button>

function toggleBtRunsPnlSort() {
  btRunsPnlSort = {none:'descending',descending:'ascending',ascending:'none'}[btRunsPnlSort];
  renderBtRuns();
}

function onBtRunsClick(e) {
  const btn = e.target.closest('button[data-bt-act]');
  if (!btn) return;
  const id = btn.closest('tr[data-id]')?.dataset.id;
  const run = btRuns.find(r => r.id === id);
  if (!run) return;
  const act = btn.dataset.btAct;
  if (act === 'detail') openBtDetail(run.id);
  else if (act === 'load') loadBtCfg(run);
  else if (act === 'rename') renameBtRun(run);
  else if (act === 'delete') deleteBtRun(run);
}

function onBtRunsCheck(e) {
  const c = e.target.closest('input[data-bt-check]');
  if (!c) return;
  if (c.checked) btCompareSel.add(c.dataset.btCheck); else btCompareSel.delete(c.dataset.btCheck);

}

// 旧方案无 summary.equity 时拉 /detail 计算，结果写回列表缓存避免重复请求
async function ensureRunEquity(run) {
  if (Array.isArray(run.summary?.equity) && run.summary.equity.length) return run.summary.equity;
  if (Array.isArray(run._equity)) return run._equity;
  const resp = await fetch(`/api/bt/runs/detail?id=${encodeURIComponent(run.id)}`);
  const d = await resp.json();
  if (!resp.ok || !d.ok) throw Error(d.error || `请求失败 ${resp.status}`);
  const eq = (Array.isArray(d.run.summary?.equity) && d.run.summary.equity.length)
    ? d.run.summary.equity
    : equityPoints(d.run.signals || []);
  run._equity = eq;
  if (!run.summary) run.summary = {};
  run.summary.equity = eq;
  return eq;
}

let compareEquityToken = 0;
async function fillCompareEquity(runs, host) {
  if (!host) return;
  const token = ++compareEquityToken;
  host.innerHTML = `<div class="eq-head"><strong>资金曲线对比</strong><span style="color:var(--muted)">加载中…</span></div>`;
  host.hidden = false;
  try {
    const series = [];
    for (let i = 0; i < runs.length; i++) {
      const pts = await ensureRunEquity(runs[i]);
      if (token !== compareEquityToken) return;  // 用户已改勾选，丢弃过期结果
      if (pts && pts.length) series.push({
        id: runs[i].id,
        name: runs[i].name,
        points: pts,
        color: compareColorOf(runs[i].id, i),
      });
    }
    if (token !== compareEquityToken) return;
    if (!series.length) {
      host.innerHTML = `<div class="eq-head"><strong>资金曲线对比</strong><span>所选方案暂无出场盈亏，无法画曲线</span></div>`;
      return;
    }
    drawEquityChart(host, series, {
      height: 140,
      title: '资金曲线对比',
      note: '叠加对比；点色块可选颜色；悬停可读累计盈亏',
      pickColors: true,
      onColorChange: (id, color) => saveCompareColor(id, color),
    });
  } catch (e) {
    if (token !== compareEquityToken) return;
    host.innerHTML = `<div class="eq-head"><strong>资金曲线对比</strong><span style="color:var(--buy)">加载失败：${esc(e.message)}</span></div>`;
  }
}

function selectBtDetailTab(tab, focus = false, remember = true) {

// 亏损归因条（明细弹窗专用）：占比堆叠条 + 分类明细（计数、占比、双向盈亏条），数字口径与旧文本版一致
function lossAnalysisHtml(la) {
  if (!la) {
    return `<div class="bt-loss-summary" id="bt-detail-loss-summary">
      <span style="color:var(--muted)">尚未分析亏损原因；可在下方设置回看根数后点「分析方案」</span>
    </div>`;
  }
  const lose = la.lose ?? 0;
  const d = la.direction || { count: 0, pnl: 0 };
  const e = la.entry_exit || { count: 0, pnl: 0 };
  const ins = la.insufficient || { count: 0 };
  const pct = (n) => lose ? Math.round(100 * n / lose) : 0;
  const fmtV = v => (v > 0 ? '+' : '') + Number(v || 0).toFixed(2);
  const head = `<div>亏损归因（信号后 <b>${la.lookahead ?? '?'}</b> 根） · 亏损 <b>${lose}</b> 笔</div>`;
  if (!lose) {
    return `<div class="bt-loss-summary bt-loss-graphic" id="bt-detail-loss-summary">${head}<span>无亏损样本</span></div>`;
  }
  // 占比堆叠条：分类色与出场分布一致（蓝/橙），数据不足为中性灰
  const cats = [
    { name: '方向问题', n: d.count ?? 0, pnl: d.pnl, color: '#5a8de6', hasBar: true },
    { name: '进出场问题', n: e.count ?? 0, pnl: e.pnl, color: '#c8742a', hasBar: true },
    { name: '数据不足', n: ins.count || 0, pnl: null, color: 'var(--muted)', hasBar: false },
  ];
  const maxLossPnl = Math.max(Math.abs(Number(d.pnl) || 0), Math.abs(Number(e.pnl) || 0), 0);
  const donut = donutHtml(cats.map(c => ({ n: c.n, color: c.color, label: c.name })), String(lose), '笔亏损');
  const rows = cats.filter(c => c.n > 0).map(c => `
    <span class="loss-cat"><i class="sw" style="background:${c.color}"></i>${c.name}
      <b>${c.n}</b>（${pct(c.n)}%）${c.hasBar
        ? `${pnlBarHtml(Number(c.pnl) || 0, maxLossPnl)}<span class="pnl-neg">${fmtV(c.pnl)}</span>`
        : ''}</span>`).join('');
  return `<div class="bt-loss-summary bt-loss-graphic" id="bt-detail-loss-summary">
    ${head}
    <div class="loss-main">${donut}<div class="loss-side"><div class="loss-cats">${rows}</div></div></div>
  </div>`;
}
