<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三模式控制台 · 缠论回测</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 20px;
    font-size: 14px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .card h2 { font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #2a2f3a; color: var(--muted);
  }
  .badge.running { background: #0d3b31; color: var(--ok); }
  .badge.paused  { background: #3d3208; color: var(--warn); }
  .badge.done    { background: #0d3b31; color: var(--ok); }
  .badge.error   { background: #4a1015; color: var(--buy); }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--muted); }
  input, select {
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  /* 周期多选下拉：按钮显示已选周期，面板内 checkbox 多选 */
  .ms { position: relative; }
  .ms-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; cursor: pointer; text-align: left;
  }
  .ms-toggle .ms-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-toggle .ms-caret { font-size: 10px; color: var(--muted); }
  .ms-panel {
    position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 100%;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 2px;
  }
  .ms-opt {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border-radius: 4px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .ms-opt:hover { background: var(--card-2); }
  .ms-opt input[type="checkbox"] { width: auto; accent-color: var(--accent); }
  /* 信号列表的策略/方向多选过滤（复用 .ms 结构）：按钮随内容收缩，不占满一行 */
  .sig-filter { flex: none; }
  .sig-filter .ms-toggle { width: auto; min-width: 96px; max-width: 260px; }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; }
  .btn-row { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  button {
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: #2b313d; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.start { background: #123; border-color: #1d4ed8; color: #7cb0ff; }
  button.danger { background: #2a1014; border-color: #8f1d2a; color: #ff8fa3; }
  button.mark { background: #101c12; border-color: #1d8f3a; color: #7fe0b0; }
  input[type="color"] {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px; width: 32px; height: 26px; cursor: pointer;
  }
  #mark-status { max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
  .progress-label { font-size: 11px; color: var(--muted); }
  .log-box {
    background: #0b0d11; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; font-family: Consolas, monospace; font-size: 11px;
    height: 110px; overflow-y: auto; color: var(--muted); white-space: pre-wrap;
    word-break: break-all;
  }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .table-wrap .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
  #pnl-summary {
    display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 14px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--card-2); font-size: 12px; color: var(--muted);
  }
  #pnl-summary b { color: var(--text); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--card-2); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
  th .sort-button { padding: 0 4px; border: 0; background: transparent; color: inherit; font: inherit; }
  td.long { color: var(--buy); }
  td.short { color: var(--sell); }
  .mode-tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #2a2f3a; }
  .mode-tag.backtest { color: #7cb0ff; }
  .mode-tag.replay   { color: #c9a0ff; }
  .mode-tag.live     { color: #7fe0b0; }
  .status-tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; }
  .mini-badge { font-size: 10px; padding: 0 4px; margin-left: 3px; border-radius: 6px;
    background: #2a2340; color: #b39ddb; border: 1px solid #4a3b6b; cursor: help; }
  .status-tag.sig { background: #123; color: #7cb0ff; }
  .status-tag.filled { background: #0d3b31; color: var(--ok); }
  .status-tag.open { background: #3d3208; color: var(--warn); }
  .status-tag.closed { background: #0d3b31; color: var(--ok); }
  .status-tag.filtered { background: #2a2f3a; color: var(--muted); }
  #pnl-summary .pnl-pos, td.pnl-pos { color: var(--buy); }
  #pnl-summary .pnl-neg, td.pnl-neg { color: var(--sell); }
  .scroll { max-height: 420px; overflow-y: auto; }
  #sig-body tr { cursor: pointer; }
  #sig-body tr:hover td { background: var(--card-2); }
  #sig-body tr.selected td { background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  #sig-body tr.selected:not(.exit-continuation) td:first-child { box-shadow: inset 3px 0 var(--accent); }
  #sig-body td[rowspan] { vertical-align: middle; }
  #sig-body tr.exit-continuation td { border-top-style: dashed; }
  #sig-body tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #locate-status { padding: 8px 14px; color: var(--muted); font-size: 12px; }
  /* ---------- 记录区 TAB（进场信号记录 / 历史回测方案） ---------- */
  .record-tabs {
    display: flex; gap: 4px; padding: 6px 10px 0;
    border-bottom: 1px solid var(--border); background: var(--card-2);
  }
  .record-tab {
    background: transparent; color: var(--muted);
    border: 1px solid transparent; border-bottom: 0;
    border-radius: 8px 8px 0 0; padding: 7px 16px; font-size: 13px;
  }
  .record-tab:hover:not(:disabled) { background: var(--card); color: var(--text); }
  .record-tab.active {
    background: var(--card); border-color: var(--border);
    color: var(--text); font-weight: 600;
  }
  /* ---------- 历史回测方案面板 / 明细弹窗 / 对比 ---------- */
  .bt-actions button { padding: 2px 8px; font-size: 12px; }
  #bt-compare-view { border-top: 1px solid var(--border); padding: 10px 14px 14px; overflow-x: auto; }
  #bt-compare-view table { font-size: 12px; margin-bottom: 8px; }
  #bt-compare-view th:first-child, #bt-compare-view td:first-child {
    position: sticky; left: 0; background: var(--card-2); z-index: 1;
  }
  .bt-diff { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--card));
    border-radius: 4px; padding: 1px 6px; }
  #bt-detail-modal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  #bt-detail-modal[hidden] { display: none; }
  .bt-modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    max-width: 96vw; width: min(1200px, 96vw); max-height: 90vh; display: flex;
    flex-direction: column; overflow: hidden; }
  .bt-modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); }
  #bt-detail-body { overflow: auto; }
  .bt-params { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 6px 14px; padding: 10px 16px; font-size: 12px; }
  .bt-params .k { color: var(--muted); margin-right: 4px; }
  .bt-summary { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--card-2); font-size: 12px; color: var(--muted); }
  .bt-summary b { color: var(--text); font-weight: 600; }
  .bt-summary .pnl-pos { color: var(--buy); }
  .bt-summary .pnl-neg { color: var(--sell); }
  #bt-detail-body .scroll { max-height: 44vh; }
</style>

<body>
<h1>三模式控制台 <a href="/sr.html" style="float:right;font-size:14px;color:var(--accent);text-decoration:none;">支阻位参数调试 →</a></h1>
<div class="sub">全量回测（纯后台） · K线回放 · 实时监控 — 同一时间最多运行一种；进场信号实时记录到下方表格</div>

<nav id="mode-nav" class="mode-nav" aria-label="回测与监控功能"></nav>
<div class="grid single-mode" id="cards"></div>
<p class="sub">记录和汇总仅属于当前功能。标记操作使用当前功能全部记录；绘制会替换共享 TD 图表上的对应标记，删除标记作用于共享图表。</p>

<!-- 记录区 TAB：进场信号记录（三模式共用）/ 历史回测方案（仅全量回测），切换显示不堆叠 -->
<div class="table-wrap">
  <div class="record-tabs" role="tablist" aria-label="记录区">
    <button class="record-tab active" role="tab" aria-selected="true" data-record-tab="signals">进场信号记录</button>
    <button class="record-tab" role="tab" aria-selected="false" data-record-tab="bt" id="tab-btn-bt" hidden
            title="仅全量回测：保存的参数+信号+固化汇总，支持明细/对比/载参数">历史回测方案</button>
  </div>
  <section id="record-bt" role="tabpanel" aria-label="历史回测方案" hidden>
    <div class="head">
      <strong>历史回测方案</strong>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span id="bt-runs-status" style="color:var(--muted);font-size:12px;margin-right:10px;"></span>
        <button id="btn-bt-refresh">刷新</button>
        <button id="btn-bt-compare" disabled title="勾选两个及以上方案后对比汇总结果与参数差异">对比选中 (0)</button>
      </div>
    </div>
    <div class="scroll" style="max-height:340px;">
      <table>
        <thead>
          <tr>
            <th>对比</th><th>名称</th><th>保存时间</th><th>品种</th><th>周期</th><th>起始</th>
            <th>已平仓</th><th>胜率</th><th>盈亏比</th><th>合计</th><th>信号数</th><th>运行</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="bt-runs-body"></tbody>
      </table>
    </div>
    <div id="bt-compare-view" hidden></div>
  </section>
  <section id="record-signals" role="tabpanel" aria-label="进场信号记录">
  <div class="head">
    <strong>进场信号记录</strong>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="ms sig-filter" id="filter-strategy">
        <button type="button" class="ms-toggle" data-ms-toggle aria-expanded="false" title="按策略过滤信号列表（可多选；不勾选=全部）">
          <span class="ms-value">策略：全部</span><span class="ms-caret">▾</span>
        </button>
        <div class="ms-panel" hidden>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="waitBuy">waitBuy · 回调后买点</label>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="wait2Buy">wait2Buy · 回调后2买</label>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="wait1Buy">wait1Buy · 一买</label>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="waitSell">waitSell · 反弹后卖点</label>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="wait2Sell">wait2Sell · 反弹后2卖</label>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="wait1Sell">wait1Sell · 一卖</label>
        </div>
      </div>
      <div class="ms sig-filter" id="filter-direction">
        <button type="button" class="ms-toggle" data-ms-toggle aria-expanded="false" title="按方向过滤信号列表（可多选；不勾选=全部）">
          <span class="ms-value">方向：全部</span><span class="ms-caret">▾</span>
        </button>
        <div class="ms-panel" hidden>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="多头多">多头多</label>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="空头空">空头空</label>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="多头空">多头空</label>
          <label class="ms-opt"><input type="checkbox" data-sig-opt value="空头多">空头多</label>
        </div>
      </div>
      <select id="filter-status" style="width:auto;" title="按状态过滤信号列表">
        <option value="">全部</option>
        <option value="信号">信号</option>
        <option value="持仓中">持仓中</option>
        <option value="已平仓">已平仓</option>
        <option value="同向过滤">同向过滤</option>
      </select>
      <span id="count" style="color:var(--muted);font-size:12px;margin-right:10px;">共 0 条</span>
      <span style="color:var(--muted);font-size:12px;">做多</span>
      <input type="color" id="mark-color-buy" value="#F23645" title="做多箭头颜色">
      <span style="color:var(--muted);font-size:12px;">做空</span>
      <input type="color" id="mark-color-sell" value="#089981" title="做空箭头颜色">
      <span style="color:var(--muted);font-size:12px;">出场</span>
      <input type="color" id="mark-color-exit" value="#FFEB3B" title="出场箭头颜色（黄：平多 ↓ / 平空 ↑，可调）">
      <span style="color:var(--muted);font-size:12px;">支阻</span>
      <input type="color" id="mark-color-sr" value="#787B86" title="支阻横线颜色（灰：近支阻价位全宽横线，可调）">
      <button id="btn-mark-draw">标记进出场</button>
      <button id="btn-sr-draw" class="mark">标记支阻位</button>
      <button id="btn-mark-clear" title="清除图上所有系统标记（进出场箭头 + 支阻横线）">删除标记</button>
      <span id="mark-status" style="color:var(--muted);font-size:12px;"></span>
      <button id="btn-clear" class="danger">清空表格</button>
    </div>
  </div>
  <div id="pnl-summary"></div>
  <div id="locate-status" role="status" aria-live="polite">点击记录，定位到 TradingView 的信号K线并标记该行进出场与支阻位</div>
  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>#</th><th>信号时间</th><th>方向</th><th>检测周期</th>
          <th>策略</th><th>背驰级别</th><th>价格</th><th>近支阻</th><th>状态</th><th>成交时间</th><th>成交价</th>
          <th>出场时间</th><th>出场价</th><th>出场类型</th><th title="分批出场时分别显示本次出场或剩余持仓手数">手数</th><th id="pnl-header" aria-sort="none"><button type="button" id="sort-pnl" class="sort-button" title="点击按整笔交易盈亏从高到低排序">盈亏 ↕</button></th>
        </tr>
      </thead>
      <tbody id="sig-body"></tbody>
    </table>
  </div>
  </section>
</div>

<!-- 历史方案明细弹窗：参数 + 固化汇总 + 信号表（静态快照，不可定位） -->
<div id="bt-detail-modal" hidden role="dialog" aria-modal="true" aria-labelledby="bt-detail-title">
  <div class="bt-modal-card">
    <div class="bt-modal-head">
      <strong id="bt-detail-title"></strong>
      <button id="bt-detail-close">关闭</button>
    </div>
    <div id="bt-detail-body"></div>
  </div>
</div>

<script>
const MODES = [
  { id: 'backtest', name: '全量回测', color: '#7cb0ff', desc: '当下背驰 · 纯后台逐根推进，可用缓存离线运行' },
  { id: 'replay', name: 'K线回放', color: '#c9a0ff', desc: '驱动软件 Bar Replay 自动播放，信号触发切周期标记' },
  { id: 'live', name: '实时监控', color: '#7fe0b0', desc: '固定 3m，新收盘 bar 全周期刷新' },
];
// 周期多选下拉的可选项；30S 不在此列，仍由「30秒级别」开关单独追加
const PERIOD_OPTIONS = ['D', '240', '60', '15', '3'];

const state = { active: null, modes: {} };
let sigRows = [];
const validMode = mode => MODES.some(m=>m.id===mode);
let selectedMode = new URLSearchParams(location.search).get('mode');
if(!validMode(selectedMode))selectedMode='backtest';
// 每个模式各自记忆 状态/策略/方向 三个筛选；sigFilterEmpty = 默认（全部）
const sigFilterEmpty = () => ({ status: '', strategy: [], direction: [] });
const modeFilters = { backtest: sigFilterEmpty(), replay: sigFilterEmpty(), live: sigFilterEmpty() };
const modePnlSort = {backtest:'none',replay:'none',live:'none'};
const selectedSignal = {backtest:null,replay:null,live:null};
const locateMessages = {backtest:'',replay:'',live:''};
let locatePending = null;
let locatePoll = null;
function reportModes(){
  if(parent!==window)parent.postMessage({type:'modes-status',modes:Object.fromEntries(MODES.map(m=>[m.id,state.modes[m.id]?.state||'idle']))},location.origin);
}
function selectMode(mode){
  if(!validMode(mode))return;
  modeFilters[selectedMode]=sigFilterCurrent();
  selectedMode=mode;
  sigFilterApply(modeFilters[mode]);
  MODES.forEach(m=>el('card-'+m.id).hidden=m.id!==mode);
  // 历史方案 TAB 只属于全量回测；切到回放/实时时隐藏该 TAB 并回到信号表
  el('tab-btn-bt').hidden = mode !== 'backtest';
  if(mode !== 'backtest' && activeRecordTab === 'bt') showRecordTab('signals');
  el('mode-nav').innerHTML=MODES.map(m=>`<button data-mode="${m.id}" aria-pressed="${m.id===mode}">${m.name}</button>`).join('');
  document.querySelector('h1').firstChild.textContent=modeName(mode)+' ';
  renderTable();
}
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='select-mode')return;
  selectMode(e.data.mode);
});
let logs = { backtest: [], replay: [], live: [] };
let markBusy = false;   // 标记操作（画/删）进行中
let markWatchdog = null; // 标记操作兜底复位定时器（SSE mark_done 丢失/线程异常时避免永久灰置）

function el(id) { return document.getElementById(id); }

// ---------- 标记工具条 ----------
function setMarkStatus(msg, isError) {
  const s = el('mark-status');
  s.textContent = msg || '';
  s.style.color = isError ? 'var(--buy)' : 'var(--muted)';
}
// 90s 看门狗：启动画/清后若迟迟收不到 mark_done（SSE 事件丢失、后台线程异常但未发事件），
// 强制复位 busy 并提示重试，保证按钮永不永久灰置。
function startMarkWatchdog() {
  clearTimeout(markWatchdog);
  markWatchdog = setTimeout(() => {
    if (markBusy) {
      markBusy = false;
      updateMarkButtons();
      setMarkStatus('操作超时或状态丢失，请重试或刷新', true);
    }
  }, 90000);
}
function stopMarkWatchdog() { clearTimeout(markWatchdog); markWatchdog = null; }
function updateMarkButtons() {
  const busy = markBusy || !!locatePending;
  el('btn-mark-draw').disabled = busy || isAnyModeRunning();
  el('btn-sr-draw').disabled = busy || isAnyModeRunning();
  el('btn-mark-clear').disabled = busy || isAnyModeRunning();
}
function isAnyModeRunning() {

// ---------- 表格 ----------
function fmtTime(t) {
  if (!t) return '-';
  // UTC+8（北京时间）显示：China Standard Time 无夏令时，偏移直接加 8 小时
  const d = new Date((t + 8 * 3600) * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;
}
function modeName(id) { return MODES.find(m => m.id === id)?.name || id; }
function signalDirectionName(r) {
  const directions = ['多头多', '空头空', '多头空', '空头多'];
  if (directions.includes(r.planDirection)) return r.planDirection;
  // 旧记录未保存 planDirection，按 trading_plan.strategyOf / entryStrategyOf 的固定对应关系显示。
  return {wait2Buy:'多头多',waitBuy:'多头多',wait2Sell:'空头空',waitSell:'空头空',
    wait1Sell:'多头空',wait1Buy:'空头多'}[r.strategyKey] || '-';
}
// 信号候选角标（SPEC_divergence_fallback）：回退/近等/预期够笔口径标记
function candidateBadges(r) {
  const b = [];
  if (r.fallback) b.push(['回退', '下沉停止级无候选，沿链上一级回退命中（M1）']);
  if (r.nearEqual) b.push(['近等', '未严格创新极值、近等容差+三判据AND命中（M2）']);
  if (r.expectBi) b.push(['预期', '检测周期末笔反向、按预期够笔口径放行（M4）']);
  return b.map(([t, tip]) => `<span class="mini-badge" title="${tip}">${t}</span>`).join('');
}
// 出场类型：stopSr=支阻位止损（支阻位±止损滑点；无正确侧位兜底 进场价±兜底滑点）
//          | stopBe=保本止损（beStop=进场K线极值±保本滑点）| close=全平（顺势=有利方向破前高/低；
//          逆势=形成段≥5合并K）；exits 含 half=平一半（顺势形成段≥5合并K）/breakeven=保本
function exitTypeName(t) {
  if (t === 'half') return '半平';
  if (t === 'stopSr') return '支阻位止损';
  if (t === 'stopBe') return '保本止损';
  if (t === 'close') return '全平';
  return t || '-';
}
function exitEventsDesc(r) {
  const names = { breakeven: '保本', half: '半', close: '平', stopSr: '损', stopBe: '保损' };
  return (r.exits || []).map(e => names[e.type] || e.type).join('·') || '';
}
// 分批出场只拆分展示，仍按整笔交易计数、汇总和排序。
function exitDisplayRows(r) {
  const numeric = value => value != null && Number.isFinite(Number(value)) ? Number(value) : null;
  const totalPnl = numeric(r.pnl), lots = numeric(r.lots);
  const final = {time:r.exitTime,price:r.exitPrice,type:r.exitType,
    label:r.exitType ? exitTypeName(r.exitType) : (r.state === 'open' ? '持仓中' : '-'),lots,pnl:totalPnl};
  // 现有结算按首次 half 平掉原持仓一半；breakeven 仅移动止损，不是出场。
  const half = (r.exits || []).find(e=>e.type === 'half');
  if (!half) return [final];
  const halfLots = lots == null ? null : lots / 2;
  const entry = numeric(r.entryPrice), price = numeric(half.price);
  const direction = r.direction === 'long' ? 1 : r.direction === 'short' ? -1 : null;
  const halfPnl = entry == null || price == null || halfLots == null || direction == null
    ? null : (price - entry) * direction * halfLots;
  final.lots = halfLots;
  final.pnl = totalPnl == null || halfPnl == null ? null : totalPnl - halfPnl;
  if (!r.exitType) final.label = '剩余持仓';
  return [{time:half.time,price:half.price,type:'half',label:'半平',lots:halfLots,pnl:halfPnl},final];
}
function statusClass(s) {
  return { '已平仓': 'closed', '持仓中': 'open', '同向过滤': 'filtered', '已成交': 'filled' }[s] || 'sig';
}
// 状态/策略/方向过滤器：状态 '' = 全部；策略/方向为多选下拉，不勾选 = 全部
// 方向按 方向 列的展示口径（signalDirectionName，旧记录回退到策略映射）过滤
function sigFilterValues(name) {
  return [...el(`filter-${name}`).querySelectorAll('[data-sig-opt]:checked')].map(c => c.value);
}
function sigFilterCurrent() {
  return { status: el('filter-status').value,
    strategy: sigFilterValues('strategy'), direction: sigFilterValues('direction') };
}
function sigFilterApply(f) {
  el('filter-status').value = f.status;
  for (const name of ['strategy', 'direction'])
    el(`filter-${name}`).querySelectorAll('[data-sig-opt]').forEach(c => { c.checked = f[name].includes(c.value); });
  syncSigFilter('strategy');
  syncSigFilter('direction');
}
// 下拉按钮文案：显示已选值（逗号连接），空 = 全部
function syncSigFilter(name) {
  const vals = sigFilterValues(name);
  el(`filter-${name}`).querySelector('.ms-value').textContent =
    (name === 'strategy' ? '策略' : '方向') + '：' + (vals.length ? vals.join(',') : '全部');
}
function filteredRows() {
  const f = el('filter-status').value;
  const st = sigFilterValues('strategy');
  const dir = sigFilterValues('direction');
  return sigRows.filter(r=>r.mode===selectedMode
    &&(!f||r.status===f)
    &&(!st.length||st.includes(r.strategyKey))
    &&(!dir.length||dir.includes(signalDirectionName(r))));
}
// 盈亏汇总：统计（summaryStats，对过滤后的行实时聚合）与展示（summaryHtml）分离，
// 展示函数同时吃后端保存时固化的 summary（bt_runs.compute_summary 同口径），
// 保证当前表格 / 历史明细 / 对比三处数字一致。
// pnl 为 null 的行（信号/同向过滤）不参与任何盈亏合计；pnl=0 不计盈亏（保本单）。
function summaryStats(rows) {
  const closed = rows.filter(r => r.status === '已平仓' && r.pnl != null);
  const openP = rows.filter(r => r.status === '持仓中' && r.pnl != null);
  const win = closed.filter(r => r.pnl > 0);
  const lose = closed.filter(r => r.pnl < 0);
  // 已平仓平均盈利 / 平均亏损绝对值；保本单和持仓浮盈不参与。
  const avgWin = win.length ? win.reduce((s, r) => s + r.pnl, 0) / win.length : 0;
  const avgLoss = lose.length ? -lose.reduce((s, r) => s + r.pnl, 0) / lose.length : 0;
  const ex = { stopBe: 0, stopSr: 0, close: 0, half: 0 };
  for (const r of rows) {
    if (r.exitType && r.exitType in ex) ex[r.exitType]++;
    ex.half += (r.exits || []).filter(e => e.type === 'half').length;
  }
  return {
    closed: closed.length, win: win.length, lose: lose.length,
    win_rate: (win.length + lose.length) ? Math.round(100 * win.length / (win.length + lose.length)) : null,
    avg_win: avgWin, avg_loss: avgLoss,
    payoff_ratio: avgLoss ? avgWin / avgLoss : null,  // null=无亏损样本（展示为 ∞/—）
    realized: closed.reduce((s, r) => s + r.pnl, 0),
    floating: openP.reduce((s, r) => s + r.pnl, 0),
    exits: ex,
  };
}
function summaryHtml(s) {
  const total = (s.realized || 0) + (s.floating || 0);
  const fmtV = v => (v > 0 ? '+' : '') + v.toFixed(2);
  const cls = v => (v > 0 ? 'pnl-pos' : v < 0 ? 'pnl-neg' : '');
  const payoff = s.payoff_ratio != null ? s.payoff_ratio.toFixed(2) : (s.win ? '∞' : '—');
  const parts = [
    `已平仓 <b>${s.closed}</b>（盈 ${s.win} / 亏 ${s.lose}${s.win_rate != null ? ' · 胜率 ' + s.win_rate + '%' : ''}）`,
    `<span title="已平仓平均盈利 ÷ 平均亏损绝对值；不含保本单和持仓浮盈。仅盈利显示∞，仅亏损显示0.00，无盈亏样本显示—。">盈亏比 <b>${payoff}</b></span>`,
    `已平仓盈亏 <b class="${cls(s.realized)}">${fmtV(s.realized)}</b>`,
    `浮盈 <b class="${cls(s.floating)}">${fmtV(s.floating)}</b>`,
    `合计 <b class="${cls(total)}">${fmtV(total)}</b>`,
    `出场：保损 ${s.exits.stopBe} · 止损 ${s.exits.stopSr} · 全平 ${s.exits.close}${s.exits.half ? ' · 半平 ' + s.exits.half : ''}`,
  ];
  return parts.map(p => `<span>${p}</span>`).join('');
}
function renderSummary(rows) {
  el('pnl-summary').innerHTML = summaryHtml(summaryStats(rows));
}
// # 列显示序号：当前会话内该模式记录的到达顺序（1 起，清空表格/重新启动回测后重新从 1 计）；
// 内部 id 不变，定位与方案保存仍按 id 精确匹配。不在当前会话的行（如弹窗快照）退回内部 id。
function displayNo(row) {
  let n = 0;
  for (const r of sigRows) {
    if (r.mode !== row.mode) continue;
    n++;
    if (r.id === row.id) return n;
  }
  return row.id;
}
// 定位提示文案用的序号：能解析到会话内行则显示序号，否则显示内部 id
function locateLabel(mode, id) {
  const row = sigRows.find(r => r.id === id && r.mode === mode);
  return `#${row ? displayNo(row) : id}`;
}
// 行 → <tr> HTML：实时表格与历史方案明细弹窗共用。
// interactive=false（已保存方案明细）不绑定定位点击/选中态——定位依赖内存
// SignalLog，对落库快照无意义。
function signalRowsHtml(rows, opts = {}) {
  const interactive = opts.interactive !== false;
  return rows.map(r => {
    const exits = exitDisplayRows(r);
    const shared = `
      ${interactive ? `<td title="内部记录 id：${r.id}">${displayNo(r)}</td>` : `<td title="内部记录 id">${r.id}</td>`}
      <td>${fmtTime(r.time)}</td>
      <td class="${r.direction === 'long' ? 'long' : 'short'}">${signalDirectionName(r)}</td>
      <td>${r.periodX || '-'}</td>
      <td>${r.strategyKey || '-'}${candidateBadges(r)}</td>
      <td>${r.markRes || '-'}</td>
      <td>${r.price != null ? Number(r.price).toFixed(2) : '-'}</td>
      <td>${r.nearSr != null ? Number(r.nearSr).toFixed(2) : '-'}</td>
      <td><span class="status-tag ${statusClass(r.status)}">${r.status}</span></td>
      <td>${fmtTime(r.entryTime)}</td>
      <td>${r.entryPrice != null ? Number(r.entryPrice).toFixed(2) : '-'}</td>
    `.replace(/<td(?=[ >])/g, `<td rowspan="${exits.length}"`);
    return exits.map((exit, i) => {
      const pnl = exit.pnl;
      const pnlCls = pnl == null || pnl === 0 ? '' : (pnl > 0 ? 'pnl-pos' : 'pnl-neg');
      const pnlTxt = pnl == null ? '-' : (pnl > 0 ? '+' : '') + pnl.toFixed(2);
      const totalTxt = r.pnl == null ? '-' : Number(r.pnl).toFixed(2);
      const selected = interactive && selectedSignal[selectedMode] === r.id;
      const classes = [selected ? 'selected' : '', i ? 'exit-continuation' : ''].filter(Boolean).join(' ');
      const attrs = interactive
        ? ` data-signal-id="${r.id}" tabindex="0" aria-selected="${selected}" title="点击定位信号K线并标记该行进出场"`
        : '';
      return `<tr${attrs}${classes ? ` class="${classes}"` : ''}>
        ${i === 0 ? shared : ''}
        <td>${fmtTime(exit.time)}</td>
        <td>${exit.price != null ? Number(exit.price).toFixed(2) : '-'}</td>
        <td title="${exitEventsDesc(r)}">${exit.label}</td>
        <td>${exit.lots != null ? exit.lots : '-'}</td>
        <td class="${pnlCls}" title="${exits.length > 1 ? (exit.type ? '本次出场盈亏' : '剩余持仓浮盈') + '；整笔交易合计：' + totalTxt : '整笔交易盈亏'}">${pnlTxt}</td>
      </tr>`;
    }).join('');
  }).join('');
}

function renderTable() {
  const rows = filteredRows();
  if (!sigRows.some(r=>r.mode===selectedMode&&r.id===selectedSignal[selectedMode])) {
    selectedSignal[selectedMode] = null;
    locateMessages[selectedMode] = '';
  }
  el('locate-status').textContent = locateMessages[selectedMode] || '点击记录，定位到 TradingView 的信号K线并标记该行进出场与支阻位';
  // 仅排列展示副本；无盈亏的记录始终置后，相同盈亏保持原始顺序。
  const sort = modePnlSort[selectedMode];
  el('pnl-header').ariaSort = sort;
  el('sort-pnl').textContent = '盈亏 ' + ({none:'↕',descending:'↓',ascending:'↑'}[sort]);
  el('sort-pnl').title = {none:'点击按整笔交易盈亏从高到低排序',descending:'点击按整笔交易盈亏从低到高排序',ascending:'点击恢复默认顺序'}[sort];
  renderSummary(rows);
  if (sort !== 'none') {
    rows.sort((a, b) => {
      const aValue = a.pnl == null ? NaN : Number(a.pnl);
      const bValue = b.pnl == null ? NaN : Number(b.pnl);
      const aValid = Number.isFinite(aValue), bValid = Number.isFinite(bValue);
      if (!aValid || !bValid) return aValid ? -1 : bValid ? 1 : 0;
      return sort === 'ascending' ? aValue - bValue : bValue - aValue;
    });
  }
  el('sig-body').innerHTML = signalRowsHtml(rows);
  const modeCount=sigRows.filter(r=>r.mode===selectedMode).length;
  el('count').textContent = rows.length === modeCount
    ? `共 ${modeCount} 条`
    : `筛选 ${rows.length} / 共 ${modeCount} 条`;
  updateBtSaveButton();
}

function togglePnlSort() {
  modePnlSort[selectedMode] = {none:'descending',descending:'ascending',ascending:'none'}[modePnlSort[selectedMode]];
  renderTable();
}

function finishLocate(job) {
  if (!locatePending || job?.jobId !== locatePending.jobId || job.state === 'running') return;
  const mode = locatePending.mode;
  if (job.state === 'done') {
    // 单行标记结果：定位成功后同一任务内已画该行进出场箭头+支阻横线
    const mk = job.result.mark;
    const markTxt = mk?.error ? `（标记未画：${mk.error}）`
      : mk?.skipped ? `（${mk.skipped}，不画标记）`
      : mk ? `并标记 ${mk.drawn} 个` : '';
    locateMessages[mode] = `${locateLabel(mode, job.id)} 已定位${markTxt} · ${job.result.symbol} · ${job.result.markRes} · ${fmtTime(job.result.time)}`;
  } else {
    locateMessages[mode] = `${locateLabel(mode, job.id)} 定位失败：${job.error || '未知错误'}`;
  }
  locatePending = null;
  clearTimeout(locatePoll);
  updateMarkButtons();
  renderTable();
}

async function pollLocate() {
  if (!locatePending?.jobId) return;
  const pending = locatePending;
  try {
    const response = await fetch('/api/signals/locate');
    if (!response.ok) throw Error('状态查询失败');
    const data = await response.json();
    if (locatePending !== pending) return;
    if (!data.job || data.job.jobId !== pending.jobId) {
      finishLocate({...pending,state:'error',error:'定位状态已失效，服务可能已重启，请重试'});
    } else finishLocate(data.job);
  } catch (e) {
    if (locatePending === pending) {
      locateMessages[pending.mode] = `${locateLabel(pending.mode, pending.id)} 定位状态连接中断，正在重新查询…`;
      renderTable();
    }
  }
  if (locatePending === pending) locatePoll = setTimeout(pollLocate, 2000);
}

async function locateRow(id) {
  if (locatePending) return;
  const mode = selectedMode;
  if (!sigRows.some(r=>r.id===id&&r.mode===mode)) return;
  selectedSignal[mode] = id;
  if (markBusy || isAnyModeRunning()) {
    locateMessages[mode] = '图表正被任务占用，请结束运行或暂停中的任务，并等待图表操作完成后再定位';
    renderTable();
    return;
  }
  const pending = {mode,id};
  locatePending = pending;
  locateMessages[mode] = `${locateLabel(mode, id)} 定位并标记中…（历史数据加载最多等待360秒）`;
  renderTable();
  updateMarkButtons();
  try {
    // 单行标记颜色随工具条取色器（与「标记进出场」按钮同源）
    const response = await fetch('/api/signals/locate', {
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,id,colors:{
        buy:el('mark-color-buy').value, sell:el('mark-color-sell').value,
        exit:el('mark-color-exit').value, sr:el('mark-color-sr').value
      }})
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw Error(data.error || '定位请求失败');
    pending.jobId = data.job.jobId;
    // Query immediately too: a fast completion event may precede the POST response.
    pollLocate();
  } catch (e) {
    locateMessages[mode] = `${locateLabel(mode, id)} 定位失败：${e.message}`;
    locatePending = null;
    updateMarkButtons();
    renderTable();
  }
}

function bindSignalRows() {
  const activate = event => {
    if (event.type === 'keydown' && !['Enter',' '].includes(event.key)) return;
    const row = event.target.closest('tr[data-signal-id]');
    if (!row) return;
    if (event.type === 'keydown') event.preventDefault();
    locateRow(Number(row.dataset.signalId));
  };
  el('sig-body').onclick = activate;
  el('sig-body').onkeydown = activate;
}

// ---------- 状态更新 ----------
function setBadge(m, s) {
  const b = el(`badge-${m}`);
  b.textContent = s;
  b.className = 'badge' + (s === 'running' || s === 'done' ? ' running'
    : s === 'paused' ? ' paused' : s === 'error' ? ' error' : '');
  const running = ['running', 'paused'].includes(s);
  el(`btn-start-${m}`).disabled = running || (state.active && state.active !== m);
  el(`btn-pause-${m}`).disabled = s !== 'running';
  el(`btn-resume-${m}`).disabled = s !== 'paused';
  el(`btn-stop-${m}`).disabled = !running;
  if (state.active && state.active !== m) {
    el(`btn-start-${m}`).disabled = true;
  }
  if (m === 'backtest') updateBtSaveButton();
}

function applyStatus(status) {
  state.active = status.active;
  for (const [m, w] of Object.entries(status.modes)) {
    if (!state.modes[m]) state.modes[m] = {};
    state.modes[m] = w;
    setBadge(m, w.state);
    if (w.error) addLog(m, `错误：${w.error}`);
    const bar = el(`bar-${m}`);
    const p = w.progress || {};
    if (p.pct != null) { bar.style.width = p.pct + '%'; el(`plabel-${m}`).textContent = `${p.current}/${p.total} (${p.pct}%)`; }
    else { bar.style.width = w.state === 'running' ? '100%' : '0%'; el(`plabel-${m}`).textContent = ''; }
  }
  updateMarkButtons();
}

function addLog(m, msg) {
  logs[m].push(msg);
  if (logs[m].length > 200) logs[m].shift();
  const box = el(`log-${m}`);
  box.textContent = logs[m].join('\n');
  box.scrollTop = box.scrollHeight;
}

// ---------- 控制调用 ----------
async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json();
  if (!r.ok || !data.ok) {
    alert(data.error || `请求失败 ${r.status}`);
    return null;
  }
  return data;
}

function collectCfg(m) {
  const cfg = {};
  document.querySelectorAll(`#card-${m} [data-cfg]`).forEach(inp => {
    const v = inp.value;
    cfg[inp.dataset.cfg] = v === 'true' ? true : v === 'false' ? false : v;
  });
  if (m === 'backtest') {
    cfg.signal_mode = 'realtime';
    // data_source 三选映射回后端旧语义：cache → use_cache=true（store/live 走新字段）
    cfg.use_cache = (cfg.data_source === 'cache');
  }
  cfg.periods = String(cfg.periods || '').split(',').map(s => s.trim()).filter(Boolean);
  // 30秒级别开关：开启时向 periods 追加 30S（只落盘最近3天数据，供 3 分钟进场背驰检测）
  if (cfg.with_30s === true && !cfg.periods.includes('30S')) cfg.periods.push('30S');
  if (cfg.with_30s === false) cfg.periods = cfg.periods.filter(p => p !== '30S');
  return cfg;
}

// ---------- 周期多选下拉 ----------
// 勾选变化 → 按 PERIOD_OPTIONS 固定顺序同步隐藏 input（data-cfg="periods"）与按钮文案
function syncMs(ms) {
  const checked = [...ms.querySelectorAll('[data-ms-opt]')]
    .filter(c => c.checked).map(c => c.value);
  const values = PERIOD_OPTIONS.filter(p => checked.includes(p));
  ms.querySelector('.ms-value').textContent = values.length ? values.join(',') : '请选择周期';
  ms.querySelector('input[data-cfg="periods"]').value = values.join(',');
}
function closeAllMsPanels(except) {
  document.querySelectorAll('.ms-panel').forEach(p => {
    const ms = p.closest('.ms');

    p.hidden = true;

// 清空指定功能的信号记录：服务端删除 + 本地过滤；历史方案不受影响
async function clearModeRows(mode) {

function bindCard(m) {

    // 全量回测启动前自动清空本轮信号表格，避免新旧行混在一起

// ---------- SSE ----------
function connectSSE() {
  const es = new EventSource('/api/stream');
  es.addEventListener('locate_done', e => finishLocate(JSON.parse(e.data)));
  es.onopen = () => console.log('SSE 已连接');
  es.onerror = () => { /* 自动重连 */ };
  es.addEventListener('init', e => applyStatus(JSON.parse(e.data)));
  es.addEventListener('status', e => {
    const d = JSON.parse(e.data);
    // 守卫：只认三模式自身的 status（其他模块如 data 拉取可能占用 active，但不发本事件）
    if (!MODES.some(x => x.id === d.mode)) return;
    applyStatus({ active: state.active, modes: { [d.mode]: { ...state.modes[d.mode], state: d.state } } });
  });
  es.addEventListener('log', e => {
    const d = JSON.parse(e.data);
    if (d.mode === 'mark') {
      setMarkStatus(d.msg);
      return;
    }
    // 守卫：支阻调试页（mode=sr）的日志/进度不发到三模式控制台页
    if (d.mode !== 'backtest' && d.mode !== 'replay' && d.mode !== 'live') return;
    addLog(d.mode, d.msg);
  });
  es.addEventListener('mark_done', e => {
    const d = JSON.parse(e.data);
    markBusy = false;
    stopMarkWatchdog();
    updateMarkButtons();
    const doneTxt = d.op === 'draw' ? '标记完成'
                  : d.op === 'sr_draw' ? '支阻位标记完成'
                  : '已清除标记' + (d.removed != null ? `（${d.removed} 个）` : '');
    const errTag = d.op === 'draw' ? '标记失败：' : d.op === 'sr_draw' ? '支阻标记失败：' : '清除失败：';
    setMarkStatus(d.error ? errTag + d.error : doneTxt, !!d.error);
  });
  es.addEventListener('signal', e => {
    const d = JSON.parse(e.data);
    const row = d.row;
    const idx = sigRows.findIndex(r => r.id === row.id);
    if (idx >= 0) sigRows[idx] = row; else sigRows.push(row);
    renderTable();
  });
  es.addEventListener('progress', e => {
    const d = JSON.parse(e.data);
    if (!MODES.some(x => x.id === d.mode)) return;  // 守卫：非本页模式的进度忽略
    if (!state.modes[d.mode]) state.modes[d.mode] = {};
    state.modes[d.mode].progress = { current: d.current, total: d.total, pct: d.pct };
    const bar = el(`bar-${d.mode}`);
    if (d.pct != null) { bar.style.width = d.pct + '%'; el(`plabel-${d.mode}`).textContent = `${d.current}/${d.total} (${d.pct}%)`; }
  });
  es.addEventListener('signals_cleared', e => { const d=JSON.parse(e.data);sigRows=d.mode?sigRows.filter(r=>r.mode!==d.mode):[];renderTable(); });
}

// 表单默认名与服务端 default_name 同式：品种 + 起始日期 + 保存时刻

async function saveBtRun() {

// ---------- 记录区 TAB 切换（进场信号记录 / 历史回测方案） ----------
let activeRecordTab = 'signals';
function showRecordTab(tab) {
  activeRecordTab = tab;

  el('record-bt').hidden = !bt;

async function refreshBtRuns() {
  try {
    const d = await (await fetch('/api/bt/runs')).json();
    if (!d.ok) throw Error(d.error || '未知错误');
    btRuns = d.runs || [];
    [...btCompareSel].forEach(id => { if (!btRuns.some(r => r.id === id)) btCompareSel.delete(id); });
    renderBtRuns();
  } catch (e) {
    el('bt-runs-status').textContent = '列表加载失败：' + e.message;

}

function renderBtRuns() {
  el('bt-runs-status').textContent = btRuns.length
    ? `${btRuns.length} 个方案 · 保存于本地数据库（data/bars.db），不受清空表格与服务重启影响`
    : '暂无保存的方案';
  const body = el('bt-runs-body');
  if (!btRuns.length) {
    body.innerHTML = `<tr><td colspan="13" style="color:var(--muted);white-space:normal;">回测完成后点卡片上的「保存方案」；已保存方案与当前信号表格互不影响</td></tr>`;
  } else {
    body.innerHTML = btRuns.map(r => {
      const s = r.summary || {};
      return `<tr data-id="${r.id}">
        <td><input type="checkbox" data-bt-check="${r.id}"${btCompareSel.has(r.id) ? ' checked' : ''} aria-label="对比勾选 ${esc(r.name)}"></td>

        <td>${fmtTime(r.saved_at)}</td>
        <td>${esc(r.cfg_summary?.symbol || '-')}</td>
        <td>${esc(r.cfg_summary?.periods || '-')}</td>
        <td>${esc(r.cfg_summary?.from || '-')}</td>
        <td>${s.closed ?? '-'}</td>
        <td>${s.win_rate != null ? s.win_rate + '%' : '—'}</td>
        <td>${s.payoff_ratio != null ? s.payoff_ratio.toFixed(2) : '—'}</td>
        <td class="${pnlClass(s.total)}">${fmtPnlText(s.total)}</td>
        <td>${r.signal_count}</td>

        <td class="bt-actions">

          <button data-bt-act="load" title="把该方案的参数回填到表单（不自动启动）">载参数</button>

function onBtRunsClick(e) {
  const btn = e.target.closest('button[data-bt-act]');
  if (!btn) return;
  const id = btn.closest('tr[data-id]')?.dataset.id;
  const run = btRuns.find(r => r.id === id);
  if (!run) return;
  const act = btn.dataset.btAct;
  if (act === 'detail') openBtDetail(run.id);
  else if (act === 'load') loadBtCfg(run);
  else if (act === 'rename') renameBtRun(run);

}

function onBtRunsCheck(e) {
  const c = e.target.closest('input[data-bt-check]');
  if (!c) return;
  if (c.checked) btCompareSel.add(c.dataset.btCheck); else btCompareSel.delete(c.dataset.btCheck);
  updateBtCompareButton();
  if (!el('bt-compare-view').hidden) renderBtCompare();
}

function updateBtCompareButton() {

// ---------- 对比矩阵（数据全部来自列表缓存里的固化 summary，无额外请求） ----------
const BT_METRICS = [
  ['已平仓数', s => s.closed ?? '-'],
  ['盈 / 亏', s => `${s.win ?? '-'} / ${s.lose ?? '-'}`],
  ['胜率', s => s.win_rate != null ? s.win_rate + '%' : '—'],
  ['盈亏比', s => s.payoff_ratio != null ? s.payoff_ratio.toFixed(2) : (s.win ? '∞' : '—')],
  ['已平仓盈亏', s => `<span class="${pnlClass(s.realized)}">${fmtPnlText(s.realized)}</span>`],
  ['浮盈', s => `<span class="${pnlClass(s.floating)}">${fmtPnlText(s.floating)}</span>`],
  ['合计', s => `<b class="${pnlClass(s.total)}">${fmtPnlText(s.total)}</b>`],
  ['出场分布', s => `保损 ${s.exits?.stopBe ?? 0} · 止损 ${s.exits?.stopSr ?? 0} · 全平 ${s.exits?.close ?? 0}${s.exits?.half ? ' · 半平 ' + s.exits.half : ''}`],
  ['信号总数', s => s.rows_total ?? '-'],
  ['未成交信号', s => s.cnt_signal ?? '-'],
  ['持仓中', s => s.cnt_open ?? '-'],
  ['同向过滤', s => s.cnt_filtered ?? '-'],
];
// 参数对比展示顺序与汉化（键为保存的规范化 cfg 字段名）
const BT_CFG_KEYS = ['symbol', 'from', 'periods', 'data_source', 'lead_days', 'warmup', 'lots',
                     'slip_stop', 'slip_fallback', 'slip_be', 'near', 'sr_preset',
                     'diverge_confirm', 'expect_bi', 'with_30s'];
const BT_CFG_LABELS = { symbol: '品种', from: '起始日期', periods: '周期', data_source: '数据源',
                        lead_days: '预热提前(天)', warmup: '预热根数', lots: '手数', slip_stop: '止损滑点', slip_fallback: '兜底止损滑点',
                        slip_be: '保本滑点', near: '近支阻阈值', sr_preset: '支阻预设', diverge_confirm: '背驰进场', expect_bi: '检测周期够笔', with_30s: '30秒级别' };
function btCfgVal(k, v) {
  if (k === 'periods') return Array.isArray(v) ? v.join('+') : (v ?? '—');
  if (k === 'data_source') return { store: '本地数据存储', live: '实时拉取', cache: '本地缓存' }[v] || v || '—';
  if (typeof v === 'boolean') return v ? '开' : '关';
  return v ?? '—';
}

function renderBtCompare() {
  const view = el('bt-compare-view');
  const runs = [...btCompareSel].map(id => btRuns.find(r => r.id === id)).filter(Boolean);
  if (runs.length < 2) { view.innerHTML = ''; view.hidden = true; return; }

    `<tr><th>${label}</th>${runs.map(r => `<td>${get(r.summary || {})}</td>`).join('')}</tr>`).join('');

// ---------- 载参数：collectCfg 的逆映射（只回填表单，不自动启动） ----------
function loadBtCfg(run) {
  const cfg = run.cfg || {};
  const card = el('card-backtest');
  card.querySelectorAll('[data-cfg]').forEach(inp => {
    const k = inp.dataset.cfg;
    if (k === 'periods' || k === 'with_30s' || !(k in cfg)) return;  // 这两项由 periods 推导
    inp.value = typeof cfg[k] === 'boolean' ? String(cfg[k]) : cfg[k];
  });
  const periods = Array.isArray(cfg.periods) ? cfg.periods : [];
  card.querySelectorAll('[data-ms-opt]').forEach(c => { c.checked = periods.includes(c.value); });
  syncMs(card.querySelector('.ms'));
  card.querySelector('[data-cfg="with_30s"]').value = String(periods.includes('30S'));
  addLog('backtest', `已载入方案参数：${run.name}（未自动启动，确认后点「启动」）`);
}

async function renameBtRun(run) {
  const name = prompt('新的方案名称：', run.name);
  if (name === null || !name.trim()) return;
  const r = await api('/api/bt/runs/rename', { id: run.id, name: name.trim() });
  if (r) refreshBtRuns();
}

async function deleteBtRun(run) {
  if (!confirm(`删除方案「${run.name}」？不可恢复；不影响当前信号表格。`)) return;
  try {
    const resp = await fetch(`/api/bt/runs?id=${encodeURIComponent(run.id)}`, { method: 'DELETE' });
    const d = await resp.json();
    if (!resp.ok || !d.ok) throw Error(d.error || `请求失败 ${resp.status}`);
  } catch (e) { alert(e.message); return; }
  refreshBtRuns();
}

function bindBtRuns() {
  el('btn-bt-save').onclick = saveBtRun;
  el('btn-bt-refresh').onclick = refreshBtRuns;
  el('btn-bt-compare').onclick = () => {
    const v = el('bt-compare-view');
    v.hidden = !v.hidden;
    if (!v.hidden) renderBtCompare();
  };
  el('bt-runs-body').onclick = onBtRunsClick;
  el('bt-runs-body').onchange = onBtRunsCheck;
  el('bt-detail-close').onclick = closeBtDetail;
  el('bt-detail-modal').onclick = e => { if (e.target === el('bt-detail-modal')) closeBtDetail(); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !el('bt-detail-modal').hidden) closeBtDetail();
  });
}

// ---------- 初始化 ----------
// 支阻预设下拉：选项来自 /api/sr/presets（与 /sr 调试页、工作台共享同一预设源）。
// 叠加层（fib/BOLL）开关只存在于 /sr 预设里（srTypes）——回测页不再单独提供叠加开关：
// 选预设 = 预设的 srTypes；默认 = 引擎默认（密集区+BOLL）。
async function loadSrPresetOptions() {
  const sel = document.querySelector('#card-backtest [data-cfg="sr_preset"]');
  if (!sel) return;
  try {
    const r = await fetch('/api/sr/presets').then(x => x.json());
    (r.presets || []).forEach(p => {
      const o = document.createElement('option');
      o.value = p.name; o.textContent = p.name;
      sel.appendChild(o);
    });
  } catch (e) { /* 预设列表拉取失败：保留「默认」选项，不影响回测 */ }
}

async function init() {
  el('cards').innerHTML = MODES.map(buildCard).join('');
  MODES.forEach(m => bindCard(m.id));
  // 周期多选下拉：点击按钮开合，点击面板外收起；勾选变化即同步隐藏 input
  document.addEventListener('click', e => {
    const toggle = e.target.closest('[data-ms-toggle]');
    if (toggle) {
      const ms = toggle.closest('.ms');
      const open = ms.querySelector('.ms-panel').hidden;
      closeAllMsPanels(ms);
      ms.querySelector('.ms-panel').hidden = !open;
      toggle.setAttribute('aria-expanded', String(open));
      return;
    }
    if (!e.target.closest('.ms')) closeAllMsPanels(null);
  });
  document.addEventListener('change', e => {
    if (e.target.matches?.('[data-ms-opt]')) syncMs(e.target.closest('.ms'));
  });
  selectMode(selectedMode);
  loadSrPresetOptions();
  el('mode-nav').onclick=e=>{const b=e.target.closest('[data-mode]');if(b)selectMode(b.dataset.mode)};
  if(parent!==window)parent.postMessage({type:'modes-ready'},location.origin);
  el('btn-clear').onclick = () => clearModeRows(selectedMode);
  el('filter-status').onchange = () => renderTable();
  // 策略/方向多选过滤：勾选变化 → 更新按钮文案与当前模式的筛选记忆 → 重渲染
  document.querySelectorAll('[data-sig-opt]').forEach(c => c.onchange = () => {
    syncSigFilter(c.closest('.ms').id.replace('filter-', ''));
    modeFilters[selectedMode] = sigFilterCurrent();
    renderTable();
  });
  el('sort-pnl').onclick = togglePnlSort;
  // 记录区 TAB：进场信号记录 / 历史回测方案
  document.querySelectorAll('[data-record-tab]').forEach(b => {
    b.onclick = () => showRecordTab(b.dataset.recordTab);
  });
  bindSignalRows();
  bindBtRuns();
  el('btn-mark-draw').onclick = async () => {
    if (markBusy || isAnyModeRunning()) return;
    markBusy = true;
    updateMarkButtons();
    setMarkStatus('标记中...');
    startMarkWatchdog();
    const colors = { buy: el('mark-color-buy').value, sell: el('mark-color-sell').value,
                     exit: el('mark-color-exit').value };
    const r = await api('/api/marks/draw', { colors,mode:selectedMode });
    if (!r) { markBusy = false; stopMarkWatchdog(); updateMarkButtons(); setMarkStatus('标记请求失败', true); }
  };
  el('btn-sr-draw').onclick = async () => {
    if (markBusy || isAnyModeRunning()) return;
    markBusy = true;
    updateMarkButtons();
    setMarkStatus('支阻标记中...');
    startMarkWatchdog();
    const r = await api('/api/marks/sr_draw', { mode:selectedMode, colors: { sr: el('mark-color-sr').value } });
    if (!r) { markBusy = false; stopMarkWatchdog(); updateMarkButtons(); setMarkStatus('支阻标记请求失败', true); }
  };
  el('btn-mark-clear').onclick = async () => {
    if (markBusy || isAnyModeRunning()) return;
    markBusy = true;
    updateMarkButtons();
    setMarkStatus('清除中...');
    startMarkWatchdog();
    const r = await api('/api/marks/clear');
    if (!r) { markBusy = false; stopMarkWatchdog(); updateMarkButtons(); setMarkStatus('清除请求失败', true); }
  };
  updateMarkButtons();
  const status = await (await fetch('/api/status')).json();
  sigRows = (await (await fetch('/api/signals')).json()).rows || [];
  applyStatus(status);
  renderTable();
  connectSSE();
  reportModes();
  setInterval(reportModes,1000);
}
init();
</script>
<script>
if (new URLSearchParams(location.search).has("embed")) { document.body.classList.add("embedded"); }
</script>
