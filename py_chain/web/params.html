<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参数配置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.6 "Segoe UI",system-ui,sans-serif;padding:14px 18px}
h1{font-size:19px;color:#fff}
h1 .sub{color:var(--muted);font-weight:400;font-size:12px;margin-left:10px}
/* 顶层品种 TAB（全局上下文）在上，模块 TAB 在下 */
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:12px 0 0;flex-wrap:wrap}
.stabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);font-size:13px;padding:8px 16px;cursor:pointer}
.stabs button:hover{color:var(--text)}
.stabs button.on{border-color:#55d7b0;color:#92d1b4;font-weight:600}
.stabs button .scode{color:var(--muted);font-size:11px;margin-left:6px;font-weight:400}
.stabs button.on .scode{color:#6aa89a}
/* 模块横向TAB（分组入口在工作台左侧导航「参数配置」子菜单；本页经 ?group=/postMessage 过滤TAB） */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0;flex-wrap:wrap}
.ptabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);font-size:13px;padding:8px 16px;cursor:pointer}
.ptabs button:hover{color:var(--text)}
.ptabs button.on{border-color:var(--accent);color:#bad4ff;font-weight:600}
.pane{padding-top:14px}
.pane iframe{display:block;width:100%;height:calc(100vh - 64px);border:0;border-radius:8px;background:var(--card)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px 16px;max-width:1180px}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:7px 10px;cursor:default}
.prow.break-before{grid-column:1}  /* 从第1列起排=在此参数前换行（行内其余卡片宽度不变；trendRes 前断行→参考周期行） */
/* 「标记进出场」组标题行：占满整行把下一组卡片挤到新视觉行，右侧细线延伸填充 */
.pgroup{grid-column:1/-1;color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:8px;margin-top:4px}
.pgroup::after{content:'';flex:1;border-top:1px solid var(--border)}
.pgroup:first-child{margin-top:0}
.prow .pname{flex:1;min-width:0}
.prow .plabel{color:var(--text);font-size:12.5px;display:block}
.prow .pdef{color:var(--muted);font-size:11px}
.prow .pdef .pnew{color:#ffe566}
.prow.mod{border-color:#7a5c1e;background:#1d1a10}
.prow .badge{display:none;background:#3d3208;color:var(--warn);font-size:10px;padding:0 6px;
  border-radius:8px;margin-left:6px;border:0}
.prow.mod .badge{display:inline-block}
.prow input[type=number]{width:86px;text-align:right}
.prow input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.prow select{background:var(--bg);color:var(--text);border:1px solid var(--border);
  border-radius:4px;padding:3px 6px;font-size:12px}
/* 多选参数（逗号串）：复选框组（fxma entryRes/pointClasses 等） */
.multi-opts{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:flex-end;max-width:60%}
.multi-opts .ms-opt{display:flex;align-items:center;gap:4px;color:var(--text);font-size:12px;white-space:nowrap}
.prow.dim{opacity:.45}
.prow.dim input,.prow.dim select{pointer-events:none}
.prow .zs-side{display:flex;align-items:center;gap:12px;flex-shrink:0}
.prow .zs-side .zs-draw{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12.5px;white-space:nowrap}
.prow .zs-side .zs-keep{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
  .prow .zs-side .zs-keep.dim{opacity:.45}
  .prow .zs-side .zs-keep.dim input,.prow .zs-side .zs-keep.dim select{pointer-events:none}
/* 画笔：顶底分形不能包含，一张卡片里放各周期单根长K豁免点数 */
.prow.span-all{grid-column:1/-1;flex-direction:column;align-items:stretch;gap:8px}
.prow .period-fields{display:flex;flex-wrap:wrap;gap:8px 14px}
.prow .period-fields label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12.5px;white-space:nowrap}
.prow .period-fields input{width:72px;text-align:right}
/* 画笔：总开关卡（长影线修复/单根长K豁免）关闭时子参数变灰（数值仍随表单保存，只是不参与判定） */
.prow .keep-fields{display:flex;flex-wrap:wrap;gap:8px 14px}
.prow .keep-fields.dim{opacity:.45}
.prow .keep-fields.dim input{pointer-events:none}
/* 出场方式合卡（够笔止盈两源：背驰周期/检测周期各一行 开关+比例） */
.prow.exit-group{flex-direction:column;align-items:stretch;gap:6px}
.prow.exit-group .exit-row{display:flex;align-items:center;gap:8px}
.prow.exit-group .exit-row .ename{flex:1;min-width:0;color:var(--text);font-size:12.5px}
.prow.exit-group .exit-row .ename .pdef{margin-left:8px}
.prow.exit-group .exit-row .zs-keep{display:flex;align-items:center;gap:6px;color:var(--muted);
  font-size:12px;white-space:nowrap;flex-shrink:0}
.prow.exit-group .exit-row .zs-keep.dim{opacity:.45}
.prow.exit-group .exit-row .zs-keep.dim input{pointer-events:none}
.prow.exit-group .exit-row.lmod .ename{color:var(--warn)}
/* 锁定盈利：占满一行。左标题+一行说明，右两个数值收成一组，避免半列竖排和整行留白 */
.prow.lock-exit{grid-column:1/-1;align-items:center}
.prow.lock-exit .pname{display:flex;flex-direction:column;gap:1px;min-width:0}
.prow.lock-exit .plabel{display:flex;align-items:center}
.prow.lock-exit .lock-pri{margin-left:8px;font-size:10px;line-height:1.5;font-weight:400;
  color:#8fb3e8;border:1px solid #2f5e9e;border-radius:8px;padding:0 6px}
.prow.lock-exit .pdef{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.prow.lock-exit .lock-fields{display:flex;align-items:center;flex-shrink:0;margin-left:16px;
  background:var(--input);border:1px solid var(--border);border-radius:6px;padding:3px 2px}
.prow.lock-exit .lock-field{display:flex;align-items:center;gap:6px;color:var(--muted);
  font-size:12px;white-space:nowrap;padding:0 10px}
.prow.lock-exit .lock-field + .lock-field{border-left:1px solid var(--border)}
.prow.lock-exit .lock-field input{width:68px}
.prow.lock-exit .lock-fields.dim{opacity:.45}
.prow.lock-exit .lock-fields.dim input{pointer-events:none}
/* 滑点行内嵌 ATR 系数小输入框（无独立参数行） */
.prow .slip-k{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11.5px;white-space:nowrap;flex-shrink:0}
.prow .slip-k input{width:64px;text-align:right}
/* fxma 止盈三卡：圆点单选（points=固定点数 / structure=组合模式，两张新卡共用） */
.prow .tp-dot{width:15px;height:15px;border-radius:50%;border:2px solid #6b7a90;display:inline-block;
  flex:none;cursor:pointer;align-self:center;background:transparent}
.prow .tp-dot:hover{border-color:var(--accent)}
.prow .tp-dot.on{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}
.prow.tp-card.sel{border-color:#2f5e9e}
.prow.tp-card .tp-tag{display:inline-block;font-size:10px;color:#8fb3e8;border:1px solid #2f5e9e;
  border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:1px}
.pfoot{display:flex;gap:10px;align-items:center;margin:14px 0 0;flex-wrap:wrap}
.pfoot .state{color:var(--muted);font-size:11px}
.pnote{color:var(--muted);font-size:12px;margin-top:10px;max-width:1180px}
.prules{margin-top:14px;max-width:1180px;background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:10px 14px}
.prules h3{font-size:13px;color:#bad4ff;margin-bottom:6px}
.prules ol{margin:0 0 0 18px;color:var(--muted);font-size:12px}
.prules li{margin:3px 0}
.prules b{color:var(--text);font-weight:600}
.plogic{margin-top:14px;max-width:1180px;background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:0 14px}
.plogic summary{cursor:pointer;padding:10px 0;color:#bad4ff;font-size:13px;font-weight:600}
.plogic summary:hover{color:var(--accent)}
.plogic .lbody{padding:0 0 12px}
.plogic h4{font-size:13px;color:#bad4ff;margin:14px 0 6px}
.plogic h4 .lsub{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:8px}
.plogic .lcap{color:var(--muted);font-size:11.5px;margin:0 0 6px}
.plogic .ldiagram{background:var(--card-2,#131c29);border:1px solid var(--border);border-radius:6px;
  padding:10px;overflow-x:auto}
.plogic .ldiagram svg{max-width:100%;height:auto;display:block;margin:0 auto}
.plogic .ldiagram svg foreignObject{overflow:visible}   /* 中文宽度估算偏小时防裁字 */
.plogic .ldiagram svg span.edgeLabel{padding:1px 3px}
.plogic .ltable{border-collapse:collapse;width:100%;font-size:12px;margin:4px 0}
.plogic .ltable th,.plogic .ltable td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
.plogic .ltable th{color:#bad4ff;background:var(--card-2,#131c29);font-weight:600}
.plogic .lnote{color:var(--muted);font-size:11.5px;margin:6px 0 0}
.plogic .llast{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.plogic ol.lrules{margin:2px 0 6px 18px;color:var(--muted);font-size:11.5px}
.plogic ol.lrules li{margin:3px 0}
.plogic ol.lrules b{color:var(--text);font-weight:600}
.plogic .ltable.flash{outline:2px solid var(--accent);outline-offset:2px}
.plogic .ldiagram .node.tbl-link{cursor:pointer}
.plogic .ldiagram .node.tbl-link:hover polygon,.plogic .ldiagram .node.tbl-link:hover rect{filter:brightness(1.3)}
.toast{position:fixed;right:18px;bottom:18px;background:#1f4aa8;color:#fff;border-radius:6px;
  padding:8px 16px;font-size:12.5px;opacity:.96}
.toast.err{background:#5a1d1d}
</style>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/legacy-theme.css">
</head>
<body>
<h1>参数配置<span class="sub">顶层选品种，横向TAB选模块（分组由工作台左侧导航「参数配置」子菜单切换：基础组件 / 交易策略）；画笔/买卖点/进出场算法阈值保存后对该品种即时生效，其余下一轮任务生效</span></h1>
<nav class="stabs" id="symbolTabs" aria-label="品种"></nav>
<nav class="ptabs" id="tabs" aria-label="参数模块"></nav>
<div class="pane" id="pane-sr" hidden><iframe id="srFrame" title="支阻位参数" loading="lazy"></iframe></div>
<div class="pane" id="pane-form">
  <div class="pgrid" id="pgrid"></div>
  <div class="pfoot">
    <button class="primary" id="saveBtn">保存本模块</button>
    <button id="resetBtn">恢复默认</button>
    <span class="state" id="stateLine"></span>
  </div>
  <p class="pnote" id="noteLine"></p>
  <div class="prules" id="rulesBlock" hidden></div>
  <div class="plogic" id="logicBlock" hidden>
    <details id="logicDetails">
      <summary>交易计划逻辑图解（怎么判震荡/趋势 → 怎么定方向和策略 → 交给进出场）</summary>
      <div class="lbody" id="logicBody"></div>
    </details>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const PARAM_MODULES = ['chan', 'zs', 'points', 'entry', 'plan'];
const TAB_IDS = ['chan', 'zs', 'points', 'sr', 'plan', 'entry'];
// 左侧树形菜单（与 module_registry / analysis-catalog 一致）：
// 基础公用组件（各策略共用的结构计算） + 交易策略（缠论V1：支阻位/交易计划/标记进出场；
// 支阻位 2026-09-29 起归属策略——参数按方案单选生效；未来新策略在此追加组）
// 分组入口在工作台左侧导航「参数配置」子菜单（三轮调整）：本页经 ?group= 或
// postMessage{type:'params-group'} 只显示该组页签；无 group（直连 /params.html）= 全部平铺
const TAB_GROUPS = [
  { id: 'base', label: '基础组件', tabs: [['chan', '画笔'], ['zs', '画中枢'], ['points', '标记买卖点']] },
  { id: 'strategy', label: '交易策略 · 缠论V1', tabs: [['sr', '支阻位'], ['plan', '交易计划'], ['entry', '标记进出场'], ['chain', '周期链']] },
  { id: 'fxma', label: '交易策略 · 强分型均线V1', tabs: [['fxmaBase', '基本参数'], ['fxmaEntry', '进场条件']] },
];
const TABS = TAB_GROUPS.flatMap(g => g.tabs);
const GROUP_IDS = TAB_GROUPS.map(g => g.id);

// fxma 双页签（2026-10-08 重构）：基本参数 / 进场条件。两页签同属 fxma 模块，
// 保存按模块合并语义只动本页键；恢复默认清整个模块桶（两页签一起还原）。
// 黄金分割 2026-10-09 移入基本参数（独立硬门槛，不参与计票）；背驰与条件组合互斥
const FXMA_BASE_KEYS = ['entryRes', 'pointClasses', 'pointValidBars', 'stopPts', 'tpPts',
                        'sameBarPriority', 'mutexScope', 'lots', 'upperDirOn', 'pred2On',
                        'fibNearOn', 'fibLevels', 'fibNearPts'];
// 进场条件分组：组标题行 + 组内键序；'X+Y'=启用开关+条件性质并入一张卡，'maPairN'=均线对快/慢并卡
const FXMA_ENTRY_GROUPS = [
  ['条件组合（三选N）', ['entryPick1', 'entryPick2', 'entryPick2x', 'entryPick3', 'entryPick3x']],
  ['均线分离', ['maOn+maReq', 'maType', 'maPair1', 'maPair2', 'crossMinPts']],
  ['收盘站线', ['maStandOn+maStandReq', 'maStand1', 'maStand2']],
  ['强分型', ['strongFxOn+strongFxReq', 'strongFxMinPts']],
  ['次级别背驰', ['divLowerOn', 'divLowerWinBars']],
];
const TAB_MODULE = { fxmaBase: 'fxma', fxmaEntry: 'fxma' };   // 页签 id → 参数模块 id（缺省=自身）
const tabModule = (name) => TAB_MODULE[name] || name;
let modules = {}, active = 'chan', activeSymbol = 'XAUUSD', toastTimer;
let activeGroup = null;   // 'base' | 'strategy' | null（全部平铺）
const visibleTabs = () => (TAB_GROUPS.find(g => g.id === activeGroup) || { tabs: TABS }).tabs;
function setGroup(gid) {
  activeGroup = GROUP_IDS.includes(gid) ? gid : null;
  if (visibleTabs().some(([id]) => id === active)) { drawTabs(); return; }
  const first = visibleTabs()[0];
  if (first) switchTab(first[0]);   // 当前模块不在组内 → 切到组内第一个（switchTab 内含 drawTabs）
}

// 模块逻辑规则说明（renderModule 时渲染在参数网格下方；顺势规则已并入图解表2 标题下方，
// 与 trading_plan.trend_direction 同步维护）
const MODULE_RULES = {};

// ============ 进出场逻辑图解（仅「进出场」页签显示；与 trading_plan.py/mark_entry.py 同步维护） ============
// 2026-10-16 起交易计划策略行取消：开单链路 = 买卖点直连进出场（表3），交易计划只剩
// 震荡（表1）/顺势（表2）两项判定，默认均关闭。
// 占位符：{RANGE_REF} 震荡参考周期名 / {TREND_REF} 顺势参考周期名 / {LOWER} 低于参考周期的周期列表
// （展开时按 modules.plan.effective 的 rangeRes/trendRes 实时替换，配置改动后重开页签即刷新）
const LOGIC_BODY = `
<h4>图 · 进出场主干流程<span class="lsub">买卖点直连（2026-10-16）；每个检测周期买卖双侧各判一遍，具体逻辑见表1~表3</span></h4>
<div class="lcap" id="capRange"></div>
<div class="ldiagram" id="dia1"></div>
<p class="lnote">带蓝框的节点可点击，跳到对应的表。</p>
<p class="lnote">笔窗口：买卖点只看最近60笔（上限，老结构不参与）；至少2笔（下限，笔太少连高低结构都搭不起来）；恰好2笔能判震荡、但找买卖点至少要3笔，找不到即走「无锚」分支不进场。</p>
<p class="lnote">「贴着笔端点」＝先看最后一笔终点、再逐笔向前；对得上＝时间差≤1根K、价格差≤max(ATR×0.2, 0.05)。买卖两侧各自向前找最新买族/卖族锚，并行独立评估，多空可同时持仓。</p>
<p class="lnote">不进场的三类原因：跟着{RANGE_REF}震荡观望 / 无买卖点锚 / 检测周期≥参考周期（只作锚）——谁说了算见表1。</p>
<h4>表1 · 怎么判「震荡」<span class="lsub">小周期不自己判，只看参考周期判的结果（rangeRes 选「关闭」时：所有周期都不判震荡）</span></h4>
<table class="ltable" id="t1a">
<tr><th>情况</th><th>怎么判</th></tr>
<tr><td>周期比参考周期小（{LOWER}）</td><td>自己不判，全听{RANGE_REF}的：震荡→跟着观望；非震荡→直接当趋势；{RANGE_REF}笔不足2笔→直接观望（数据不足）</td></tr>
<tr><td>{RANGE_REF}自己和比它大的周期（日线）</td><td>固定观望：只作锚（给小周期定震荡结果、给顺势定方向），不参与交易、不做判定</td></tr>
<tr><td>rangeRes ＝ 关闭（2026-10-12）</td><td>没有参考周期、没有「只作锚」。日线、4小时和更低周期都不自己判①横盘/②中枢，直接走趋势分支找买卖点（是否发信号另看 trendRes）</td></tr>
</table>
<div class="lcap">{RANGE_REF}怎么判自己震不震荡——下面两个条件满足任意一个就算震荡；小周期跟着这个结果走（本页可分别开关关闭某一类）：</div>
<table class="ltable" id="t1b">
<tr><th>条件</th><th>大白话</th><th>具体口径</th></tr>
<tr><td>① 横盘</td><td>最近40根K挤在一条窄带里，最近几笔涨跌交替没一边倒；但最后一笔已经冲出窄带→正在突破，不算横盘</td><td>①40根K最高−最低 ≤ 5×ATR；②窗口内最近4笔端点极差 ≤ 7×ATR、涨跌都有、无连续3笔同向；③末笔越过窄带另一端 &gt;1×ATR → 直接算趋势</td></tr>
<tr><td>② 待在箱体里</td><td>价格正待在一个还没走完的箱子里，上不去下不来</td><td>最近一个中枢（至少5笔搭成、不跨上一级笔端点）还没离开，当前价在箱顶箱底之间</td></tr>
</table>
<p class="lnote">注：①②只在 rangeRes 开启时，用来给{RANGE_REF}算震荡结果（数据用它自己的K线和笔，箱体条件的上一级笔=日线笔）；判出震荡时更低周期一并观望。rangeRes 关闭后，任何周期的计划行都不走这两类。参数配置页「横盘判定 / 中枢内判定」开关可独立关闭某一类（关闭横盘后其阈值变灰仍保留数值）。</p>
<p class="lnote">ATR＝最近14根K平均每根的波动幅度（含跳空），即「一根K正常晃多大」。5×ATR＝总波动不超过5根K的正常波动；行情波动大时窄带自动放宽。</p>
<p class="lnote"><b>预期笔规则：</b>下跌够笔且底分型确认，即预期上涨并立即参与下级买点、中枢及方向判断；合并后满5块才通过够笔进场门槛。上涨与顶分型完全镜像。活动端点不作为已确认一买/一卖，所有判断使用已收盘数据。</p>
<h4>表2 · 顺势方向怎么定<span class="lsub">只放行顺着参考周期方向的单</span></h4>
<ol class="lrules">
<li>取<b>参考周期（{TREND_REF}）最近一个买卖点</b>作方向锚；参考周期自身不再产生进场信号，更低周期（{LOWER}）只做锚方向的单。</li>
<li><b>1买/1卖</b>：端点后出现<b>强分型</b>才确立方向——只比实体、不含影线：底分型右肩收盘 &gt; 左肩开盘，顶分型右肩收盘 &lt; 左肩开盘。</li>
<li><b>非一类买卖点</b>（2买/类2买/3买/类3买、2卖/类2卖/3卖/类3卖）：出现即确立方向（点锚定的笔本身已够笔成笔）。</li>
<li><b>破坏闩锁（最优先）</b>：确立后参考周期<b>收盘价</b>跌破买点端点价 / 涨破卖点端点价 → 反向（下跌/上涨延续），闩锁至下一个买卖点事件（价格收回也不翻回）。</li>
<li><b>相位判定</b>（「方向相位判定」参数，默认开）：锚点确立后、没被收盘破坏期间方向<b>不锁死</b>，按相位表走——先看<b>形成段</b>（延伸中的末笔）朝哪、<b>够不够笔</b>，再看<b>位置</b>（中枢上/下沿、前低/前高）和<b>当前笔角度</b>（平均每根点数 &gt; 45°基准＝强）。可能判出「<b>观望</b>」：多空都放行，信号仍带注记。关闭参数＝旧行为（确立方向锁到闩锁/新点）。</li>
<li><b>回退</b>：无买卖点、或1类点强分型未出现时，按最近一笔方向（末笔向上→只做多 / 向下→只做空）。</li>
<li>参考周期无笔数据 → 不过滤（多空照常）；回测信号列表方向列显示锚方向与成因，如 <b>多（{TREND_REF}1卖转多预期）</b>、<b>多（{TREND_REF}1卖近中枢观望）</b>。</li>
</ol>

<p class="lnote">强分型（1类点的反转确认）只比实体、不含影线：底分型右肩收盘高于左肩开盘；顶分型右肩收盘低于左肩开盘。</p>
<p class="lnote">「破坏」＝买点后某根收盘跌破买点价 / 卖点后某根收盘涨破卖点价；掉头锁定后价格收回来也不翻回，直到下一个买卖点。</p>
<p class="lnote">相位判据大白话：<b>形成段</b>＝当前结构段（含普通底/顶分型确认后的预期段）；<b>够笔</b>＝从形成段起点所在合并块起 ≥5 块（包含起点，「M4够笔K线数」参数）。</p>
<p class="lnote"><b>角度/力度</b>＝同一口径：当前笔平均每根的点数 &gt;「相位角度45°基准(点/根)」参数（默认5）＝强（相当于与水平线夹角 &gt;45°），≤＝弱；下跌角度、反弹力度、回调力度都用它。</p>
<p class="lnote"><b>近中枢上/下沿</b>＝当前段极值离「锚点前最近一个中枢」的箱顶(ZG)/箱底(ZD) ≤「相位近位容差(点)」参数（默认5点，绝对点数）；上沿和下沿结论相同，合在一起判；没有这样的中枢 → 按「其他位置」。<b>前低/前高</b>（只用于2/3类锚点）＝锚点前最近的低点/高点笔端点，容差同上。</p>
<p class="lnote"><b>观望</b>＝方向不拦（多空都放行），但信号仍带注记（如 多（{TREND_REF}1卖后方向不明））。<b>买侧完全镜像</b>：1买/2\\3买后多空互换、前低↔前高、反弹↔回调，注记如 空（{TREND_REF}1买转空预期）、空（{TREND_REF}1买强回）、多（{TREND_REF}2买预期）。</p>
<p class="lnote" id="trendNote"></p>
<h4>表3 · 买卖点 → 进场策略键直映射（2026-10-16 买卖点直连；计划文案中转取消）</h4>

<p class="lnote">1类点 2026-10-16 起统一走直接档 1Buy/1Sell（此前已收笔1买→等回调做2买、仅形成中走直接档的口径废除）。原计划层三档路由/未定型滚动翻档/跨侧兜底（如弱2买转等一卖）已删除；Like2Buy/Like2Sell 键保留但无映射入口。</p>
<p class="lnote">二买族（2买/类2买、2卖/类2卖）按点上的强弱二分：强走 2Buy/2Sell（强二买不再要求过前高，0 轴闸看「强二买0轴闸」参数），弱和未定走 2BuyBear/2SellBear（抬低/压低回调，不抄破前低/前高）。买点前那笔上涨一旦走完并且过高，会从弱翻成强；卖侧镜像。</p>
<p class="lnote">三/四类族 2026-10-24 起也拆强弱：弱=点后同向腿背驰（弱3=2类后上推腿对1类后反弹腿、弱4=3类后上推腿对2类后上推腿，卖侧镜像；判不出即强），弱走 3BuyBear/3SellBear/BuyBear/SellBear。</p>
<p class="lnote"><b>强弱怎么判</b>（只对二买族，卖侧镜像）：看买点所在下跌笔紧挨着的前一笔上涨，拿它的高点和再往前一笔上涨的高点比。已走完且更高＝强；已走完但没更高＝弱；还在走，或前面没有可比较的上涨笔＝先按弱。这是价格比较，不看 MACD。</p>
<p class="lnote">买卖两侧各自向前找最新买点、最新卖点，两侧并行独立评估，多空可以各有一笔持仓。</p>
<p class="lnote"><b>定了进场键之后</b>还要过进出场条件（笔够不够、低级别有没有背驰、离支阻位近不近、键自己的专属条件）才发信号。回测/监控记录里的「策略」显示的就是键名。以上口径回测/实盘/监控引擎与工作台分析页（JS）一致。rangeRes 关闭时无震荡闸，各周期直接走买卖点。</p>
<p class="lnote llast"><b>顺势/逆势</b>（出场阶梯分支用）：2Buy/Buy/3Buy 及卖侧镜像＝顺势；1Buy/1Sell（一买卖直接档）与 2BuyBear/2SellBear（弱二买卖）＝逆势。按进场键判定（原「计划方向」口径随计划策略行取消）。</p>`;

const DIA_MAIN = `flowchart LR
    REF["参考周期（{RANGE_REF}）<br/>判震荡"]
    REF --> TRD["非震荡（表2 顺势过滤照常可用）"]
    REF --> RNG["震荡（表1）"]
    TRD --> PLAN["小周期买卖点锚→进场键<br/>（表3 直映射）"]
    RNG --> WAIT["观望"]
    classDef watch fill:#131c29,stroke:#f0b90b,color:#e7edf7
    classDef done fill:#13221c,stroke:#92d1b4,color:#e7edf7
    classDef link stroke:#8eb7ff,stroke-width:2.5px
    class WAIT watch
    class PLAN done
    class TRD,RNG,PLAN,WAIT link`;

const REF_OPTS = { '240': '4小时', 'D': '日线' };
const LOWER_OPTS = { '240': '1小时/15分钟/3分钟', 'D': '4小时/1小时/15分钟/3分钟' };
const MERMAID_THEME = {
  startOnLoad: false,
  theme: 'base',
  themeVariables: {
    background: '#10151e',
    fontFamily: '"Segoe UI","Microsoft YaHei",sans-serif',
    fontSize: '13px',
    primaryColor: '#243247',
    primaryBorderColor: '#8eb7ff',
    primaryTextColor: '#e7edf7',
    secondaryColor: '#19212e',
    secondaryBorderColor: '#3c4d65',
    secondaryTextColor: '#e7edf7',
    tertiaryColor: '#131c29',
    lineColor: '#99a9c0',
    edgeLabelBackground: '#19212e',
    mainBkg: '#19212e',
    textColor: '#e7edf7',
  },
  flowchart: { htmlLabels: true, nodeSpacing: 34, rankSpacing: 46, padding: 8 },
};
let logicKey = '';

function logicRefs() {
  const eff = (moduleView('plan') || {}).effective || {};
  const rr = String(eff.rangeRes != null ? eff.rangeRes : ''), tr = String(eff.trendRes != null ? eff.trendRes : '');
  const rOn = !!REF_OPTS[rr], tOn = !!REF_OPTS[tr];
  return {
    rr, tr, rOn, tOn,
    RANGE_REF: rOn ? REF_OPTS[rr] : '参考周期',
    TREND_REF: tOn ? REF_OPTS[tr] : '参考周期',
    LOWER: LOWER_OPTS[rr] || '更低周期',
  };
}

const fillTpl = (s, refs) => s.replaceAll('{RANGE_REF}', refs.RANGE_REF)
  .replaceAll('{TREND_REF}', refs.TREND_REF).replaceAll('{LOWER}', refs.LOWER);

function loadMermaid() {
  if (window.mermaid) return Promise.resolve();
  if (loadMermaid._p) return loadMermaid._p;
  loadMermaid._p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/mermaid.min.js';
    s.onload = resolve;
    s.onerror = () => { loadMermaid._p = null; reject(new Error('mermaid.min.js 加载失败')); };
    document.head.appendChild(s);
  });
  return loadMermaid._p;
}

// 图节点 → 对应表（点击跳转并高亮；mermaid 节点组 id 形如 <渲染id->flowchart-<KEY>-<n>，故按尾部匹配）
const NODE_TABLE = { TRD: 't2', RNG: 't1b', PLAN: 't3', WAIT: 't1a' };
function bindNodeLinks(svgRoot) {
  svgRoot.querySelectorAll('.node').forEach(g => {
    const m = /flowchart-([A-Za-z0-9_]+)-\d+$/.exec(g.id || '');
    const target = m && NODE_TABLE[m[1]];
    if (!target) return;
    g.classList.add('tbl-link');
    g.addEventListener('click', () => {
      const t = document.getElementById(target);
      if (!t) return;
      t.scrollIntoView({ behavior: 'smooth', block: 'center' });
      t.classList.remove('flash');
      void t.offsetWidth;  // 重启高亮过渡
      t.classList.add('flash');
      setTimeout(() => t.classList.remove('flash'), 1600);
    });
  });
}

async function ensureLogic() {
  const refs = logicRefs();
  const key = refs.rr + '|' + refs.tr;
  if (key === logicKey) return;  // 已按当前配置渲染过
  $('logicBody').innerHTML = fillTpl(LOGIC_BODY, refs);
  $('capRange').textContent = refs.rOn
    ? `当前配置：震荡判定参考周期 rangeRes ＝ ${refs.RANGE_REF}（可在「交易计划」页签修改；也可选「关闭」）`
    : '当前配置：rangeRes 已关闭——日线、4小时和更低周期都不判震荡，直接走买卖点';
  $('capTrend').textContent = refs.tOn
    ? `当前配置：顺势参考周期 trendRes ＝ ${refs.TREND_REF}（可在「交易计划」页签修改）`
    : '当前配置：trendRes 已关闭——整套不拦、多空都放行，下图暂不生效';
  $('trendNote').textContent = `${refs.TREND_REF}笔不足2笔时不拦（多空照常）；这套只管比${refs.TREND_REF}小的周期发信号的方向，${refs.TREND_REF}自己（及更大的周期）不再发信号。`;
  await loadMermaid();
  if (!ensureLogic.inited) { mermaid.initialize(MERMAID_THEME); ensureLogic.inited = true; }
  for (const [id, src] of [['dia1', DIA_MAIN]]) {
    const el = $(id);
    try {
      const { svg } = await mermaid.render('mmd-' + id, fillTpl(src, refs));
      el.innerHTML = svg;
      bindNodeLinks(el);
    } catch (err) {
      el.innerHTML = '<pre style="color:var(--warn);font-size:11px;margin:0">图渲染失败：' + String(err.message || err) + '</pre>';
    }
  }
  logicKey = key;  // 渲染成功后才记录，失败下次展开重试
}

$('logicDetails').addEventListener('toggle', () => {
  if (!$('logicDetails').open) return;
  ensureLogic().catch(err => toast('图解渲染失败：' + err.message, true));
});

function toast(text, err) {
  const el = $('toast');
  el.textContent = text;
  el.classList.toggle('err', !!err);
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

function timeText(t) {
  return t ? new Date(t * 1000).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false }) : '—';
}

function drawTabs() {
  // 横向TAB：只显示当前分组的模块（无分组=全部平铺）；active 高亮当前模块
  $('tabs').innerHTML = visibleTabs().map(([id, name]) =>
    `<button data-tab="${id}" class="${id === active ? 'on' : ''}" aria-pressed="${id === active}">${name}</button>`).join('');
}

/** 通知支阻 iframe 当前品种（embed 模式） */
function notifySrSymbol() {
  const frame = $('srFrame');
  if (!frame || !frame.contentWindow) return;
  frame.contentWindow.postMessage({ type: 'params-symbol', symbol: activeSymbol }, location.origin);
}

/** 当前品种下某模块的有效视图（bySymbol 分桶） */
function moduleView(name) {
  const m = modules[name];
  if (!m) return null;
  const bucket = (m.bySymbol && m.bySymbol[activeSymbol]) || {};
  const defaults = bucket.defaults || m.defaults || {};
  const schema = {};
  Object.keys(m.schema || {}).forEach((k) => {
    const spec = m.schema[k];
    schema[k] = Object.assign({}, spec, {
      default: Object.prototype.hasOwnProperty.call(defaults, k) ? defaults[k] : spec.default,
    });
  });
  return {
    schema, defaults,
    overrides: bucket.overrides || {},
    effective: bucket.effective || m.effective || {},
    savedAt: bucket.savedAt, label: bucket.label, code: bucket.code,
  };
}

function switchTab(name) {
  active = name;
  const isSr = name === 'sr';
  $('pane-sr').hidden = !isSr;
  $('pane-form').hidden = isSr;
  if (isSr) {
    const src = `/sr.html?embed=1&symbol=${encodeURIComponent(activeSymbol)}`;
    if (!$('srFrame').getAttribute('src')) $('srFrame').src = src;
    else notifySrSymbol();
  } else {
    renderModule(name);
  }
  drawTabs();
}

  } else if (spec.type === 'multi') {
    // 多选（逗号串存储）：复选框组，collect 按 data-multi 合并
    const sel = new Set(String(value ?? '').split(',').map(s => s.trim()).filter(Boolean));
    control = `<span class="multi-opts">` + (spec.choices || [])
      .map(c => `<label class="ms-opt" title="${choiceLabel(key, c)}"><input type="checkbox" data-k="${key}" data-multi value="${c}" ${sel.has(c) ? 'checked' : ''}>${choiceLabel(key, c)}</label>`).join('') + '</span>';
  } else {
    const step = spec.type === 'int' ? '1' : 'any';
    const min = spec.min != null ? ` min="${spec.min}"` : '';
    const max = spec.max != null ? ` max="${spec.max}"` : '';
    control = `<input type="number" step="${step}"${min}${max} data-k="${key}" value="${value}">`;
  }
  // 内嵌小输入框（滑点行 + ATR 系数）：collect 按 data-k 自动收集，无独立参数行
  const embedHtml = embed
    ? `<span class="slip-k" title="${embed.title}">+ ATR×<input type="number" step="any" min="${embed.min}" max="${embed.max}" data-k="${embed.key}" value="${embed.value}" aria-label="${embed.title}"></span>`
    : '';
  return `<div class="prow ${isMod ? 'mod' : ''} ${BREAK_BEFORE_KEYS.has(key) ? 'break-before' : ''}" title="${spec.desc}">
    <span class="pname"><span class="plabel">${spec.label}<span class="badge">已修改</span></span>
    <span class="pdef">${defText} · ${spec.desc || ''}</span></span>${control}${embedHtml}</div>`;
}

// 单个参数卡（含滑点行内嵌 ATR 系数；badge 在固定值或系数任一被改时亮）
function paramRow(m, key) {
  const embKey = SLIP_ATR_K[key];
  const embed = embKey ? {
    key: embKey, min: m.schema[embKey].min, max: m.schema[embKey].max,
    value: m.effective[embKey], title: m.schema[embKey].desc,
  } : null;
  const isMod = m.overrides[key] !== undefined
    || (embKey && m.overrides[embKey] !== undefined);
  return rowHtml(key, m.schema[key], m.effective[key], isMod, embed);
}

// 标记进出场：按分类分组换行（组标题占满整行 → 下一组自动起新视觉行，卡片普通宽度不变）
function entryRowsHtml(m) {
  const grouped = new Set(ENTRY_GROUPS.flatMap(([, keys]) => keys));
  EXIT_MODE_KEYS.forEach(k => grouped.add(k));   // 出场方式键由专用卡片渲染
  grouped.add('exitTrailSrc');                   // 跟踪止盈参照：并入跟踪止盈卡，不单独成行
  grouped.add('exitStopBeMode');                 // 保本位模式：并入保本止损卡，不单独成行
  grouped.add('exitLockPts');                    // 锁定盈利门槛：并入锁定盈利卡，不单独成行
  grouped.add('strong2BuyMacdOn');               // 并入「强2类买卖点黄白线」卡
  grouped.add('macdZeroTol');
  grouped.add('macdDivergeBodyOn');              // 并入「MACD背驰容差」卡
  grouped.add('macdDivergeTol');
  grouped.add('divergeSlopeOn');                 // 并入「背驰判据（先斜率后面积）」卡
  grouped.add('divergeAreaShrinkOn');
  grouped.add('divergeAreaShrinkPct');
  return ENTRY_GROUPS.map(([title, keys]) => {
    if (title === '__EXIT_MODES__') {
      return `<div class="pgroup">出场方式（至少启用一种；锁定盈利优先级最高。其余比例 = 平总仓位[初始手数]%，整数手）</div>`
        + exitModeRowsHtml(m);
    }
    return `<div class="pgroup">${title}</div>`
      + keys.map(k => k === '__STRONG2_MACD__' ? strong2MacdCardHtml(m)
        : k === '__MACD_DIVERGE__' ? macdDivergeCardHtml(m)
        : k === '__DIVERGE_V2__' ? divergeV2CardHtml(m)
        : (m.schema[k] ? paramRow(m, k) : '')).join('');
  }).join('') + Object.keys(m.schema)
    .filter(k => !grouped.has(k) && !Object.values(SLIP_ATR_K).includes(k))
    .map(k => paramRow(m, k)).join('');  // 未分组键（未来新增）尾部兜底，不丢渲染
}

// 「交易计划」2 类分组（2026-10-16 起只剩震荡/顺势——开单链路直连买卖点，策略路由
// 参数 prevHighNearPts/secondNearPts/thirdStrongTrend/weakTierByOrigin 随计划策略行删除下架；
// 组标题横线分割；键序与 param_center plan 模块一致，未列键自动排尾部兜底渲染）
const PLAN_GROUPS = [
  ['震荡', ['rangeRes', 'rangeBoundOn', 'rangeBarN', 'rangeBiN', 'rangeKMult', 'rangeBiMult', 'rangeBreakMult', 'rangeZsOn']],
  ['顺势', ['trendRes', 'trendRebound', 'reboundNearPts', 'reboundAngleRef']],
];

// 「周期链」（2026-10-23 双周期链）：链A/链B 各一组（开关 + 开单周期勾选）；
// 勾选=该周期开单（检测周期），不勾=仅结构参考（仍加载）；30S/1 为细层开关
// （勾=加载参与背驰下沉）。未列键尾部兜底渲染。
const CHAIN_GROUPS = [
  ['链A · 30秒—3分钟—15分钟—60分钟—4小时', ['chainAOn', 'chainA']],
  ['链B · 1分钟—5分钟—30分钟—4小时（启用前先在基础数据页拉取 1/5/30 周期K线）', ['chainBOn', 'chainB']],
];
function chainRowsHtml(m) {
  const grouped = new Set(CHAIN_GROUPS.flatMap(([, keys]) => keys));
  return `<div class="pgroup">勾选语义：勾=该周期作为开单周期；不勾=仅结构参考（笔/买卖点照算，不在该周期开单）。30秒/1分钟为细层开关（勾=加载）。日线不进链、始终隐式加载作参考。支阻只算检测周期（2026-10-26 起：开单周期勾选∩有已加载下级；背驰下沉与结构参考级别不算支阻，近支阻闸门/止损挂线池随之收窄）。两条链同时启用时各自独立引擎并行、持仓互不影响；链B 默认关。</div>`
    + CHAIN_GROUPS.map(([title, keys]) => `<div class="pgroup">${title}</div>`
      + keys.filter(k => m.schema[k]).map(k => paramRow(m, k)).join('')).join('')
    + Object.keys(m.schema).filter(k => !grouped.has(k)).map(k => paramRow(m, k)).join('');
}
// 链总开关关闭时：该链开单周期勾选变灰（数值仍随表单保存，只是链不参与运行）
function applyChainDim() {
  for (const onKey of ['chainAOn', 'chainBOn']) {
    const on = document.querySelector(`#pgrid [data-k="${onKey}"]`);
    if (!on) continue;
    // 开关节点所在行的下一行即该链的开单周期勾选组（CHAIN_GROUPS 渲染顺序固定）
    const row = on.closest('.prow');
    const opts = row && row.nextElementSibling
      ? row.nextElementSibling.querySelector('.multi-opts') : null;
    if (!opts) continue;
    const enabled = !!on.checked;
    opts.classList.toggle('dim', !enabled);
    opts.querySelectorAll('input').forEach(inp => { inp.disabled = !enabled; });
  }
}

// 交易计划：按 震荡/顺势 2 类分组渲染（组标题占满整行；未分组键尾部兜底，不丢渲染）
function planRowsHtml(m) {
  const grouped = new Set(PLAN_GROUPS.flatMap(([, keys]) => keys));
  return PLAN_GROUPS.map(([title, keys]) => `<div class="pgroup">${title}</div>`

    + Object.keys(m.schema).filter(k => !grouped.has(k)).map(k => paramRow(m, k)).join('');
}

    + '1小时/4小时/日线不受限，从起始日期全量绘制。窗口过大时 3m 深历史可能加载不到（自动跳过更早的笔）';

// 画笔页：小周期绘制窗口置顶；长影线/单根长K豁免/近等双顶各并成一张开关卡
// 隐藏不展示的画笔参数（2026-10-02）：仅 UI 不出卡片，schema/保存/生效链路保留
const CHAN_HIDDEN_KEYS = new Set(['fractalSideRealWick']);
function chanRowsHtml(m) {
  let html = windowDaysRowHtml(m);  // 小周期绘制窗口置顶（2026-10-02 用户指定）
  for (const key of Object.keys(m.schema)) {
    if (CHAN_HIDDEN_KEYS.has(key)) continue;  // 分型邻侧影线真实价：2026-10-14 起默认开（长影压平不能影响笔的高点归属），仍不暴露
    if (key === WICK_MASTER) {
      html += wickRowHtml(m);
      continue;
    }
    if (WICK_KEYS.has(key)) continue;  // 已并入「长影线修复」卡
    if (key === WIDE_BAR_MASTER) {
      html += wideBarRowHtml(m);
      continue;
    }
    if (WIDE_BAR_KEYS.has(key)) continue;  // 已并入「单根长K豁免」卡
    if (WINDOW_DAYS_KEYS.has(key)) continue;  // 已置顶「小周期绘制窗口」卡
    if (key === NEAR_DOUBLE_MASTER) {
      html += nearDoubleRowHtml(m);
      continue;
    }
    if (NEAR_DOUBLE_KEYS.has(key)) continue;  // 已并入「近等双顶/双底」卡
    html += paramRow(m, key);
  }
  return html;
}

function pointsRowsHtml(m) {

        <input type="number" step="any" min="${p.min}" max="${p.max}" data-k="pointValidPts" value="${m.effective.pointValidPts}" aria-label="点有效期价距">

    </span></div>`;
}

// fxma 止盈三卡（单选：points=固定点数 / structure=组合模式——主动止盈+结构跟踪
// 止损两卡共用同一选项）。圆点为样式化 span（点击写隐藏 tpMode 输入），collect
// 按隐藏输入收集；未选中的卡内输入变灰但数值仍随表单保存（同 FXMA_DIM_GROUPS）。
function fxmaTpRowsHtml(m) {
  const tp = m.schema.tpPts, near = m.schema.tpNearPts, slip = m.schema.tpTrailSlipPts;
  const mode = m.effective.tpMode;
  const modeMod = m.overrides.tpMode !== undefined;
  const dot = v => `<span class="tp-dot${mode === v ? ' on' : ''}" data-tpmode="${v}" role="radio"
    aria-checked="${mode === v}" title="选为止盈方式"></span>`;
  const num = (k, label, aria) => {
    const s = m.schema[k];
    return `<span class="zs-keep">${label}
      <input type="number" step="any" min="${s.min}" max="${s.max}" data-k="${k}" value="${m.effective[k]}" aria-label="${aria}">
    </span>`;
  };
  return `
  <div class="prow tp-card${mode === 'points' ? ' sel' : ''}${(modeMod || m.overrides.tpPts !== undefined) ? ' mod' : ''}" title="${tp.desc}">
    ${dot('points')}
    <span class="pname"><span class="plabel">止盈点数<span class="tp-tag">固定点数</span><span class="badge">已修改</span></span>
    <span class="pdef">默认 ${tp.default} 点 · 满仓一笔，盘中触价全平</span></span>
    <span class="zs-side">${num('tpPts', '点数', '止盈点数')}</span>
  </div>
  <div class="prow tp-card${mode === 'structure' ? ' sel' : ''}${(modeMod || m.overrides.tpNearPts !== undefined) ? ' mod' : ''}" title="${near.desc}">
    ${dot('structure')}
    <span class="pname"><span class="plabel">主动止盈<span class="tp-tag">组合模式</span><span class="badge">已修改</span></span>
    <span class="pdef">半仓开仓可叠两笔（同一粗类 1/2/3 不叠加、该类平仓后可再开；手数恒整数：半仓=⌊手数/2⌋）· 1/2类入场一半（至少1手）到前高/前低主动止盈，3类入场全平；目标=入场前最近已确认笔端点（不要求已识别为买卖点；亏损侧不设）</span></span>
    <span class="zs-side">${num('tpNearPts', '容差(点)', '到点容差')}</span>
  </div>
  <div class="prow tp-card${mode === 'structure' ? ' sel' : ''}${(modeMod || m.overrides.tpTrailSlipPts !== undefined) ? ' mod' : ''}" title="${slip.desc}">
    ${dot('structure')}
    <span class="pname"><span class="plabel">结构跟踪止损<span class="tp-tag">组合模式</span><span class="badge">已修改</span></span>
    <span class="pdef">默认 ${slip.default} 点 · 1/2类入场另一半走跟踪止损：3/类3/4/类4同向点出现止损只上移，触发平剩余全部</span></span>
    <span class="zs-side">${num('tpTrailSlipPts', '滑点(点)', '提损滑点')}</span>
  </div>
  <input type="hidden" data-k="tpMode" value="${mode}">`;
}

// fxma「基本参数」页签：点有效期双输入并一张卡、止盈三卡，其余按 FXMA_BASE_KEYS 平铺
function fxmaBaseRowsHtml(m) {
  let html = '';
  for (const key of FXMA_BASE_KEYS) {
    if (!m.schema[key]) continue;
    if (key === 'pointValidBars') { html += fxmaValidRowHtml(m); continue; }
    if (key === 'tpPts') { html += fxmaTpRowsHtml(m); continue; }   // 止盈三卡（含新参数）
    html += paramRow(m, key);
  }
  return html;
}

// 条件启用开关 + 必选/可选（条件性质）并入同一张卡；开关关闭时「性质」置灰（applyFxmaDim）
function fxmaCondRowHtml(m, onKey, reqKey) {
  const s = m.schema[onKey], r = m.schema[reqKey];
  if (!s) return '';
  if (!r) return paramRow(m, onKey);
  const isMod = m.overrides[onKey] !== undefined || m.overrides[reqKey] !== undefined;
  const reqSel = `<select data-k="${reqKey}" title="${r.desc}">` + (r.choices || [])
    .map(c => `<option value="${c}" ${c === m.effective[reqKey] ? 'selected' : ''}>${choiceLabel(reqKey, c)}</option>`).join('') + '</select>';
  return `<div class="prow ${isMod ? 'mod' : ''}" title="${s.desc}">
    <span class="pname"><span class="plabel">${s.label}<span class="badge">已修改</span></span>
    <span class="pdef">必选=不通过不触发 · 可选=仅计票 · 默认${choiceLabel(reqKey, r.default)}</span></span>
    <span class="zs-side">
      <label class="zs-draw"><input type="checkbox" data-k="${onKey}" ${m.effective[onKey] ? 'checked' : ''}>启用</label>
      <span class="zs-keep req-side">性质 ${reqSel}</span>
    </span></div>`;
}

// 均线对：快/慢线周期同一张卡（一类点 / 二三类点各一对）
function fxmaMaPairRowHtml(m, pair) {
  const fk = pair === 'maPair1' ? 'maFast1' : 'maFast2';
  const sk = pair === 'maPair1' ? 'maSlow1' : 'maSlow2';
  const f = m.schema[fk], s = m.schema[sk];
  if (!f || !s) return '';
  const isMod = m.overrides[fk] !== undefined || m.overrides[sk] !== undefined;
  const label = pair === 'maPair1' ? '一类点均线对' : '二三类点均线对';
  const num = (k, tag) => `<input type="number" step="1" min="${m.schema[k].min}" max="${m.schema[k].max}" data-k="${k}" value="${m.effective[k]}" aria-label="${label}${tag}线周期">`;
  return `<div class="prow ${isMod ? 'mod' : ''}" title="${f.desc}">
    <span class="pname"><span class="plabel">${label}<span class="badge">已修改</span></span>
    <span class="pdef">默认 快${f.default}/慢${s.default} · ${f.desc}</span></span>
    <span class="zs-side">
      <span class="zs-keep">快 ${num(fk)}</span>
      <span class="zs-keep">慢 ${num(sk)}</span>
    </span></div>`;
}

// fxma「进场条件」页签：分组渲染（组标题横线行 + 合并卡/普通卡）；未列键尾部兜底不丢渲染
function fxmaEntryRowsHtml(m) {
  const covered = new Set(FXMA_BASE_KEYS);
  for (const [, keys] of FXMA_ENTRY_GROUPS) for (const k of keys) {
    if (k.includes('+')) k.split('+').forEach(x => covered.add(x));
    else if (k === 'maPair1') { covered.add('maFast1'); covered.add('maSlow1'); }
    else if (k === 'maPair2') { covered.add('maFast2'); covered.add('maSlow2'); }
    else covered.add(k);
  }
  covered.add('pointValidPts');   // 已并入「点有效期」卡
  covered.add('tpMode'); covered.add('tpNearPts'); covered.add('tpTrailSlipPts');   // 已并入止盈三卡
  return FXMA_ENTRY_GROUPS.map(([title, keys]) =>
    `<div class="pgroup">${title}</div>` + keys.map(k => {
      if (k.includes('+')) { const [on, req] = k.split('+'); return fxmaCondRowHtml(m, on, req); }
      if (k === 'maPair1' || k === 'maPair2') return fxmaMaPairRowHtml(m, k);
      return m.schema[k] ? paramRow(m, k) : '';
    }).join('')).join('')
    + Object.keys(m.schema)
      .filter(k => !covered.has(k) && !Object.values(SLIP_ATR_K).includes(k))
      .map(k => paramRow(m, k)).join('');
}

// 某周期关闭绘制时：仅「最近个数」变灰（同周期开关仍可点）
const ZS_KEEP_PAIR = { drawD: 'keepD', draw240: 'keep240', draw60: 'keep60', draw15: 'keep15', draw3: 'keep3' };
// 画笔：长影线修复/单根长K豁免总开关关闭时：子参数变灰（数值仍随表单保存，只是不参与判定）
const CHAN_KEEP_MASTERS = [WICK_MASTER, WIDE_BAR_MASTER];
function applyChanMasterDim() {
  for (const master of CHAN_KEEP_MASTERS) {
    const on = document.querySelector(`#pgrid [data-k="${master}"]`);
    const wrap = document.querySelector(`#pgrid .keep-fields[data-keep-for="${master}"]`);
    if (!on || !wrap) continue;
    const enabled = !!on.checked;
    wrap.classList.toggle('dim', !enabled);
    wrap.querySelectorAll('input').forEach(inp => { inp.disabled = !enabled; });
  }
}
// 未定型点不接管关闭时：定型阈值变灰（数值仍随表单保存，只是不参与判定）
function applyAnchorDim() {
  const on = document.querySelector('#pgrid [data-k="anchorUndecidedSkip"]');
  const wrap = document.querySelector('#pgrid .zs-keep[data-keep-for="anchorUndecidedSkip"]');
  if (!on || !wrap) return;
  const enabled = !!on.checked;
  wrap.classList.toggle('dim', !enabled);
  const inp = wrap.querySelector('input');
  if (inp) inp.disabled = !enabled;
}

function applyZsKeepDim() {
  for (const drawKey of Object.keys(ZS_KEEP_PAIR)) {
    const on = document.querySelector(`#pgrid [data-k="${drawKey}"]`);
    const keepWrap = document.querySelector(`#pgrid .zs-keep[data-keep-for="${drawKey}"]`);
    if (!on || !keepWrap) continue;
    const enabled = !!on.checked;
    keepWrap.classList.toggle('dim', !enabled);
    const inp = keepWrap.querySelector('input');
    if (inp) inp.disabled = !enabled;
  }
}

// 横盘判定关闭时：5 个阈值变灰不可改（数值仍随表单保存）
const RANGE_BOUND_KEYS = ['rangeBarN', 'rangeBiN', 'rangeKMult', 'rangeBiMult', 'rangeBreakMult'];
function applyPlanRangeDim() {
  const on = document.querySelector('#pgrid [data-k="rangeBoundOn"]');
  if (on) {
    const enabled = !!on.checked;
    for (const key of RANGE_BOUND_KEYS) {
      const inp = document.querySelector(`#pgrid [data-k="${key}"]`);
      if (!inp) continue;
      inp.disabled = !enabled;
      const row = inp.closest('.prow');
      if (row) row.classList.toggle('dim', !enabled);
    }
  }
  // trendRes 关闭（选「关闭」）→ 方向相位判定组置灰（数值仍随表单保存，只是不参与判定）
  const tr = document.querySelector('#pgrid [data-k="trendRes"]');
  if (tr) {
    const trOn = tr.value !== '';
    for (const key of ['trendRebound', 'reboundNearPts', 'reboundAngleRef']) {
      const inp = document.querySelector(`#pgrid [data-k="${key}"]`);
      if (!inp) continue;
      inp.disabled = !trOn;
      const row = inp.closest('.prow');
      if (row) row.classList.toggle('dim', !trOn);
    }
  }
}

// fxma 条件开关关闭时：卡内「性质」下拉与所属参数行变灰不可改（数值仍随表单保存，只是不参与信号判定）
// 黄金分割 2026-10-09 起为独立硬门槛（无「性质」下拉，仅子参数随开关变灰）
const FXMA_DIM_GROUPS = [
  ['maOn', 'maReq', ['maType', 'maFast1', 'maSlow1', 'maFast2', 'maSlow2', 'crossMinPts']],
  ['maStandOn', 'maStandReq', ['maStand1', 'maStand2']],
  ['strongFxOn', 'strongFxReq', ['strongFxMinPts']],
  ['fibNearOn', null, ['fibLevels', 'fibNearPts']],
  ['divLowerOn', null, ['divLowerWinBars']],
  ['upperDirOn', null, []],
];
// 背驰与条件组合互斥（2026-10-09）：启用背驰时条件组合（三选N）与三条件全部行变灰
const FXMA_DIV_EXCLUSIVE_KEYS = ['entryPick1', 'entryPick2', 'entryPick2x', 'entryPick3', 'entryPick3x',
                                 'maOn', 'maReq', 'maType', 'maFast1', 'maSlow1', 'maFast2', 'maSlow2', 'crossMinPts',
                                 'maStandOn', 'maStandReq', 'maStand1', 'maStand2',
                                 'strongFxOn', 'strongFxReq', 'strongFxMinPts'];
function applyFxmaDim() {
  for (const [swKey, reqKey, keys] of FXMA_DIM_GROUPS) {
    const on = document.querySelector(`#pgrid [data-k="${swKey}"]`);
    if (!on) continue;
    if (reqKey) {
      const reqSel = document.querySelector(`#pgrid [data-k="${reqKey}"]`);
      const side = reqSel && reqSel.closest('.req-side');
      if (side) side.classList.toggle('dim', !on.checked);
    }
    for (const key of keys) {
      const inp = document.querySelector(`#pgrid [data-k="${key}"]`);
      if (!inp) continue;
      inp.disabled = !on.checked;
      const row = inp.closest('.prow');
      if (row) row.classList.toggle('dim', !on.checked);
    }
  }
  // 互斥置灰：仅在启用背驰时叠加（关闭时交回各条件自身开关控制，不反向启用）
  const divSw = document.querySelector('#pgrid [data-k="divLowerOn"]');
  if (divSw && divSw.checked) {
    for (const key of FXMA_DIV_EXCLUSIVE_KEYS) {
      const inp = document.querySelector(`#pgrid [data-k="${key}"]`);
      if (!inp) continue;
      inp.disabled = true;
      const row = inp.closest('.prow');
      if (row) row.classList.add('dim');
    }
  }
  applyTpModeDim();
}

// fxma 止盈方式三卡：未选中的卡内输入变灰（数值仍随表单保存，只是不参与判定）
// points→容差/滑点灰；structure→tpPts 灰（容差为 3类全平共用，保持可编辑）
function applyTpModeDim() {
  const holder = document.querySelector('#pgrid input[data-k="tpMode"]');
  if (!holder) return;
  const mode = holder.value;
  const dimKeys = mode === 'structure' ? ['tpPts'] : ['tpNearPts', 'tpTrailSlipPts'];
  for (const key of ['tpPts', 'tpNearPts', 'tpTrailSlipPts']) {
    const inp = document.querySelector(`#pgrid [data-k="${key}"]`);
    if (!inp) continue;
    const dim = dimKeys.includes(key);
    inp.disabled = dim;
    const row = inp.closest('.prow');
    if (row) row.classList.toggle('dim', dim);
  }
}

// 止盈三卡圆点点击：切 tpMode（写隐藏输入+圆点/卡片高亮+变灰），不整页重渲染
// （保留其他卡片未保存的编辑）
function setTpMode(mode) {
  const holder = document.querySelector('#pgrid input[data-k="tpMode"]');
  if (!holder || !['points', 'structure'].includes(mode)) return;
  holder.value = mode;
  document.querySelectorAll('#pgrid .tp-dot').forEach(d => {
    const on = d.dataset.tpmode === mode;
    d.classList.toggle('on', on);
    d.setAttribute('aria-checked', on);
  });
  document.querySelectorAll('#pgrid .tp-card').forEach(c => {
    c.classList.toggle('sel', c.querySelector('.tp-dot')?.classList.contains('on'));
  });
  applyTpModeDim();
}

function collect(name) {
  const cfg = {};
  const multi = {};
  document.querySelectorAll('#pgrid [data-k]').forEach(inp => {
    if (inp.dataset.multi !== undefined) {  // 多选：勾选值按 data-k 分组逗号合并
      if (inp.checked) (multi[inp.dataset.k] = multi[inp.dataset.k] || []).push(inp.value);
      return;
    }
    if (inp.type === 'checkbox') cfg[inp.dataset.k] = inp.checked;
    else cfg[inp.dataset.k] = inp.value;
  });
  for (const k of Object.keys(multi)) cfg[k] = multi[k].join(',');
  return cfg;
}

async function refresh() {
  const d = await (await fetch('/api/params')).json();
  modules = d.modules || {};
}

async function save(name) {
  if (name === 'sr') return;  // 支阻在 iframe 内保存
  const body = { cfg: collect(name), symbol: activeSymbol };
  const r = await fetch(`/api/params/${tabModule(name)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                 body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok || d.ok === false) { toast(d.error || '保存失败', true); return; }
  await refresh();
  drawSymbolTabs();
  renderModule(name);
  toast('已保存，下一轮任务生效');
}

async function reset(name) {
  if (name === 'sr') return;
  const modId = tabModule(name);
  const mv = moduleView(modId);
  const modName = (TABS.find(([id]) => id === name) || [])[1] || name;
  // 模块被拆成多页签时，恢复默认清整个模块桶（含其他页签的修改）
  const hint = modId !== name
    ? `恢复「${(mv && mv.label) || activeSymbol}」整个模块（含「${modName}」在内全部页签）为默认值？`
    : `恢复「${(mv && mv.label) || activeSymbol}」的「${modName}」为默认值？`;
  if (!window.confirm(hint)) return;
  const r = await fetch(`/api/params/${modId}/reset`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                       body: JSON.stringify({ symbol: activeSymbol }) });
  const d = await r.json();
  if (!r.ok || d.ok === false) { toast(d.error || '操作失败', true); return; }
  await refresh();
  drawSymbolTabs();
  renderModule(name);
  toast('已恢复默认');
}

document.addEventListener('click', e => {
  const dot = e.target.closest('.tp-dot');
  if (dot) { setTpMode(dot.dataset.tpmode); return; }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) switchTab(b.dataset.tab);
  if (b.dataset.sym && b.dataset.sym !== activeSymbol) {
    activeSymbol = b.dataset.sym;
    drawSymbolTabs();
    if (active === 'sr') notifySrSymbol();
    else renderModule(active);
  }
});
// 横盘开关 / 顺势参考周期变化时即时变灰/恢复（不立刻保存，点「保存本模块」才落盘）
document.addEventListener('change', e => {
  if (e.target && e.target.dataset
      && (e.target.dataset.k === 'rangeBoundOn' || e.target.dataset.k === 'trendRes')) applyPlanRangeDim();
  if (e.target && e.target.dataset
      && (e.target.dataset.k === 'chainAOn' || e.target.dataset.k === 'chainBOn')) applyChainDim();
  if (e.target && e.target.dataset && ZS_KEEP_PAIR[e.target.dataset.k]) applyZsKeepDim();
  if (e.target && e.target.dataset && e.target.dataset.k === 'anchorUndecidedSkip') applyAnchorDim();
  if (e.target && e.target.dataset && CHAN_KEEP_MASTERS.includes(e.target.dataset.k)) applyChanMasterDim();
  if (e.target && e.target.dataset
      && (e.target.dataset.k === 'maOn' || e.target.dataset.k === 'maStandOn'
          || e.target.dataset.k === 'fibNearOn' || e.target.dataset.k === 'upperDirOn'
          || e.target.dataset.k === 'strongFxOn' || e.target.dataset.k === 'divLowerOn')) applyFxmaDim();
  // 出场方式开关变化：同卡比例/跟踪止盈滑点即时置灰或恢复
  if (e.target && e.target.dataset
      && (EXIT_MODE_KEYS.includes(e.target.dataset.k)
          || e.target.dataset.k === 'exitTrailSlip')) applyExitModeDim();
  // 背驰面积判据开关变化：阈值输入即时置灰或恢复
  if (e.target && e.target.dataset
      && e.target.dataset.k === 'divergeAreaShrinkOn') applyDivergeDim();
});
$('saveBtn').onclick = () => save(active).catch(err => toast(err.message, true));
$('resetBtn').onclick = () => reset(active).catch(err => toast(err.message, true));

(async function init() {
  const qs = new URLSearchParams(location.search);
  if (qs.has('embed')) document.body.classList.add('embedded');
  activeGroup = GROUP_IDS.includes(qs.get('group')) ? qs.get('group') : null;
  // 工作台左侧导航切换分组 → postMessage 通知本页（不重载，未保存的编辑不丢）
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'params-group') return;
    setGroup(e.data.group);
  });
  await refresh();
  drawSymbolTabs();
  drawTabs();
  const saved = qs.get('tab');
  const ids = visibleTabs().map(([id]) => id);
  switchTab(ids.includes(saved) ? saved : ids[0]);
})().catch(err => toast(err.message, true));
</script>
