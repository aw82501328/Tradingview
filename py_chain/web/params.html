<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参数配置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.6 "Segoe UI",system-ui,sans-serif;padding:14px 18px}
h1{font-size:19px;color:#fff}
h1 .sub{color:var(--muted);font-weight:400;font-size:12px;margin-left:10px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:10px 0 0;flex-wrap:wrap}
.ptabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);font-size:13px;padding:8px 16px;cursor:pointer}
.ptabs button:hover{color:var(--text)}
.ptabs button.on{border-color:var(--accent);color:#bad4ff;font-weight:600}
.pane{padding-top:14px}
.pane iframe{display:block;width:100%;height:calc(100vh - 64px);border:0;border-radius:8px;background:var(--card)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px 16px;max-width:1180px}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:7px 10px;cursor:default}
.prow .pname{flex:1;min-width:0}
.prow .plabel{color:var(--text);font-size:12.5px;display:block}
.prow .pdef{color:var(--muted);font-size:11px}
.prow.mod{border-color:#7a5c1e;background:#1d1a10}
.prow .badge{display:none;background:#3d3208;color:var(--warn);font-size:10px;padding:0 6px;
  border-radius:8px;margin-left:6px;border:0}
.prow.mod .badge{display:inline-block}
.prow input[type=number]{width:86px;text-align:right}
.prow input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.prow select{background:var(--bg);color:var(--text);border:1px solid var(--border);
  border-radius:4px;padding:3px 6px;font-size:12px}
.prow.dim{opacity:.45}
.prow.dim input,.prow.dim select{pointer-events:none}
.prow .zs-side{display:flex;align-items:center;gap:12px;flex-shrink:0}
.prow .zs-side .zs-draw{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12.5px;white-space:nowrap}
.prow .zs-side .zs-keep{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.prow .zs-side .zs-keep.dim{opacity:.45}
.prow .zs-side .zs-keep.dim input{pointer-events:none}
.pfoot{display:flex;gap:10px;align-items:center;margin:14px 0 0;flex-wrap:wrap}
.pfoot .state{color:var(--muted);font-size:11px}
.pnote{color:var(--muted);font-size:12px;margin-top:10px;max-width:1180px}
.prules{margin-top:14px;max-width:1180px;background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:10px 14px}
.prules h3{font-size:13px;color:#bad4ff;margin-bottom:6px}
.prules ol{margin:0 0 0 18px;color:var(--muted);font-size:12px}
.prules li{margin:3px 0}
.prules b{color:var(--text);font-weight:600}
.plogic{margin-top:14px;max-width:1180px;background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:0 14px}
.plogic summary{cursor:pointer;padding:10px 0;color:#bad4ff;font-size:13px;font-weight:600}
.plogic summary:hover{color:var(--accent)}
.plogic .lbody{padding:0 0 12px}
.plogic h4{font-size:13px;color:#bad4ff;margin:14px 0 6px}
.plogic h4 .lsub{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:8px}
.plogic .lcap{color:var(--muted);font-size:11.5px;margin:0 0 6px}
.plogic .ldiagram{background:var(--card-2,#131c29);border:1px solid var(--border);border-radius:6px;
  padding:10px;overflow-x:auto}
.plogic .ldiagram svg{max-width:100%;height:auto;display:block;margin:0 auto}
.plogic .ldiagram svg foreignObject{overflow:visible}   /* 中文宽度估算偏小时防裁字 */
.plogic .ldiagram svg span.edgeLabel{padding:1px 3px}
.plogic .ltable{border-collapse:collapse;width:100%;font-size:12px;margin:4px 0}
.plogic .ltable th,.plogic .ltable td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
.plogic .ltable th{color:#bad4ff;background:var(--card-2,#131c29);font-weight:600}
.plogic .lnote{color:var(--muted);font-size:11.5px;margin:6px 0 0}
.plogic .llast{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.plogic ol.lrules{margin:2px 0 6px 18px;color:var(--muted);font-size:11.5px}
.plogic ol.lrules li{margin:3px 0}
.plogic ol.lrules b{color:var(--text);font-weight:600}
.plogic .ltable.flash{outline:2px solid var(--accent);outline-offset:2px}
.plogic .ldiagram .node.tbl-link{cursor:pointer}
.plogic .ldiagram .node.tbl-link:hover polygon,.plogic .ldiagram .node.tbl-link:hover rect{filter:brightness(1.3)}
.toast{position:fixed;right:18px;bottom:18px;background:#1f4aa8;color:#fff;border-radius:6px;
  padding:8px 16px;font-size:12.5px;opacity:.96}
.toast.err{background:#5a1d1d}
</style>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/legacy-theme.css">
</head>
<body>
<h1>参数配置<span class="sub">分模块统一管理，页签顺序与工作台一致；画笔/买卖点/进出场中的算法阈值保存后全局即时生效，其余下一轮任务生效</span></h1>
<nav class="ptabs" id="tabs" aria-label="参数模块"></nav>
<div class="pane" id="pane-sr" hidden><iframe id="srFrame" title="支阻位参数" loading="lazy"></iframe></div>
<div class="pane" id="pane-form">
  <div class="pgrid" id="pgrid"></div>
  <div class="pfoot">
    <button class="primary" id="saveBtn">保存本模块</button>
    <button id="resetBtn">恢复默认</button>
    <span class="state" id="stateLine"></span>
  </div>
  <p class="pnote" id="noteLine"></p>
  <div class="prules" id="rulesBlock" hidden></div>
  <div class="plogic" id="logicBlock" hidden>
    <details id="logicDetails">
      <summary>交易计划逻辑图解（怎么判震荡/趋势 → 怎么定方向和策略 → 交给进出场）</summary>
      <div class="lbody" id="logicBody"></div>
    </details>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const PARAM_MODULES = ['chan', 'zs', 'points', 'entry', 'plan'];
const TAB_IDS = ['chan', 'zs', 'points', 'sr', 'plan', 'entry'];
const TABS = [['chan', '画笔'], ['zs', '画中枢'], ['points', '标记买卖点'], ['sr', '支阻位'], ['plan', '交易计划'], ['entry', '标记进出场']];
let modules = {}, active = 'chan', toastTimer;

// 模块逻辑规则说明（renderModule 时渲染在参数网格下方；顺势规则已并入图解表2 标题下方，
// 与 trading_plan.trend_direction 同步维护）
const MODULE_RULES = {};

// ============ 交易计划逻辑图解（仅「进出场」页签显示；与 trading_plan.py 同步维护） ============
// 占位符：{RANGE_REF} 震荡参考周期名 / {TREND_REF} 顺势参考周期名 / {LOWER} 低于参考周期的周期列表
// （展开时按 modules.plan.effective 的 rangeRes/trendRes 实时替换，配置改动后重开页签即刷新）
const LOGIC_BODY = `
<h4>图 · 交易计划主干流程<span class="lsub">每个周期从大到小各判一遍；具体逻辑见表1~表3</span></h4>
<div class="lcap" id="capRange"></div>
<div class="ldiagram" id="dia1"></div>
<p class="lnote">带蓝框的节点可点击，跳到对应的表。</p>
<p class="lnote">笔窗口：多了只看最近60笔（上限，老结构不参与）；至少2笔（下限，笔太少连高低结构都搭不起来，只能观望）；恰好2笔能判震荡、但找买卖点至少要3笔，找不到即走「没有」分支观望。</p>
<p class="lnote">「贴着买卖点」＝先看最后一笔终点、再逐笔向前；对得上＝时间差≤1根K、价格差≤max(ATR×0.2, 0.05)。</p>
<p class="lnote">观望的四种原因：数据不足 / 跟着{RANGE_REF}等 / 无买卖点 / 只作锚——谁说了算见表1。</p>
<h4>表1 · 怎么判「震荡」<span class="lsub">小周期不自己判，只看参考周期判的结果</span></h4>
<table class="ltable" id="t1a">
<tr><th>情况</th><th>怎么判</th></tr>
<tr><td>周期比参考周期小（{LOWER}）</td><td>自己不判，全听{RANGE_REF}的：震荡→跟着观望；非震荡→直接当趋势；{RANGE_REF}笔不足2笔→直接观望（数据不足）</td></tr>
<tr><td>{RANGE_REF}自己和比它大的周期（日线）</td><td>固定观望：只作锚（给小周期定震荡结果、给顺势定方向），不参与交易、不做判定</td></tr>
<tr><td>rangeRes 未配置（必填项，正常配不到这状态）</td><td>全部周期观望</td></tr>
</table>
<div class="lcap">{RANGE_REF}怎么判自己震不震荡——下面两个条件满足任意一个就算震荡；小周期跟着这个结果走（本页可分别开关关闭某一类）：</div>
<table class="ltable" id="t1b">
<tr><th>条件</th><th>大白话</th><th>具体口径</th></tr>
<tr><td>① 横盘</td><td>最近40根K挤在一条窄带里，最近几笔涨跌交替没一边倒；但最后一笔已经冲出窄带→正在突破，不算横盘</td><td>①40根K最高−最低 ≤ 5×ATR；②窗口内最近4笔端点极差 ≤ 7×ATR、涨跌都有、无连续3笔同向；③末笔越过窄带另一端 &gt;1×ATR → 直接算趋势</td></tr>
<tr><td>② 待在箱体里</td><td>价格正待在一个还没走完的箱子里，上不去下不来</td><td>最近一个中枢（至少5笔搭成、不跨上一级笔端点）还没离开，当前价在箱顶箱底之间</td></tr>
</table>
<p class="lnote">注：{RANGE_REF}自己也按这两个条件判，数据用它自己的K线和笔（箱体条件的上一级笔=日线笔）；判出震荡时更低周期一并观望。参数配置页「①横盘判定 / ②中枢内判定」开关可独立关闭某一类（关闭横盘后其阈值变灰仍保留数值）。</p>
<p class="lnote">ATR＝最近14根K平均每根的波动幅度（含跳空），即「一根K正常晃多大」。5×ATR＝总波动不超过5根K的正常波动；行情波动大时窄带自动放宽。</p>
<h4>表2 · 顺势方向怎么定<span class="lsub">只放行顺着参考周期方向的单</span></h4>
<ol class="lrules">
<li>取<b>参考周期（{TREND_REF}）最近一个买卖点</b>作方向锚；参考周期自身不再产生进场信号，更低周期（{LOWER}）只做锚方向的单。</li>
<li><b>1买/1卖</b>：端点后出现<b>强分型</b>才确立方向——底分型右肩（第3根合并K）收盘价 &gt; 左肩（第1根合并K）最高价，顶分型镜像。</li>
<li><b>非一类买卖点</b>（2买/类2买/3买/类3买、2卖/类2卖/3卖/类3卖）：出现即确立方向（点锚定的笔本身已够笔成笔）。</li>
<li><b>破坏闩锁</b>：确立后参考周期<b>收盘价</b>跌破买点端点价 / 涨破卖点端点价 → 反向（下跌/上涨延续），闩锁至下一个买卖点事件（价格收回也不翻回）。</li>
<li><b>回退</b>：无买卖点、或1类点强分型未出现时，按最近一笔方向（末笔向上→只做多 / 向下→只做空）。</li>
<li>参考周期无笔数据 → 不过滤（多空照常）；回测信号列表方向列显示锚方向与成因，如 <b>多（{TREND_REF}2买）</b>。</li>
</ol>
<div class="lcap" id="capTrend"></div>
<table class="ltable" id="t2">
<tr><th>情况（按顺序判断）</th><th>顺势方向</th></tr>
<tr><td>{TREND_REF}笔不足2笔</td><td>不拦：多空都放行</td></tr>
<tr><td>最近60笔没有买卖点</td><td>按末笔方向：向上→只做多 / 向下→只做空</td></tr>
<tr><td>最新是1买/1卖，强分型还没出现</td><td>同上（回退末笔方向）</td></tr>
<tr><td>最新是1买/1卖，强分型已出现，之后没被收盘破坏</td><td>买点→只做多 / 卖点→只做空</td></tr>
<tr><td>最新是2买/类2买/3买/类3买或2卖/类2卖/3卖/类3卖，之后没被收盘破坏</td><td>买点→只做多 / 卖点→只做空</td></tr>
<tr><td>点之后被收盘破坏</td><td>掉头锁定：反向顺势（收复也不翻回，等下一个买卖点）</td></tr>
<tr><td>应用</td><td>信号方向与顺势方向同向→保留；反向→剔除。只管比{TREND_REF}小的周期，{TREND_REF}自己和更大周期不发信号；trendRes 关掉则整套不拦</td></tr>
</table>
<p class="lnote">强分型（1类点的反转确认）＝底部三根K，右边那根收盘冲过左边那根最高；1卖镜像（右边收盘跌破左边最低）。</p>
<p class="lnote">「破坏」＝买点后某根收盘跌破买点价 / 卖点后某根收盘涨破卖点价；掉头锁定后价格收回来也不翻回，直到下一个买卖点。</p>
<p class="lnote" id="trendNote"></p>
<h4>表3 · 买卖点 → 方向和策略</h4>
<table class="ltable" id="t3">
<tr><th>最近贴上的买卖点</th><th>附带条件</th><th>方向</th><th>接下来做什么</th></tr>
<tr><td>1卖</td><td>—</td><td>空头空（跌势做空）</td><td>等反弹后做2卖</td></tr>
<tr><td>1买</td><td>—</td><td>多头多（涨势做多）</td><td>等回调后做2买</td></tr>
<tr><td>2买/类2买/3买/类3买</td><td>冲过前高且力度没变弱</td><td>多头多</td><td>等回调后的新买点</td></tr>
<tr><td>2买/类2买/3买/类3买</td><td>没冲过前高，或力度变弱</td><td>多头空（涨势做空）</td><td>等高点附近的一卖</td></tr>
<tr><td>2卖/类2卖/3卖/类3卖</td><td>跌破前低且力度没变弱</td><td>空头空</td><td>等反弹后的新卖点</td></tr>
<tr><td>2卖/类2卖/3卖/类3卖</td><td>没破前低，或力度变弱</td><td>空头多（跌势做多）</td><td>等低点附近的一买</td></tr>
</table>
<p class="lnote">方向命名：前两个字＝现在的结构是涨是跌，后一个字＝做多还是做空。</p>
<p class="lnote"><b>附带条件怎么判</b>（只对 2类/3类点——上表「附带条件」列的三步判定，卖点全程对称）：</p>
<p class="lnote">① 找参照：买点之前时间最近的高点（卖点：之前的低点）。</p>
<p class="lnote">② 冲过了吗：买点后第一波上涨的终点 &gt; 前高（卖点：终点 &lt; 前低）。</p>
<p class="lnote">③ 力度变弱了吗：这波上涨和前一波同向上涨比 MACD——柱子总面积变小、或 DIF 峰变低、或最高柱变矮，任一个＝变弱（背驰）。</p>
<p class="lnote">结论：②过了 且 ③没变弱 →「冲过前高且力度没变弱」；任一步不过 →「其他」。</p>
<p class="lnote llast">观望的周期不出信号；定了策略的周期还要由进出场模块检查进场条件（笔够不够、低级别有没有背驰、离支阻位近不近、策略自己的条件）才发信号——那是「进出场」的事。以上是回测引擎口径；工作台分析页跑的 JS 版暂无「小周期听参考周期」这条，这点两边不同。</p>`;

const DIA_MAIN = `flowchart LR
    REF["参考周期（{RANGE_REF}）<br/>定方向"]
    REF --> TRD["趋势（表2）"]
    REF --> RNG["震荡（表1）"]
    TRD --> PLAN["小周期交易计划<br/>（{RANGE_REF}方向）（表3）"]
    RNG --> WAIT["观望"]
    classDef watch fill:#131c29,stroke:#f0b90b,color:#e7edf7
    classDef done fill:#13221c,stroke:#92d1b4,color:#e7edf7
    classDef link stroke:#8eb7ff,stroke-width:2.5px
    class WAIT watch
    class PLAN done
    class TRD,RNG,PLAN,WAIT link`;

const REF_OPTS = { '240': '4小时', 'D': '日线' };
const LOWER_OPTS = { '240': '1小时/15分钟/3分钟', 'D': '4小时/1小时/15分钟/3分钟' };
const MERMAID_THEME = {
  startOnLoad: false,
  theme: 'base',
  themeVariables: {
    background: '#10151e',
    fontFamily: '"Segoe UI","Microsoft YaHei",sans-serif',
    fontSize: '13px',
    primaryColor: '#243247',
    primaryBorderColor: '#8eb7ff',
    primaryTextColor: '#e7edf7',
    secondaryColor: '#19212e',
    secondaryBorderColor: '#3c4d65',
    secondaryTextColor: '#e7edf7',
    tertiaryColor: '#131c29',
    lineColor: '#99a9c0',
    edgeLabelBackground: '#19212e',
    mainBkg: '#19212e',
    textColor: '#e7edf7',
  },
  flowchart: { htmlLabels: true, nodeSpacing: 34, rankSpacing: 46, padding: 8 },
};
let logicKey = '';

function logicRefs() {
  const eff = (modules.plan && modules.plan.effective) || {};
  const rr = String(eff.rangeRes != null ? eff.rangeRes : ''), tr = String(eff.trendRes != null ? eff.trendRes : '');
  const rOn = !!REF_OPTS[rr], tOn = !!REF_OPTS[tr];
  return {
    rr, tr, rOn, tOn,
    RANGE_REF: rOn ? REF_OPTS[rr] : '参考周期',
    TREND_REF: tOn ? REF_OPTS[tr] : '参考周期',
    LOWER: LOWER_OPTS[rr] || '更低周期',
  };
}

const fillTpl = (s, refs) => s.replaceAll('{RANGE_REF}', refs.RANGE_REF)
  .replaceAll('{TREND_REF}', refs.TREND_REF).replaceAll('{LOWER}', refs.LOWER);

function loadMermaid() {
  if (window.mermaid) return Promise.resolve();
  if (loadMermaid._p) return loadMermaid._p;
  loadMermaid._p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/mermaid.min.js';
    s.onload = resolve;
    s.onerror = () => { loadMermaid._p = null; reject(new Error('mermaid.min.js 加载失败')); };
    document.head.appendChild(s);
  });
  return loadMermaid._p;
}

// 图节点 → 对应表（点击跳转并高亮；mermaid 节点组 id 形如 <渲染id->flowchart-<KEY>-<n>，故按尾部匹配）
const NODE_TABLE = { TRD: 't2', RNG: 't1b', PLAN: 't3', WAIT: 't1a' };
function bindNodeLinks(svgRoot) {
  svgRoot.querySelectorAll('.node').forEach(g => {
    const m = /flowchart-([A-Za-z0-9_]+)-\d+$/.exec(g.id || '');
    const target = m && NODE_TABLE[m[1]];
    if (!target) return;
    g.classList.add('tbl-link');
    g.addEventListener('click', () => {
      const t = document.getElementById(target);
      if (!t) return;
      t.scrollIntoView({ behavior: 'smooth', block: 'center' });
      t.classList.remove('flash');
      void t.offsetWidth;  // 重启高亮过渡
      t.classList.add('flash');
      setTimeout(() => t.classList.remove('flash'), 1600);
    });
  });
}

async function ensureLogic() {
  const refs = logicRefs();
  const key = refs.rr + '|' + refs.tr;
  if (key === logicKey) return;  // 已按当前配置渲染过
  $('logicBody').innerHTML = fillTpl(LOGIC_BODY, refs);
  $('capRange').textContent = refs.rOn
    ? `当前配置：震荡判定参考周期 rangeRes ＝ ${refs.RANGE_REF}（必填；可在「交易计划」页签修改）`
    : '当前配置：rangeRes 未配置（必填项）——全部周期观望，图中小周期分支暂不生效';
  $('capTrend').textContent = refs.tOn
    ? `当前配置：顺势参考周期 trendRes ＝ ${refs.TREND_REF}（可在「交易计划」页签修改）`
    : '当前配置：trendRes 已关闭——整套不拦、多空都放行，下图暂不生效';
  $('trendNote').textContent = `${refs.TREND_REF}笔不足2笔时不拦（多空照常）；这套只管比${refs.TREND_REF}小的周期发信号的方向，${refs.TREND_REF}自己（及更大的周期）不再发信号。`;
  await loadMermaid();
  if (!ensureLogic.inited) { mermaid.initialize(MERMAID_THEME); ensureLogic.inited = true; }
  for (const [id, src] of [['dia1', DIA_MAIN]]) {
    const el = $(id);
    try {
      const { svg } = await mermaid.render('mmd-' + id, fillTpl(src, refs));
      el.innerHTML = svg;
      bindNodeLinks(el);
    } catch (err) {
      el.innerHTML = '<pre style="color:var(--warn);font-size:11px;margin:0">图渲染失败：' + String(err.message || err) + '</pre>';
    }
  }
  logicKey = key;  // 渲染成功后才记录，失败下次展开重试
}

$('logicDetails').addEventListener('toggle', () => {
  if (!$('logicDetails').open) return;
  ensureLogic().catch(err => toast('图解渲染失败：' + err.message, true));
});

function toast(text, err) {
  const el = $('toast');
  el.textContent = text;
  el.classList.toggle('err', !!err);
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

function timeText(t) {
  return t ? new Date(t * 1000).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false }) : '—';
}

function drawTabs() {
  $('tabs').innerHTML = TABS.map(([id, name]) =>
    `<button data-tab="${id}" class="${id === active ? 'on' : ''}" aria-pressed="${id === active}">${name}</button>`).join('');
}

function switchTab(name) {
  active = name;
  const isSr = name === 'sr';
  $('pane-sr').hidden = !isSr;
  $('pane-form').hidden = isSr;
  if (isSr) {
    if (!$('srFrame').getAttribute('src')) $('srFrame').src = '/sr.html?embed=1';  // 懒加载（含自动调参面板）
  } else {
    renderModule(name);
  }
  drawTabs();
}

// 枚举参数的选项展示名（choices 原值提交，展示用中文）
const CHOICE_LABELS = { trendRes: { '': '关闭', '240': '4小时', 'D': '日线' },
                        rangeRes: { '240': '4小时', 'D': '日线' } };
const choiceLabel = (key, v) => (CHOICE_LABELS[key] && CHOICE_LABELS[key][v]) || v;

function rowHtml(key, spec, value, isMod) {
  const defText = spec.type === 'bool' ? (spec.default ? '默认开' : '默认关')
    : spec.type === 'str' ? `默认 ${choiceLabel(key, spec.default)}`
    : `默认 ${spec.default}`;
  let control;
  if (spec.type === 'bool') {
    control = `<input type="checkbox" data-k="${key}" ${value ? 'checked' : ''}>`;
  } else if (spec.type === 'str') {
    control = `<select data-k="${key}">` + (spec.choices || [])
      .map(c => `<option value="${c}" ${c === value ? 'selected' : ''}>${choiceLabel(key, c)}</option>`).join('') + '</select>';
  } else {
    const step = spec.type === 'int' ? '1' : 'any';
    const min = spec.min != null ? ` min="${spec.min}"` : '';
    const max = spec.max != null ? ` max="${spec.max}"` : '';
    control = `<input type="number" step="${step}"${min}${max} data-k="${key}" value="${value}">`;
  }
  return `<div class="prow ${isMod ? 'mod' : ''}" title="${spec.desc}">
    <span class="pname"><span class="plabel">${spec.label}<span class="badge">已修改</span></span>
    <span class="pdef">${defText} · ${spec.desc}</span></span>${control}</div>`;
}

// 画中枢：同周期「是否画 + 最近个数」同一行
const ZS_PERIOD_ROWS = [
  ['D', '日线', 'drawD', 'keepD'],
  ['240', '4小时', 'draw240', 'keep240'],
  ['60', '1小时', 'draw60', 'keep60'],
  ['15', '15分钟', 'draw15', 'keep15'],
  ['3', '3分钟', 'draw3', 'keep3'],
];
function zsRowsHtml(m) {
  return ZS_PERIOD_ROWS.map(([, name, drawKey, keepKey]) => {
    const dSpec = m.schema[drawKey], kSpec = m.schema[keepKey];
    const dVal = m.effective[drawKey], kVal = m.effective[keepKey];
    const isMod = m.overrides[drawKey] !== undefined || m.overrides[keepKey] !== undefined;
    const defText = `画默认${dSpec.default ? '开' : '关'} · 最近默认 ${kSpec.default}`;
    return `<div class="prow ${isMod ? 'mod' : ''}" title="${dSpec.desc}；${kSpec.desc}">
      <span class="pname"><span class="plabel">${name}<span class="badge">已修改</span></span>
      <span class="pdef">${defText}</span></span>
      <span class="zs-side">
        <label class="zs-draw"><input type="checkbox" data-k="${drawKey}" ${dVal ? 'checked' : ''}>画中枢</label>
        <span class="zs-keep" data-keep-for="${drawKey}">最近
          <input type="number" step="1" min="${kSpec.min}" max="${kSpec.max}" data-k="${keepKey}" value="${kVal}">
        </span>
      </span></div>`;
  }).join('');
}

function renderModule(name) {
  const m = modules[name];
  if (!m) return;
  $('pgrid').innerHTML = name === 'zs'
    ? zsRowsHtml(m)
    : Object.entries(m.schema)
      .map(([key, spec]) => rowHtml(key, spec, m.effective[key], m.overrides[key] !== undefined))
      .join('');
  const n = Object.keys(m.overrides).length;
  $('stateLine').textContent = `已修改 ${n} 项 · 最近保存 ${timeText(m.savedAt)}`;
  $('noteLine').textContent = {
    chan: '画笔参数保存后立即全局生效（成笔阈值，画笔/回测/监控共用）。有任务运行中时会拒绝保存。',
    points: '标记买卖点参数：邻近合并/保留数/中枢容差在工作台与回测读取；背驰时长可比上限写入 CHAN_CFG，保存后立即全局生效。有任务运行中时会拒绝保存。',
    zs: '画中枢参数在工作台「画中枢 / 更新全部」时读取：控制各周期是否绘制、以及每周期只保留最近几个中枢。',
    entry: '标记进出场参数在工作台分析与回测读取生效；进场扩展（M1/M2/M4、0轴容差）写入 CHAN_CFG，保存后立即全局生效。「当下制够笔K线数」仅回测/监控引擎使用。有任务运行中时会拒绝保存。',
    plan: '交易计划参数在工作台分析与回测运行时读取生效；「顺势参考周期」额外过滤进出场信号方向（规则见图解表2 标题下方）。下方可展开「交易计划逻辑图解」。',
  }[name] || '';
  const rules = MODULE_RULES[name];
  const rb = $('rulesBlock');
  if (rules) {
    rb.innerHTML = `<h3>${rules.title}</h3><ol>` + rules.items.map(i => `<li>${i}</li>`).join('') + '</ol>';
    rb.hidden = false;
  } else {
    rb.hidden = true;
  }
  $('logicBlock').hidden = name !== 'plan';
  if (name === 'zs') applyZsKeepDim();
  if (name === 'plan') {
    applyPlanRangeDim();
    if ($('logicDetails').open) {
      // 页签切回时参考周期配置可能已改，展开态下直接刷新图解
      ensureLogic().catch(err => toast('图解渲染失败：' + err.message, true));
    }
  }
}

// 某周期关闭绘制时：仅「最近个数」变灰（同周期开关仍可点）
const ZS_KEEP_PAIR = { drawD: 'keepD', draw240: 'keep240', draw60: 'keep60', draw15: 'keep15', draw3: 'keep3' };
function applyZsKeepDim() {
  for (const drawKey of Object.keys(ZS_KEEP_PAIR)) {
    const on = document.querySelector(`#pgrid [data-k="${drawKey}"]`);
    const keepWrap = document.querySelector(`#pgrid .zs-keep[data-keep-for="${drawKey}"]`);
    if (!on || !keepWrap) continue;
    const enabled = !!on.checked;
    keepWrap.classList.toggle('dim', !enabled);
    const inp = keepWrap.querySelector('input');
    if (inp) inp.disabled = !enabled;
  }
}

// 横盘判定关闭时：5 个阈值变灰不可改（数值仍随表单保存）
const RANGE_BOUND_KEYS = ['rangeBarN', 'rangeBiN', 'rangeKMult', 'rangeBiMult', 'rangeBreakMult'];
function applyPlanRangeDim() {
  const on = document.querySelector('#pgrid [data-k="rangeBoundOn"]');
  if (!on) return;
  const enabled = !!on.checked;
  for (const key of RANGE_BOUND_KEYS) {
    const inp = document.querySelector(`#pgrid [data-k="${key}"]`);
    if (!inp) continue;
    inp.disabled = !enabled;
    const row = inp.closest('.prow');
    if (row) row.classList.toggle('dim', !enabled);
  }
}

function collect(name) {
  const cfg = {};
  document.querySelectorAll('#pgrid [data-k]').forEach(inp => {
    if (inp.type === 'checkbox') cfg[inp.dataset.k] = inp.checked;
    else cfg[inp.dataset.k] = inp.value;
  });
  return cfg;
}

async function refresh() {
  const d = await (await fetch('/api/params')).json();
  modules = d.modules || {};
}

async function save(name) {
  const r = await fetch(`/api/params/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                 body: JSON.stringify({ cfg: collect(name) }) });
  const d = await r.json();
  if (!r.ok || d.ok === false) { toast(d.error || '保存失败', true); return; }
  await refresh();
  renderModule(name);
  toast('已保存，下一轮任务生效');
}

async function reset(name) {
  if (!window.confirm('恢复该模块全部参数为默认值？')) return;
  const r = await fetch(`/api/params/${name}/reset`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                       body: '{}' });
  const d = await r.json();
  if (!r.ok || d.ok === false) { toast(d.error || '操作失败', true); return; }
  await refresh();
  renderModule(name);
  toast('已恢复默认');
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) switchTab(b.dataset.tab);
});
// 横盘开关变化时即时变灰/恢复（不立刻保存，点「保存本模块」才落盘）
document.addEventListener('change', e => {
  if (e.target && e.target.dataset && e.target.dataset.k === 'rangeBoundOn') applyPlanRangeDim();
  if (e.target && e.target.dataset && ZS_KEEP_PAIR[e.target.dataset.k]) applyZsKeepDim();
});
$('saveBtn').onclick = () => save(active).catch(err => toast(err.message, true));
$('resetBtn').onclick = () => reset(active).catch(err => toast(err.message, true));

(async function init() {
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embedded');
  await refresh();
  drawTabs();
  const saved = new URLSearchParams(location.search).get('tab');
  switchTab(TAB_IDS.includes(saved) ? saved : 'chan');
})().catch(err => toast(err.message, true));
</script>
</body>
